        return { Mon: "Pzt", Tue: "Sal", Wed: "Çar", Thu: "Per", Fri: "Cum" }[name] || "";
      }

      /*
       * Bugün ekranı GERÇEK güne bakar. Önceden Program ekranının gün seçicisini
       * (state.day, "Örnek gün") kullanıyordu: o gün dersi olmayan öğrenciye
       * başka bir günün dersini "GÜNÜN İLK DERSİ" diye gösteriyordu.
       *
       * Bugün dersi yoksa ya da bugünkü dersler bittiyse, ders olan bir sonraki
       * gün bulunur ve kart bunu açıkça yazar ("Bugün dersin yok · Pazartesi").
       */
      function coursesOnDay(day) {
        return selectedCourses().filter(function (course) { return course.day === day && course.start; })
          .sort(function (a, b) { return a.start.localeCompare(b.start); });
      }

      /*
       * Tıp (2026-10-24, kullanıcı kararı): ders kurulu programı TARİHLİDİR — her günün konusu ve
       * öğretim üyesi farklı, ders haftalık tekrarlamaz. Öğrenci ders seçmez; dönemini seçer, o günün
       * oturumları gelir (data/med-schedule.js, tools/build-med-schedule.py). Devamsızlık ve not hesabı
       * bu düzene henüz bağlı değil.
       */
      var medData = window.UNIKAPSUL_MED_SCHEDULE || { sessions: [], sources: {} };

      function medMode() {
        var d = currentDepartment();
        return !!(d && d.id === medData.program && (medData.sessions || []).length);
      }

      function medList(date) {
        var donem = Number(state.grade) || 1;
        return (medData.sessions || []).filter(function (s) { return s.donem === donem && (!date || s.date === date); });
      }

      function medDates(from, limit) {
        var seen = [];
        medList().forEach(function (s) { if (s.date >= from && seen.indexOf(s.date) === -1) seen.push(s.date); });
        return seen.sort().slice(0, limit || 99);
      }

      function medSourceNow() {
        var donem = Number(state.grade) || 1, today = turkeyDateIso();
        var list = Object.keys(medData.sources || {}).map(function (k) { return medData.sources[k]; })
          .filter(function (src) { return src.donem === donem; })
          .sort(function (a, b) { return String(b.last_date).localeCompare(String(a.last_date)); });
        return list.find(function (src) { return src.first_date <= today && today <= src.last_date; }) || list[0] || null;
      }

      function medPlan() {
        var today = turkeyDateIso(), now = turkeyClock();
        var list = medList(today);
        var running = list.find(function (s) { return s.start <= now && now < s.end; });
        if (running) return { session: running, label: "ŞU AN DEVAM EDEN", list: list, date: today, isToday: true };
        var upcoming = list.find(function (s) { return s.start > now; });
        if (upcoming) return { session: upcoming, label: "SIRADAKİ DERS", list: list, date: today, isToday: true };
        var next = medDates(addDaysIso(today, 1), 1)[0];
        if (!next) return { session: null, label: "", list: list, date: today, isToday: true };
        var nextList = medList(next);
        var reason = list.length ? "BUGÜNKÜ DERSLERİN BİTTİ" : (isoWeekday(today) ? "BUGÜN DERSİN YOK" : "HAFTA SONU");
        return { session: nextList[0], label: reason + " · " + (next === addDaysIso(today, 1) ? "YARIN" : diningDateLabel(next).toLocaleUpperCase("tr-TR")) + " İLK DERS",
                 list: list, nextList: nextList, date: next, isToday: false };
      }

      function medRow(s, isNext) {
        return '<div class="timeline-row' + (isNext ? ' is-next' : '') + '"><span class="time">' + escapeHtml(s.start) + '<br>' + escapeHtml(s.end) + '</span><span class="rail"></span>'
          + '<div class="timeline-card"><span class="timeline-main"><span class="timeline-title">' + escapeHtml(s.title) + confirmChip(s) + '</span>'
          + '<span class="timeline-meta">' + escapeHtml([s.code, s.instructor].filter(Boolean).join(" · ") || (s.kind === "sinav" ? "Sınav" : "")) + '</span></span></div></div>';
      }

      function medDayHeading(iso) {
        return dayLong(isoWeekday(iso) || "") + " · " + diningDateLabel(iso);
      }

      function medEmptyCopy() {
        var src = medSourceNow(), today = turkeyDateIso();
        if (!src) return "Dönem " + (Number(state.grade) || 1) + " ders programı henüz eklenmedi.";
        if (src.last_date < today) return "Dönem " + src.donem + " için eklenen son kurul " + diningDateLabel(src.last_date) + " tarihinde bitti; sıradaki kurulun programı yayımlandığında burada olacak.";
        return "Önümüzdeki günlerde ders yok.";
      }

      function renderMedToday() {
        var plan = medPlan();
        var s = plan.session;
        var src = medSourceNow();
        var html = brandHeader() + deptChip()
          + (s ? '<div class="hero-course" style="cursor:default"><div class="kicker">' + escapeHtml(plan.label) + '</div><div class="hero-row"><span class="hero-icon">' + icon(currentDepartment().icon) + '</span><span class="hero-main"><span class="hero-title">' + escapeHtml(s.title) + '</span><span class="hero-meta">' + (plan.isToday ? '' : escapeHtml(medDayHeading(plan.date)) + ' · ') + escapeHtml(s.start) + '–' + escapeHtml(s.end) + '</span><span class="hero-sub">' + escapeHtml([s.code, s.instructor].filter(Boolean).join(" · ")) + '</span></span></div></div>'
              : '<div class="empty-state" style="min-height:160px"><span class="icon-tile">' + icon("calendar") + '</span><h3>Yaklaşan ders yok</h3><p>' + escapeHtml(medEmptyCopy()) + '</p></div>');
        var list = plan.isToday ? plan.list : (plan.nextList || []);
        if (list.length) {
          html += '<section class="section"><div class="section-heading"><h2>' + (plan.isToday ? 'Bugünkü program' : escapeHtml(medDayHeading(plan.date))) + '</h2><button class="text-button" data-route="program">Tümünü gör</button></div>'
            + (plan.isToday ? '' : '<p class="stepper-label" style="margin:0 0 8px">' + (isoWeekday(turkeyDateIso()) ? 'Bugün ders yok.' : 'Hafta sonu ders yok.') + ' Ders olan bir sonraki gün:</p>')
            + '<div class="panel"><div class="timeline' + (plan.isToday ? ' has-next' : '') + '">' + list.map(function (x) { return medRow(x, plan.isToday && s && x.id === s.id); }).join("") + '</div></div></section>';
        }
        if (src) html += '<p class="stepper-label" style="margin:8px 0 0">Dönem ' + src.donem + ' · ' + escapeHtml(src.kurul_name || src.kurul_code) + ' (' + escapeHtml(diningDateLabel(src.first_date)) + ' – ' + escapeHtml(diningDateLabel(src.last_date)) + ')</p>';
        html += todayDiningCard() + gradeTodayCard();
        screen.innerHTML = layout(html, "today", false);
      }

      function renderMedProgram() {
        var today = turkeyDateIso();
        var dates = medDates(today, 7);
        var src = medSourceNow();
        var html = brandHeader() + deptChip()
          + '<h1 class="page-title">Ders programım</h1>'
          + '<p class="page-lead">Dönem ' + (Number(state.grade) || 1) + (src ? ' · ' + escapeHtml(src.kurul_name || src.kurul_code) : '') + '</p>'
          + (dates.length ? dates.map(function (d) {
              return '<section class="section"><div class="section-heading"><h2>' + escapeHtml(medDayHeading(d)) + (d === today ? ' · bugün' : '') + '</h2></div>'
                + '<div class="panel"><div class="timeline">' + medList(d).map(function (x) { return medRow(x, false); }).join("") + '</div></div></section>';
            }).join("")
            : '<div class="empty-state" style="min-height:180px"><span class="icon-tile">' + icon("calendar") + '</span><h3>Yaklaşan ders yok</h3><p>' + escapeHtml(medEmptyCopy()) + '</p></div>')
          + (src ? '<div class="button-row" style="margin-top:12px"><a class="secondary-button" href="' + escapeHtml(safeOfficialUrl(src.document_url)) + '" target="_blank" rel="noopener noreferrer">Kurul programını aç</a></div>' : '');
        screen.innerHTML = layout(html, "program", false);
      }

      function nextClassPlan() {
        var todayIso = turkeyDateIso();
        var today = isoWeekday(todayIso);
        var list = today ? coursesOnDay(today) : [];
        if (list.length) {
          var now = turkeyClock();
          var running = list.find(function (course) { return course.start <= now && now < course.end; });
          if (running) return { course: running, label: "ŞU AN DEVAM EDEN", list: list, isToday: true };
          var upcoming = list.find(function (course) { return course.start > now; });
          if (upcoming) return { course: upcoming, label: "SIRADAKİ DERS", list: list, isToday: true };
        }
        var reason = list.length ? "BUGÜNKÜ DERSLERİN BİTTİ" : (today ? "BUGÜN DERSİN YOK" : "HAFTA SONU");
        for (var k = 1; k <= 7; k += 1) {
          var iso = addDaysIso(todayIso, k);
          var day = isoWeekday(iso);
          var dayList = day ? coursesOnDay(day) : [];
          if (dayList.length) {
            var when = k === 1 ? "YARIN" : dayLong(day).toLocaleUpperCase("tr-TR");
            return { course: dayList[0], label: reason + " · " + when + " İLK DERS", list: list, nextList: dayList,
                     nextDay: day, nextIso: iso, isToday: false, when: k === 1 ? "Yarın" : dayLong(day) };
          }
        }
        return { course: null, label: reason, list: list, isToday: false };
      }

      function todayHeading() {
        return new Intl.DateTimeFormat("tr-TR", { timeZone: "Europe/Istanbul", weekday: "long", day: "numeric", month: "long" }).format(new Date());
      }

      /*
       * Ana ekranların ortak üst bölümü (tasarım 2026-10-24): logo + ad, Türkiye tarihi, bildirim
       * düğmesi. Bölüm çipi seçimi değiştirme ekranına gider (Diğer'deki "Düzenle" ile aynı yer).
       */
      function brandHeader() {
        return '<div class="screen-header"><div><div class="brand"><span class="brand-mark">' + icon("cap") + '</span>ÜniKapsül</div>'
          + '<div class="screen-subtitle">' + todayHeading() + '</div></div><div class="header-actions">'
          + '<button class="icon-button" data-route="notifications" aria-label="Bildirimler">' + icon("bell")
          + (!state.notificationsRead ? '<span class="unread-dot"></span>' : "") + '</button></div></div>';
      }

      function deptChip() {
        var department = currentDepartment();
        return '<button class="dept-chip" data-route="onboarding-1" aria-label="Bölüm ve sınıfı değiştir">' + icon("cap")
          + '<span>' + escapeHtml(department.name) + ' · ' + escapeHtml(selectedGradeLabel()) + '</span>' + icon("chevron") + '</button>';
      }

      function renderToday() {
        if (medMode()) { renderMedToday(); return; }
        var department = currentDepartment();
        var plan = nextClassPlan();
        var next = plan.course;
        var conflict = conflicts()[0];
        var noSelection = !selectedCourses().some(function (course) { return course.start; });
        var timeline;
        if (noSelection) {
          timeline = "";
        } else if (plan.list.length) {
          timeline = '<h2>Bugünkü program</h2><button class="text-button" data-route="program">Tümünü gör</button></div><div class="panel"><div class="timeline' + (plan.isToday ? ' has-next' : '') + '">' + plan.list.map(function (course) { return timelineRow(course, plan.isToday && next && course.id === next.id); }).join("") + '</div></div>';
        } else if (plan.nextList) {
          timeline = '<h2>' + escapeHtml(plan.when) + ' · ' + diningDateLabel(plan.nextIso) + '</h2><button class="text-button" data-route="program">Tümünü gör</button></div>'
            + '<p class="stepper-label" style="margin:0 0 8px">' + (plan.label.indexOf("HAFTA SONU") === 0 ? "Hafta sonu ders yok." : "Bugün seçtiğin derslerden hiçbiri yok.") + ' Ders olan bir sonraki gün:</p>'
            + '<div class="panel"><div class="timeline">' + plan.nextList.map(function (course) { return timelineRow(course, false); }).join("") + '</div></div>';
        } else {
          timeline = '<h2>Bugünkü program</h2></div>' + emptyProgramCard();
        }
        var html = ''
          + brandHeader()
          + deptChip()
          + (team() ? '<button class="source-button" data-sheet="source"><span class="source-dot">i</span><span>' + sourceStatus() + '</span></button>' : '')
          + stateBanner()
          + (conflict ? '<button class="alert-card" data-route="program"><span class="icon-tile" style="background:#fff;color:var(--red)">' + icon("alert") + '</span><span><strong>' + conflictTitle(conflict) + '</strong><span>' + escapeHtml(conflict.a.name) + ' ve ' + escapeHtml(conflict.b.name) + ' · ' + escapeHtml(conflict.start) + '–' + escapeHtml(conflict.end) + '</span></span>' + icon("chevron") + '</button>' : "")
          + (next ? '<button class="hero-course" data-course="' + escapeHtml(next.id) + '"><div class="kicker">' + escapeHtml(plan.label) + '</div><div class="hero-row"><span class="hero-icon">' + icon(department.icon) + '</span><span class="hero-main"><span class="hero-title">' + escapeHtml(next.name) + '</span><span class="hero-meta">' + (plan.isToday ? '' : escapeHtml(plan.when) + ' · ') + escapeHtml(next.start) + '–' + escapeHtml(next.end) + placeCopy(next) + '</span><span class="hero-sub">' + escapeHtml(next.departmentName) + ' · ' + gradeCopy(next) + branchCopy(next) + '</span></span>' + icon("chevron") + '</div></button>' : emptyProgramCard())
          + (hasImportedRows() && timeline ? '<section class="section"><div class="section-heading">' + timeline + '</section>' : '')
          + todayDiningCard()
          + weeklyAbsenceCheck()
          + (function () {
              // Ara sınav ve devamsızlık yan yana pastel kartlar; yalnız biri varsa tek sütun.
              var tiles = [examTodayCard(), attendanceTodayCard()].filter(Boolean);
              return tiles.length ? '<section class="section"><div class="tile-grid"' + (tiles.length === 1 ? ' style="grid-template-columns:minmax(0,1fr)"' : '') + '>' + tiles.join("") + '</div></section>' : '';
            })()
          + gradeTodayCard()
          + (team() ? '<section class="section"><div class="context-grid">' + contextCard("announcement", "database", "Veri kapsamı", recordStats().total + " aday kayıt · 0 yayımlanmış", "coverage") + '</div></section>' : "");
        screen.innerHTML = layout(html, "today", false);
      }

      /*
       * Yemekhane (kullanıcı 2026-10-24: derslerin altında). Bugün menü varsa bugünü, yoksa
       * (hafta sonu, tatil) aylık listedeki sıradaki günü gösterir; liste yoksa bunu söyler.
       */
      function todayDiningCard() {
        var today = turkeyDateIso();
        var row = diningRowFor(today);
        var title = "Bugün yemekhanede", copy;
        if (row && row.service_status === "official_holiday") {
          copy = "Resmî tatil";
        } else if (row && row.items_raw && row.items_raw.length) {
          copy = row.items_raw.map(diningItemLabel).join(" · ");
        } else {
          var next = nextDiningRow(today);
          if (next && next.items_raw && next.items_raw.length) {
            title = "Yemekhane · " + diningDateLabel(next.date);
            copy = next.items_raw.map(diningItemLabel).join(" · ");
          } else {
            title = "Yemekhane";
            copy = diningCardCopy();
          }
        }
        return '<section class="section">' + agendaCard("tint-green", "utensils", title, copy, "", 'data-sheet="menu"') + '</section>';
      }

      function timelineRow(course, isNext) {
        return '<div class="timeline-row' + (isNext ? ' is-next' : '') + '"><span class="time">' + escapeHtml(course.start) + '<br>' + escapeHtml(course.end) + '</span><span class="rail"></span><button class="timeline-card" data-course="' + escapeHtml(course.id) + '"><span class="timeline-main"><span class="timeline-title">' + escapeHtml(course.name) + confirmChip(course) + '</span><span class="timeline-meta">' + escapeHtml(course.location) + branchCopy(course) + '<br>' + escapeHtml(course.departmentName) + ' · ' + gradeCopy(course) + '</span></span>' + icon("chevron") + '</button></div>';
      }

      function contextCard(className, iconName, title, copy, sheet) {
        return '<button class="info-card ' + escapeHtml(className) + '" data-sheet="' + escapeHtml(sheet) + '"><span class="icon-tile">' + icon(iconName) + '</span><span><span class="card-title">' + escapeHtml(title) + '</span><span class="card-copy">' + escapeHtml(copy) + '</span></span>' + icon("chevron") + '</button>';
      }

      /*
       * Resmî belgeye göre öğrencisi olmayan program (kaynak: sources/coverage/
       * program-source-coverage.csv, kanıt adresi katalogda). Önceden "kaynak
       * aranıyor" deniyordu; bu, programın yakında geleceği izlenimi veriyordu.
       */
      function noStudentsCard() {
        var d = currentDepartment();
        return '<div class="empty-state" style="min-height:180px"><span class="icon-tile">' + icon("info") + '</span>'
          + '<h3>Bu programa henüz öğrenci alınmadı</h3>'
          + '<p>' + escapeHtml(d.noStudentsNote || "Resmî kaynak programın aktif olmadığını belirtiyor.") + ' Bu yüzden ders programı yok; yanlış bölüm seçtiysen değiştirebilirsin.</p>'
          + '<button class="primary-button" data-sheet="source">Resmî belgeyi aç</button>'
          + '<button class="secondary-button" style="margin-top:8px" data-route="onboarding-1">Bölümü değiştir</button></div>';
      }

      function emptyProgramCard() {
        if (currentDepartment().status === "no_students") return noStudentsCard();
        if (!hasImportedRows()) {
          if (!team()) {
            return '<div class="empty-state" style="min-height:180px"><span class="icon-tile">' + icon("calendar") + '</span><h3>Ders programın henüz eklenmedi</h3><p>Bölümünün ders programı eklendiğinde derslerini buradan seçebileceksin. O zamana kadar resmî programı bölüm sayfasından görebilirsin.</p><button class="secondary-button" data-sheet="source">Bölüm sayfasını aç</button></div>';
          }
          return '<div class="empty-state" style="min-height:180px"><span class="icon-tile">' + icon("database") + '</span><h3>Ders programı aktarım bekliyor</h3><p>' + statusCopy() + '. Tahminî ders gösterilmiyor.</p><button class="secondary-button" data-sheet="source">Resmî kaynağı incele</button></div>';
        }
        var dep = currentDepartment();
        var gradeRows = coursesFor(dep).some(function (c) { return c.stage || c.grade === state.grade; });
        if (!gradeRows) {
          return '<div class="empty-state" style="min-height:180px"><span class="icon-tile">' + icon("calendar") + '</span><h3>' + escapeHtml(gradeLabelFor(dep, state.grade)) + ' ders programı henüz eklenmedi</h3><p>Eklendiğinde derslerini seçebileceksin. Alttan veya üstten aldığın dersleri şimdi de ekleyebilirsin.</p><button class="secondary-button" data-route="course-add">' + icon("plus") + ' Ders ekle</button></div>';
        }
        return '<div class="empty-state" style="min-height:180px"><span class="icon-tile">' + icon("calendar") + '</span><h3>Henüz ders seçmedin</h3><p>Programını oluşturmak için ilk dersini ekle.</p><button class="primary-button" data-route="course-add">' + icon("plus") + ' Ders ekle</button></div>';
      }

      /*
       * Hafta özeti (tasarım 2026-10-24): içinde bulunulan haftanın Pazartesi–Cuma aralığı; hafta
       * sonunda gelecek hafta. Sayılar yalnız öğrencinin seçtiği oturumlardan sayılır, uydurulmaz.
       */
      function weekSpan() {
        var iso = turkeyDateIso();
        var dow = new Date(iso + "T12:00:00Z").getUTCDay();
        var monday = addDaysIso(iso, dow === 0 ? 1 : dow === 6 ? 2 : 1 - dow);
        var friday = addDaysIso(monday, 4);
        var a = diningDateLabel(monday), b = diningDateLabel(friday);
        var label = monday.slice(0, 7) === friday.slice(0, 7) ? Number(monday.slice(8)) + "–" + b : a + " – " + b;
        return { label: label, upcoming: dow === 0 || dow === 6 };
      }

      function weekSummaryCopy(span) {
        var timed = selectedCourses().filter(function (course) { return course.day && course.start; });
        var names = {};
        timed.forEach(function (course) { names[course.name] = true; });
        var count = Object.keys(names).length;
        var head = span.upcoming ? "Gelecek hafta" : "Bu hafta";
        if (!timed.length) return head + " · henüz ders seçmedin";
        return head + " · " + count + " ders" + (timed.length !== count ? ", " + timed.length + " oturum" : "");
      }

      function programRow(course, isNext) {
        var who = instructorCopy(course.instructor);
        var meta = escapeHtml(course.location || (team() ? "Derslik kaynakta yazmıyor" : "")) + branchCopy(course)
          + (who && who !== "Belgede yazmıyor" && !course.userEntered ? "<br>" + escapeHtml(who) : "");
        return '<div class="timeline-row' + (isNext ? ' is-next' : '') + '"><span class="time">' + escapeHtml(course.start) + '<br>' + escapeHtml(course.end) + '</span><span class="rail"></span>'
          + '<button class="timeline-card" data-course="' + escapeHtml(course.id) + '"><span class="timeline-main"><span class="timeline-title">' + escapeHtml(course.name) + programTag(course) + confirmChip(course)
          + (course.userEntered ? '<span class="own-chip">senin eklediğin</span>' : '') + '</span>'
          + '<span class="timeline-meta">' + meta + '</span>' + attendanceBadge(course) + '</span>' + icon("chevron") + '</button></div>';
      }

      function renderProgram() {
        if (medMode()) { renderMedProgram(); return; }
        var days = ["Pzt", "Sal", "Çar", "Per", "Cum"];
        var department = currentDepartment();
        var imported = hasImportedRows();
        var dayCourses = selectedCourses().filter(function (course) { return course.day === state.day; }).sort(function (a, b) { return a.start.localeCompare(b.start); });
        var dayConflicts = conflicts().filter(function (item) { return item.a.day === state.day; });
        var conflict = dayConflicts[0];
        var plan = nextClassPlan();
        var nextId = plan.isToday && plan.course && plan.course.day === state.day ? plan.course.id : "";
        var span = weekSpan();
        var html = ''
          + brandHeader()
          + deptChip()
          + '<h1 class="page-title">Ders programım</h1>'
          + '<p class="page-lead">2026–2027 Güz' + (secondDepartment() ? ' · ' + escapeHtml(department.name) + ' + ' + escapeHtml(secondDepartment().name) + ' (' + escapeHtml(secondKindLabel()) + ')' : ' · Haftanı tek bakışta gör') + '</p>'
          + (team() ? '<button class="source-button" data-sheet="source"><span class="source-dot">i</span><span>' + sourceStatus() + '</span></button>' : '')
          + stateBanner()
          + (imported ? '<button class="feature-card" data-sheet="program-tools"><span class="feature-icon">' + icon("calendar") + '</span><span><span class="feature-title" style="color:var(--primary)">' + escapeHtml(span.label) + '</span><span class="feature-copy">' + escapeHtml(weekSummaryCopy(span)) + '</span></span>' + icon("chevron") + '</button>' : '')
          + (imported ? '<section class="section"><div class="section-heading"><h2>Haftalık görünüm</h2><button class="text-button" data-route="course-add">Düzenle</button></div>'
              + '<div class="weekday-row" style="margin-top:0">' + days.map(function (day) { return '<button class="weekday ' + (state.day === day ? "active" : "") + '" data-day="' + day + '">' + day + '</button>'; }).join("") + '</div>' : '')
          + (conflict ? '<button class="alert-card" data-sheet="conflict"><span class="icon-tile" style="background:#fff;color:var(--red)">' + icon("alert") + '</span><span><strong>' + conflictTitle(conflict) + '</strong><span>' + conflict.start + '–' + conflict.end + (conflict.shared ? ' · aynı saat ve derslik' : ' saatleri arasında') + (dayConflicts.length > 1 ? ' · bu gün ' + dayConflicts.length + ' uyarı' : '') + '</span></span>' + icon("chevron") + '</button>' : "")
          + (dayCourses.length
              ? '<div class="panel"><div class="timeline' + (nextId ? ' has-next' : '') + '">' + dayCourses.map(function (course) { return programRow(course, course.id === nextId); }).join("") + '</div></div>'
              : (imported ? '<div class="empty-state" style="min-height:180px"><span class="icon-tile">' + icon("calendar") + '</span><h3>Bu gün dersin yok</h3><p>Seçtiğin derslerden bu güne düşen yok.</p></div>' : emptyProgramCard()))
          + (imported ? '</section>' : '')
          + (imported && state.selected.length ? '<button class="text-button grade-all" data-route="attendance">Tüm derslerimin devamsızlığı ' + icon("chevron") + '</button>' : '')
          + (imported
              ? '<section class="section"><div class="tile-grid">'
                + '<button class="tile tint-violet" data-route="course-add"><span class="icon-tile">' + icon("plus") + '</span><span><span class="tile-title">Ders ekle</span><span class="tile-copy">Resmî listeden seç ya da kendin ekle</span></span>' + icon("chevron") + '</button>'
                + '<button class="tile tint-cream" data-sheet="export"><span class="icon-tile">' + icon("download") + '</span><span><span class="tile-title">Takvime aktar</span><span class="tile-copy">Dersler haftalık tekrarla telefon takvimine (.ics)</span></span>' + icon("chevron") + '</button>'
                + '</div></section>'
              : '<div class="button-row"><button class="primary-button" data-sheet="source">Kaynak durumu</button><button class="secondary-button" data-route="onboarding-1">Programı değiştir</button></div>');
        screen.innerHTML = layout(html, "program", false);
      }

      function attendanceBadge(course) {
        var group = groupOf(course);
        if (!group || (group.level !== "near" && group.level !== "over")) return "";
        var text = group.level === "over" ? "Devamsızlık sınırı aşılmış olabilir" : "Devamsızlıkta son ders";
        return '<span class="attendance-badge ' + group.level + '">' + icon("alert") + text + '</span>';
      }

      function scheduleCourse(course) {
        return '<button class="schedule-course" data-course="' + escapeHtml(course.id) + '"><span class="schedule-time">' + escapeHtml(course.start) + '<br>' + escapeHtml(course.end) + '</span><span><span class="schedule-name">' + escapeHtml(course.name) + programTag(course) + '</span><span class="schedule-location">' + escapeHtml(course.location) + branchCopy(course) + ' · ' + gradeCopy(course) + '</span>' + attendanceBadge(course) + '</span>' + icon("chevron") + '</button>';
      }

      /*
       * Kampüs gündemi (tasarım 2026-10-24): Tümü / Duyurular / Yemekhane / Takvim. Her kart
       * kaynağını ve durumunu söyler; duyuru izleyicisinin verisi uygulamaya yüklenmediği için
       * "Duyurular" yalnız programını besleyen resmî belgeleri gösterir. Fırsatlar sekmesi boş bir
       * "yakında" ekranıydı, kaldırıldı.
       */
      function agendaTab() {
        return ["all", "announcements", "events", "dining", "calendar"].indexOf(state.agenda) === -1 ? "all" : state.agenda;
      }

      function agendaCard(tint, iconName, title, copy, source, attr) {
        return '<button class="info-card ' + tint + '" ' + attr + '><span class="icon-tile">' + icon(iconName) + '</span>'
          + '<span><span class="card-title">' + escapeHtml(title) + '</span><span class="card-copy">' + escapeHtml(copy) + '</span>'
          + (source ? '<span class="card-copy" style="font-size:12px">' + escapeHtml(source) + '</span>' : '') + '</span>'
          + icon("chevron") + '</button>';
      }

      function renderAgenda() {
        var tab = agendaTab();
        var own = announcementEntries().filter(function (entry) { return entry.own; }).length;
        var tabs = [["all", "Tümü"], ["announcements", "Duyurular"], ["events", "Etkinlikler"], ["dining", "Yemekhane"], ["calendar", "Takvim"]];
        var html = ''
          + brandHeader()
          + '<h1 class="page-title">Kampüs gündemi</h1>'
          + '<p class="page-lead">İhtiyacın olan bilgiler bir arada</p>'
          + '<button class="feature-card" data-agenda="announcements"><span class="feature-icon">' + icon("megaphone") + '</span><span><span class="feature-title">Duyurular</span><span class="feature-copy">'
          + (own ? 'Bölümünün yayımladığı ' + (own > 1 ? own + ' duyuru' : 'duyuru') : 'Bölümün için henüz duyuru yok') + '</span></span>' + icon("chevron") + '</button>'
          + '<div class="filter-row" role="group" aria-label="Gündem filtresi" style="margin-top:16px">' + tabs.map(function (t) {
              return '<button class="segment ' + (tab === t[0] ? "active" : "") + '" data-agenda="' + t[0] + '"' + (tab === t[0] ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' + t[1] + '</button>';
            }).join("") + '</div>'
          + '<div style="margin-top:16px">' + agendaContent() + '</div>';
        screen.innerHTML = layout(html, "agenda", false);
      }

      /*
       * Gündem. Daha önce üç sekme de uydurma kayıt gösteriyordu
       * ("27 Ekim 2026 · 18 gün kaldı" gibi). Elimizde gerçekten bulunan
       * duyuru verisi, ders programını besleyen kaynak belgelerin kendisidir:
       * yayım tarihi ve duyuru adresi veri dosyasında kayıtlıdır. Akademik
       * takvim henüz arşivlenmedi; sayı uydurmak yerine eksik olduğu yazılır.
       */
      function announcementEntries() {
        var department = currentDepartment();
        var mine = {};
        courses.forEach(function (course) {
          if (course.departmentId === department.id && course.sourceId) mine[course.sourceId] = true;
        });
        var ids = Object.keys(offeringSources).filter(function (id) {
          return offeringSources[id].source_type !== "archive";
        });
        ids.sort(function (a, b) {
          var own = (mine[b] ? 1 : 0) - (mine[a] ? 1 : 0);
          if (own) return own;
          return String(offeringSources[b].source_published_at || "").localeCompare(String(offeringSources[a].source_published_at || ""));
        });
        return ids.map(function (id) {
          return { meta: offeringSources[id], own: Boolean(mine[id]) };
        });
      }

      function announcementCard(entry) {
        var meta = entry.meta;
        var units = {};
        courses.forEach(function (course) {
          if (course.sourceId === meta.source_id) units[course.departmentName] = true;
        });
        var names = Object.keys(units);
        var who = names.length > 2 ? names.length + " program" : names.join(", ");
        return '<button class="list-card" data-announcement="' + escapeHtml(meta.source_id) + '">'
          + '<span class="icon-tile">' + icon("megaphone") + '</span>'
          + '<span><span class="list-title">' + escapeHtml(who || meta.source_id) + ' haftalık ders programı'
          + (entry.own ? '<span class="own-chip">senin programın</span>' : "") + '</span>'
          + '<span class="list-meta">' + (team() ? 'Belge yayımı: ' + escapeHtml(isoDateLabel(meta.source_published_at) || "bilinmiyor") : escapeHtml(isoDateLabel(meta.source_published_at) || ""))
          + (team() ? '<br>' + escapeHtml(meta.source_version_id) : '') + '</span></span>'
          + icon("chevron") + '</button>';
      }

      /*
       * Etkinlikler (2026-10-24, kullanıcı kararı "düşük iz"): E-Genç'te NÖHÜ Genç Ofis'in
       * düzenlediği, bugünden sonra biten faaliyetler (tools/nohu/fetch_egenc_activities.py).
       * Bağlantı yalnız E-Genç'in faaliyet sayfasına açılır.
       */
      var activityData = window.UNIKAPSUL_ACTIVITIES || { activities: [] };

      function upcomingActivities() {
        var today = turkeyDateIso();
        return (activityData.activities || []).filter(function (a) { return (a.end || a.start) >= today; });
      }

      function activityTitle(value) {
        return String(value || "").split(/\s+/).map(function (word) {
          // Rakam ya da ünlü içermeyen kelime kısaltmadır (A2, TFFHGD): olduğu gibi kalır.
          if (/\d/.test(word) || !/[AEIİOÖUÜaeıioöuü]/.test(word)) return word;
          var lower = word.toLocaleLowerCase("tr-TR");
          return lower.charAt(0).toLocaleUpperCase("tr-TR") + lower.slice(1);
        }).join(" ");
      }

      function activityDateLabel(a) {
        if (!a.start) return "";
        return !a.end || a.end === a.start ? isoDateLabel(a.start) : diningDateLabel(a.start) + " – " + isoDateLabel(a.end);
      }

      function safeActivityUrl(value) {
        try {
          var url = new URL(value);
          if (url.protocol === "https:" && url.hostname === "e-genc.gsb.gov.tr" && !url.username && !url.password && !url.port
              && url.pathname === "/Faaliyet/FaaliyetDetay") return url.href;
        } catch (error) {}
        return "https://e-genc.gsb.gov.tr/Faaliyet";
      }

      function agendaContent() {
        var tab = agendaTab();
        if (tab === "all") {
          var next = upcomingEvents(1)[0];
          var own = announcementEntries().filter(function (entry) { return entry.own; }).length;
          return '<section class="section" style="margin-top:8px"><div class="section-heading"><h2>Bugün</h2></div><div class="context-grid">'
            + agendaCard("tint-cream", "utensils", "Yemekhane", diningCardCopy(), team() ? "Kaynak: NÖHÜ aylık yemek listesi · gözlem " + diningObservedLabel() : "", 'data-sheet="menu"')
            + '</div></section>'
            + '<section class="section"><div class="section-heading"><h2>Son güncellemeler</h2></div><div class="context-grid">'
            + agendaCard("tint-violet", "calendar", "Akademik takvim",
                next ? (next.title.length > 48 ? next.title.slice(0, 47) + "…" : next.title) + " · " + eventDateLabel(next) + " · " + eventCountdown(next) : "Yaklaşan kayıt yok",
                team() ? "Kaynak: senato kararı · insan kontrolü bekliyor" : "", 'data-agenda="calendar"')
            + (function () {
                var nextActivity = upcomingActivities()[0];
                return agendaCard("tint-green", "calendar", "Etkinlikler",
                  nextActivity ? activityTitle(nextActivity.title) + " · " + activityDateLabel(nextActivity) : "Yaklaşan etkinlik yok", "", 'data-agenda="events"');
              })()
            + agendaCard("tint-blue", "megaphone", "Bölüm duyuruları",
                team() ? (own ? own + " resmî belge programını besliyor" : "Programın için okunmuş resmî belge yok") : (own ? "Bölümünün ders programı duyurusu" : "Henüz duyuru yok"),
                "", 'data-agenda="announcements"')
            + '</div></section>'
            + (team() ? '<div class="local-note">' + icon("info") + '<span>Bilgiler resmî kaynaklardan otomatik okunur ve insan kontrolü bekler; kesin bilgi için kaynağı aç.</span></div>' : '');
        }
        if (tab === "dining") {
          return '<div class="panel" style="padding:16px">' + diningMenuSheetHtml() + '</div>';
        }
        if (tab === "events") {
          var acts = upcomingActivities();
          var head = '<p class="sheet-copy">NÖHÜ Genç Ofis’in E-Genç’te duyurduğu faaliyetler. Başvuru ve ayrıntı E-Genç’te.</p>';
          if (!acts.length) {
            return head + '<div class="empty-state"><span class="icon-tile">' + icon("calendar") + '</span><h3>Yaklaşan etkinlik yok</h3><p>Yeni faaliyet duyurulduğunda burada görünecek.</p></div>';
          }
          return head + '<div class="list-stack" style="margin-top:10px">' + acts.map(function (a) {
              var meta = [activityDateLabel(a), a.address && a.address.length < 60 ? activityTitle(a.address) : "", a.age ? a.age + " yaş" : ""].filter(Boolean).join(" · ");
              return '<a class="list-card" href="' + escapeHtml(safeActivityUrl(a.url)) + '" target="_blank" rel="noopener noreferrer">'
                + '<span class="icon-tile">' + icon("calendar") + '</span><span><span class="list-title">' + escapeHtml(activityTitle(a.title)) + '</span>'
                + '<span class="list-meta">' + escapeHtml(meta) + '</span></span>' + icon("chevron") + '</a>';
            }).join("") + '</div>'
            + (activityData.fetched_at ? '<p class="stepper-label" style="margin-top:10px">E-Genç’ten alındı · ' + escapeHtml(isoDateLabel(String(activityData.fetched_at).slice(0, 10)) || "") + '</p>' : '');
        }
        if (tab === "calendar") {
          var upcoming = upcomingEvents(12);

      /*

      function notificationEntries() {

          var pendingHtml = ''

            + programPicker()
            + '<div class="empty-state"><span class="icon-tile">' + icon("database") + '</span><h3>Ders satırları henüz aktarılmadı</h3><p>Kaynaksız veri eklemek yerine resmî program kaynağı doğrulanıyor.</p><button class="primary-button" data-sheet="source">Kaynak durumunu aç</button></div>';

          + courseFilterChips()

          + '<div class="list-stack" style="margin-top:12px">' + (visible.length ? courseGroupList(visible) : '<div class="empty-state"><h3>Aday kayıt bulunamadı</h3><p>“Ders yok” denmiyor; örnek katalogda eşleşme bulunamadı.</p></div>') + '</div>'
          + '<div class="button-row" style="margin-top:16px"><button class="primary-button" data-sheet="custom-course">' + icon("plus") + ' Kendi dersimi ekle</button><button class="secondary-button" data-route="program">Programa dön</button></div>';

      // Ortalama hesabı. Harf notu tahmin edilmez; öğrenci OBS'deki harfi
      // girer. Katsayılar data/grading-rules.js dosyasından gelir ve o dosya
      // kaynak/doğrulama durumunu taşır.
      var GRADING = global_grading();
      function global_grading() {
        return (typeof window !== "undefined" && window.UNIKAPSUL_GRADING) || null;
      }

      function letterInfo(letter) {
        if (!GRADING || !letter) return null;
        return GRADING.letters.find(function (item) { return item.harf === letter; }) || null;
      }

      function roundTo(value, digits) {
        var factor = Math.pow(10, digits);
        return Math.round(value * factor) / factor;
      }

      function termAverage() {
        var digits = (GRADING && GRADING.ortalama.yuvarlama_basamak) || 2;
        var points = 0;
        var ects = 0;
        var counted = 0;
        var skippedNoLetter = 0;
        var skippedNoEcts = 0;
        var skippedNoCoefficient = 0;
        var skippedSecond = 0;
        courseRepresentatives().forEach(function (course) {
          var record = gradeRecord(course);
          var letter = record && record.letter;
          var courseEcts = record && Number(record.ects);
          // İkinci programın dersleri ana programın ortalamasına otomatik katılmaz:
          // katılım ÇAP / yan dal yönergesine bağlı ve doğrulanmadı (§6.1).
          if (isSecondCourse(course)) { if (letter) skippedSecond += 1; return; }
          if (!letter) { skippedNoLetter += 1; return; }
          var info = letterInfo(letter);
          if (!info || !info.ortalamaya_girer) { skippedNoCoefficient += 1; return; }
          if (!courseEcts) { skippedNoEcts += 1; return; }
          points += info.katsayi * courseEcts;
          ects += courseEcts;
          counted += 1;
        });
        return {
          points: points,
          ects: ects,
          counted: counted,
          skippedNoLetter: skippedNoLetter,
          skippedNoEcts: skippedNoEcts,
          skippedSecond: skippedSecond,
          skippedNoCoefficient: skippedNoCoefficient,
          average: ects ? roundTo(points / ects, digits) : null
        };
      }

      function overallAverage(term) {
        var digits = (GRADING && GRADING.ortalama.yuvarlama_basamak) || 2;
        var gpa = state.gpa || {};
        var prevAverage = Number(gpa.prevAverage);
        var prevEcts = Number(gpa.prevEcts);
        if (!prevAverage || !prevEcts) return null;
        // Tekrar alınan dersin eski denemesi önceki toplamın içindedir; yeni
        // notu eklerken eskisi düşülmezse ders iki kez sayılır.
        var repeat = repeatAdjustment();
        var totalPoints = prevAverage * prevEcts - repeat.points + term.points;
        var totalEcts = prevEcts - repeat.ects + term.ects;
        if (!totalEcts) return null;
        return {
          average: roundTo(totalPoints / totalEcts, digits),
          totalEcts: totalEcts,
          prevTerms: Math.round(prevEcts / 30),
          repeatCounted: repeat.ects > 0,
          repeatMissing: repeat.missing
        };
      }

      // Notlarım: tüm derslerin not durumu tek listede. Düzenleme tek yerde,
      // ders ayrıntısında kalır; bu ekran yalnız genel görünüm ve geçiş sağlar.
      function gradedCourses() {
        return courseRepresentatives().map(function (course) {
          var record = gradeRecord(course);
          return { course: course, record: record, summary: record ? gradeSummary(record) : null };
        });
      }

      function gradeStatusText(entry) {
        if (!entry.record) return "Not girilmedi";
        var sum = entry.summary;
        if (!sum.scoredWeight) return "Not girilmedi";
        var text = sum.earned + " / 100 toplandı · %" + sum.scoredWeight + " tamamlandı";
        if (entry.record.target === null || entry.record.target === "") return text;
        if (sum.needed === 0) return text + " · hedefe ulaştın";
        if (sum.needed === null || !sum.reachable) return text + " · hedefe ulaşılamıyor";
        return text + " · kalan için " + sum.needed + " gerek";
      }

      function gradeStatusLevel(entry) {
        if (!entry.record || !entry.summary || !entry.summary.scoredWeight) return "none";
        if (entry.record.target === null || entry.record.target === "") return "neutral";
        if (entry.summary.needed === 0) return "ok";
        if (entry.summary.needed === null || !entry.summary.reachable) return "over";
        return "neutral";
      }

      function letterSelect(courseId, value) {
        var options = ['<option value="">—</option>'];
        (GRADING ? GRADING.letters : []).forEach(function (item) {
          options.push('<option value="' + item.harf + '"' + (value === item.harf ? " selected" : "") + '>' + item.harf + '</option>');
        });
        return '<label class="grade-field"><span>Harf</span><select class="grade-input grade-select" data-gpa="'
          + escapeHtml(courseId) + ':letter" aria-label="Harf notu">' + options.join("") + '</select></label>';
      }

      function gradeListRow(course) {
        var record = gradeRecord(course) || {};
        var info = letterInfo(record.letter);
        var hint = "";
        if (record.letter && info && !info.ortalamaya_girer) hint = info.anlam;
        else if (record.letter && !record.ects) hint = "AKTS gir";
        return '<div class="gpa-row">'
          + '<button class="gpa-name" data-course="' + escapeHtml(course.id) + '">' + escapeHtml(course.name)
          + (course.userEntered ? '<span class="own-chip">kendi eklediğin</span>' : "")
          + (record.repeat ? '<span class="own-chip">tekrar</span>' : "")
          + '<span class="gpa-hint" id="gpa-hint-' + escapeHtml(course.id) + '">' + escapeHtml(hint) + '</span></button>'
          + letterSelect(course.id, record.letter || "")
          + '<label class="grade-field"><span>AKTS</span><input class="grade-input" type="number" inputmode="numeric" min="0" max="60" value="'
          + (record.ects ? escapeHtml(String(record.ects)) : "") + '" placeholder="—" data-gpa="'
          + escapeHtml(course.id) + ':ects" aria-label="' + escapeHtml(course.name) + ' AKTS kredisi"></label>'
          + '</div>'
          + repeatRow(course, record);
      }

      /*
       * Tekrar alınan ders genel ortalamada iki kez sayılıyordu: eski deneme
       * zaten "önceki ortalama/AKTS" içinde, yenisi de bu dönemde ekleniyordu.
       * Üstelik başarısız eski not ortalamada kalmaya devam ediyordu.
       *
       * Doğrusu, dersi tekrar olarak işaretleyip **eski harf notunu** da
       * sormaktır: eski denemenin katkısı önceki toplamdan çıkarılır, AKTS iki
       * kez sayılmaz. Eski harf bilinmeden bu hesap yapılamaz; o yüzden
       * işaretlenip eski harf girilmemişse hesap yapılmaz, uyarı gösterilir.
       */
      function repeatRow(course, record) {
        if (!record.repeat) {
          return '<div class="repeat-row"><button class="text-button" data-gpa-repeat="' + escapeHtml(course.id)
            + '">Bu dersi tekrar alıyorum</button></div>';
        }
        var options = ['<option value="">Önceki harf —</option>'];
        (GRADING ? GRADING.letters : []).forEach(function (item) {
          options.push('<option value="' + item.harf + '"'
            + (record.previousLetter === item.harf ? " selected" : "") + '>' + item.harf + '</option>');
        });
        return '<div class="repeat-row">'
          + '<select class="grade-input grade-select" data-gpa="' + escapeHtml(course.id) + ':previousLetter" '
          + 'aria-label="Bu dersi daha önce aldığın harf notu">' + options.join("") + '</select>'
          + '<button class="text-button" data-gpa-repeat="' + escapeHtml(course.id) + '">Tekrar değil</button>'
          + '</div>'
          + (record.previousLetter ? "" :
             '<p class="grade-warning">' + icon("alert")
             + '<span>Önceki harf girilmeden tekrar dersi genel ortalamaya katılamaz.</span></p>');
      }

      // Tekrar derslerinin ÖNCEKİ denemelerinin toplam puana katkısı.
      function repeatAdjustment() {
        var points = 0;
        var ects = 0;
        var missing = 0;
        courseRepresentatives().forEach(function (course) {
          var record = gradeRecord(course) || {};
          if (!record.repeat) return;
          var courseEcts = Number(record.ects);
          if (!record.previousLetter || !courseEcts) { missing += 1; return; }
          var info = letterInfo(record.previousLetter);
          if (!info || !info.ortalamaya_girer) return;
          points += info.katsayi * courseEcts;
          ects += courseEcts;
        });
        return { points: points, ects: ects, missing: missing };
      }

      function gpaSummaryHtml() {
        var term = termAverage();
        var html = "";
        if (term.average === null) {
          html += '<p class="grade-line">Harf notu ve AKTS girilen ders yok.</p>';
        } else {
          html += '<p class="grade-line"><strong>Yarıyıl akademik ortalaman: ' + term.average.toFixed(2).replace(".", ",")
            + '</strong></p><p class="grade-hint">' + term.counted + ' ders · ' + term.ects + ' AKTS</p>';
        }
        var warnings = [];
        if (term.skippedNoLetter) warnings.push(term.skippedNoLetter + " derste harf girilmedi");
        if (term.skippedNoEcts) warnings.push(term.skippedNoEcts + " derste AKTS girilmedi");
        if (term.skippedSecond) warnings.push(term.skippedSecond + " " + secondKindLabel().toLocaleLowerCase("tr-TR") + " dersi bu ortalamaya katılmadı (katılımı yönergeye bağlı)");
        if (term.skippedNoCoefficient) warnings.push(term.skippedNoCoefficient + " ders katsayısız (ortalamaya girmez)");
        if (warnings.length && term.average !== null) {
          html += '<p class="grade-warning">' + icon("alert") + '<span>' + warnings.join(" · ") + '. Hesap bunlar olmadan yapıldı; sonuç kısmidir.</span></p>';
        }
        var overall = overallAverage(term);
        if (overall) {
          html += '<p class="grade-line ok">Dönem sonunda genel akademik ortalaman: <strong>'
            + overall.average.toFixed(2).replace(".", ",") + '</strong></p>'
            + '<p class="grade-hint">Toplam ' + overall.totalEcts + ' AKTS üzerinden'
            + (overall.repeatCounted ? ' · tekrar alınan dersin önceki notu düşüldü' : '') + '</p>';
          if (overall.repeatMissing) {
            html += '<p class="grade-warning">' + icon("alert")
              + '<span>' + overall.repeatMissing + ' tekrar dersinde önceki harf veya AKTS girilmedi; '
              + 'o ders iki kez sayılıyor olabilir.</span></p>';

      /*
       * Kayıt künyesi. Projenin iddiası "her sayı kaynak belgesine kadar
       * izlenebilir" olduğu için kart uydurma metin göstermez: kaynak kimliği,
       * belge sürümü, sayfa ve çekilme tarihi doğrudan veri dosyasından gelir.
       */
      /*
       * Yedek, takvim dosyası ve hata bildirimi. Üçü de "prototipte yok" diye
       * boş duruyordu; üçü de ağ gerektirmiyor, öğrencinin kendi verisinden
       * üretilebiliyor. Artifact görüntüleyicisinde indirme engelli olduğu için
       * çıktı her zaman kopyalanabilir metin olarak da gösterilir.
       */
      function backupPayload() {
        return {
          format: "unikapsul-prototype-backup",
          format_version: 1,
          created_at: new Date().toISOString(),
          note: "Yalnız bu cihazdaki tercihlerindir. Resmî öğrenci kaydı değildir.",
          state: {
            faculty: state.faculty,
            department: state.department,
            grade: state.grade,
            selected: state.selected,
            customCourses: state.customCourses,
            absences: state.absences,
            grades: state.grades,
            gpa: state.gpa,
            theme: state.theme,
            textScale: state.textScale,
            reduceMotion: state.reduceMotion,
            notifyProgram: state.notifyProgram,
            notifyCalendar: state.notifyCalendar
          }
        };
      }

      function restoreBackup(text) {
        if (typeof text !== "string" || text.length > 1000000) return "Yedek en fazla 1 MB olabilir.";
        var parsed;
        try { parsed = JSON.parse(text); } catch (error) { return "Metin geçerli JSON değil."; }
        if (!plainObject(parsed) || parsed.format !== "unikapsul-prototype-backup") return "Bu bir ÜniKapsül yedeği değil.";
        if (parsed.format_version !== 1) return "Yedek sürümü desteklenmiyor.";
        if (!plainObject(parsed.state)) return "Yedekte tercih bulunamadı.";
        var incoming = parsed.state;
        if (Object.keys(incoming).some(function (key) { return BACKUP_STATE_KEYS.indexOf(key) === -1; })) {
          return "Yedekte desteklenmeyen alan var.";
        }
        if (incoming.department && !departments[incoming.department]) return "Yedekteki program bu katalogda yok.";

        var candidate = freshDefaultState();
        BACKUP_STATE_KEYS.forEach(function (key) {
          if (own(incoming, key)) candidate[key] = incoming[key];
        });
        // Yedek içerik tercihleri değiştirir; açık ekran ve ekip görünümü gibi
        // gezinme durumu yedekten alınmaz.
        candidate.onboarded = state.onboarded;
        candidate.route = state.route;
        candidate.previousRoute = state.previousRoute;
        candidate.teamView = state.teamView;
        candidate.themeChosen = own(incoming, "theme");
        var clean = sanitizeStoredState(candidate);
        if (!clean) return "Yedekte geçersiz veya sınırı aşan veri var.";
        state = clean;
        migrateAttendance();
        persist();
        return "";
      }

      function icsEscape(value) {
        return String(value || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
      }

      var ICS_DAY = { "Pzt": "MO", "Sal": "TU", "Çar": "WE", "Per": "TH", "Cum": "FR" };

      // Dönemin ilk pazartesisi kaynak belgede yazmıyor; bu yüzden tekrar
      // kuralı "haftalık" verilir ve başlangıç günü içinde bulunulan haftadan
      // seçilir. Tarih uydurulmaz, kullanıcıya bu sınır yazılır.
      function weekStartIso() {
        var now = new Date(turkeyDateIso() + "T12:00:00Z");
        var shift = (now.getUTCDay() + 6) % 7;
        now.setUTCDate(now.getUTCDate() - shift);
        return now.toISOString().slice(0, 10).replace(/-/g, "");
      }

      function icsText() {
        var rows = selectedCourses().filter(function (course) {
          return course.day && validClock(course.start) && validClock(course.end)
            && course.start && course.end && course.start < course.end && ICS_DAY[course.day];
        });
        var monday = weekStartIso();
        var stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
        var lines = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//UniKapsul prototip//TR",
          "CALSCALE:GREGORIAN",
          "X-WR-CALNAME:" + icsEscape("ÜniKapsül · " + currentDepartment().name)
        ];
        rows.forEach(function (course) {
          var offset = ["MO", "TU", "WE", "TH", "FR"].indexOf(ICS_DAY[course.day]);
          var date = new Date(Date.UTC(
            Number(monday.slice(0, 4)),
            Number(monday.slice(4, 6)) - 1,
            Number(monday.slice(6, 8)) + offset, 12
          ));
          var day = date.toISOString().slice(0, 10).replace(/-/g, "");
          var meta = sourceMeta(course.sourceId);
          lines.push("BEGIN:VEVENT");
          lines.push("UID:" + icsEscape(course.id) + "@unikapsul-prototip");
          lines.push("DTSTAMP:" + stamp);
          lines.push("DTSTART;TZID=Europe/Istanbul:" + day + "T" + course.start.replace(":", "") + "00");
          lines.push("DTEND;TZID=Europe/Istanbul:" + day + "T" + course.end.replace(":", "") + "00");
          lines.push("RRULE:FREQ=WEEKLY;BYDAY=" + ICS_DAY[course.day]);
          lines.push("SUMMARY:" + icsEscape(course.name));
          lines.push("LOCATION:" + icsEscape(course.location || ""));
          lines.push("DESCRIPTION:" + icsEscape(
            (course.userEntered
              ? "Kendi eklediğin ders"
              : !team() ? "ÜniKapsül · " + course.departmentName + " ders programı"
              : "Durum: " + statusLabel(course.status)
                + (meta ? " · Kaynak: " + meta.source_version_id : "")
                + (course.sourcePage ? " · " + course.sourcePage : ""))
            + " · ÜniKapsül prototip, resmî kayıt değildir"
          ));
          lines.push("END:VEVENT");
        });
        lines.push("END:VCALENDAR");
        return { text: lines.join("\r\n"), count: rows.length, skipped: selectedCourses().length - rows.length };
      }

      function mailtoHref(subject, body) {
        return "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);

      /*
       * Gömülü görüntüleyicide (yayımlanmış artifact bir iframe içinde çalışır)
       * tarayıcı indirme izni verilmiyor: bağlantı tıklanır, hiçbir şey olmaz
       * ve sayfa bunu anlayamaz. Hiçbir şey yapmayan düğme, az önce arayüzden
       * temizlenen "sahte yüzey"in ta kendisi olurdu; bu yüzden indirme düğmesi
       * yalnız üst pencerede (yerel/ayrı sekme) gösterilir, metin kopyalama
       * her yerde çalışır.
       */
      var canDownload = (function () {
        try { return window.self === window.top; } catch (error) { return false; }
      })();

      function copyArea(id, label) {
        return '<div class="button-row" style="margin-top:10px' + (canDownload ? "" : ";grid-template-columns:1fr") + '">'
          + '<button class="primary-button" data-copy="' + id + '">' + icon("check") + ' ' + label + '</button>'
          + (canDownload ? '<button class="secondary-button" data-download="' + id + '">' + icon("download") + ' Dosya</button>' : "")
          + '</div>';
      }

      function copyFromArea(id) {
        var area = document.getElementById(id);
        if (!area) return;
        area.focus();
        area.select();
        var done = function () { toast("Metin kopyalandı."); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(area.value).then(done, function () {
            toast("Kopyalama engellendi; metin seçildi, elle kopyalayabilirsin.");
          });
        } else {
          toast("Metin seçildi; elle kopyalayabilirsin.");
        }
      }

      function downloadFromArea(id) {
        var area = document.getElementById(id);
        if (!area) return;
        var name = area.getAttribute("data-filename") || "unikapsul.txt";
        try {
          var blob = new Blob([area.value], { type: "text/plain;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = name;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
          toast("Dosya indiriliyor.");
        } catch (error) {
          toast("Bu görünümde dosya indirme kapalı; metni kopyala.");
        }
      }

      function recordSourceCard(course) {

        }
        var meta = sourceMeta(course.sourceId);
        var copy = meta
          ? (team() ? escapeHtml(meta.source_version_id) : 'Resmî belge · yayım ' + escapeHtml(isoDateLabel(meta.source_published_at) || "tarihi yazmıyor")) + ' · ' + escapeHtml(course.sourcePage || "sayfa belirtilmemiş")
          : 'Kaynak künyesi bulunamadı (' + escapeHtml(course.sourceId || "—") + ')';
        if (!team()) {
          return '<button class="info-card menu" data-sheet="record-source"><span class="icon-tile">' + icon("database") + '</span><span><span class="card-title">Resmî ders programı</span><span class="card-copy">Bölümünün yayımladığı belgeyi aç</span></span>' + icon("chevron") + '</button>';
