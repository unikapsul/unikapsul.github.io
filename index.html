<!doctype html>
<html lang="tr">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fa">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-180.png">
  <meta name="apple-mobile-web-app-title" content="ÜniKapsül">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; connect-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>ÜniKapsül — Kullanılabilirlik Prototipi</title>
  <style>
    :root {
      color-scheme: light;
      --page: #eef2f5;
      --surface: #ffffff;
      --surface-2: #f6f8fa;
      --surface-3: #eef3f6;
      --ink: #142640;
      --muted: #617086;
      --line: #dce4ea;
      --teal: #00786f;
      --teal-2: #e5f5f3;
      --on-teal: #ffffff;
      --blue: #246dd8;
      --blue-2: #eaf2ff;
      --navy: #102a46;
      --navy-2: #1d4164;
      --amber: #a85f05;
      --amber-2: #fff5e5;
      --red: #b52835;
      --red-2: #fff0f1;
      --green: #17785a;
      --green-2: #eaf7f1;
      --shadow: 0 24px 70px rgba(16, 42, 70, .16);
      --card-shadow: 0 8px 26px rgba(16, 42, 70, .06);
      --radius: 18px;
      --ease: cubic-bezier(.2, .7, .2, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body { min-height: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 18% 12%, rgba(0, 120, 111, .08), transparent 30%),
        radial-gradient(circle at 82% 78%, rgba(36, 109, 216, .08), transparent 32%),
        var(--page);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button, select { min-height: 44px; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(36, 109, 216, .35);
      outline-offset: 2px;
    }

    .prototype-page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(250px, 320px) minmax(390px, 430px);
      gap: 42px;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    html:not(.team-view) .prototype-panel { display: none; }
    html:not(.team-view) .prototype-page { grid-template-columns: minmax(390px, 430px); }
    .prototype-panel {
      align-self: center;
      max-width: 320px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid rgba(0, 120, 111, .2);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: var(--teal);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .03em;
    }

    .prototype-panel h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    .prototype-panel p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .test-controls {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(20, 38, 64, .1);
      border-radius: 20px;
      background: rgba(255, 255, 255, .76);
      backdrop-filter: blur(16px);
    }

    .test-controls strong { font-size: 13px; }
    .test-controls small { color: var(--muted); line-height: 1.45; }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .test-button {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: border-color .18s var(--ease), background .18s var(--ease);
    }

    .test-button:hover { border-color: var(--teal); background: var(--teal-2); }
    .test-button.active { border-color: var(--teal); background: var(--teal); color: var(--on-teal); }

    .device {
      position: relative;
      width: 100%;
      height: min(880px, calc(100dvh - 34px));
      min-height: 700px;
      overflow: hidden;
      border: 9px solid #10161c;
      border-radius: 50px;
      background: var(--surface);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, .25);
    }

    .device::before {
      content: "";
      position: absolute;
      z-index: 30;
      top: 9px;
      left: 50%;
      width: 112px;
      height: 28px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #0a0f14;
      pointer-events: none;
    }

    .app {
      position: relative;
      height: 100%;
      overflow: hidden;
      background: var(--surface-2);
    }

    .status-bar {
      position: absolute;
      z-index: 25;
      top: 0;
      left: 0;
      right: 0;
      height: 47px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 22px 0;
      background: linear-gradient(to bottom, rgba(255,255,255,.98), rgba(255,255,255,.86));
      color: var(--ink);
      font-size: 12px;
      font-weight: 760;
      pointer-events: none;
    }

    .status-icons { display: flex; align-items: center; gap: 5px; }
    .signal { display: flex; align-items: end; gap: 2px; height: 12px; }
    .signal i { display: block; width: 3px; border-radius: 2px; background: currentColor; }
    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 9px; }
    .signal i:nth-child(4) { height: 12px; }
    .battery { width: 20px; height: 10px; border: 1.6px solid currentColor; border-radius: 3px; padding: 1px; }
    .battery::after { content: ""; display: block; width: 75%; height: 100%; border-radius: 1px; background: currentColor; }

    #screen {
      position: absolute;
      inset: 47px 0 0;
      overflow: hidden;
    }

    .screen-layout {
      height: 100%;
      display: flex;
      flex-direction: column;
      animation: screen-in .24s var(--ease);
    }

    @keyframes screen-in {
      from { opacity: .3; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .screen-scroll {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      padding: 18px 18px 112px;
      scrollbar-width: none;
    }
    .screen-scroll::-webkit-scrollbar { display: none; }
    .screen-scroll.no-nav { padding-bottom: 32px; }

    .screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      margin-bottom: 10px;
    }
    .screen-header > * { min-width: 0; }

    .brand {
      overflow-wrap: anywhere;
      font-size: clamp(24px, 7vw, 27px);
      font-weight: 840;
      letter-spacing: -.045em;
    }

    .screen-title {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(22px, 6.5vw, 25px);
      line-height: 1.1;
      letter-spacing: -.035em;
    }

    .screen-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    .icon-button {
      position: relative;
      width: 44px;
      min-width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      cursor: pointer;
    }
    .icon-button:hover { background: var(--surface-3); }
    .icon-button .unread-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 8px;
      height: 8px;
      border: 2px solid var(--surface-2);
      border-radius: 50%;
      background: #e33d4f;
    }

    .icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .section { margin-top: 22px; }
    .section:first-child { margin-top: 0; }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .section-heading > * { min-width: 0; }
    .section-heading h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -.025em;
    }
    .section-heading .text-button { min-height: 44px; }

    .text-button {
      padding: 4px 2px;
      border: 0;
      background: none;
      color: var(--teal);
      cursor: pointer;
      font-size: 13px;
      font-weight: 720;
    }

    .source-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      text-align: left;
    }
    .source-button > span:last-child { min-width: 0; overflow-wrap: anywhere; line-height: 1.35; }

    .source-dot {
      width: 17px;
      height: 17px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: var(--teal);
      color: var(--on-teal);
      font-size: 10px;
      font-weight: 900;
    }

    .hero-course {
      width: 100%;
      display: block;
      padding: 20px;
      border: 0;
      border-radius: 20px;
      background: linear-gradient(145deg, var(--navy), var(--navy-2));
      color: #fff;
      box-shadow: 0 14px 28px rgba(16, 42, 70, .18);
      text-align: left;
      cursor: pointer;
    }

    .hero-course .kicker {
      margin-bottom: 13px;
      color: #b9d2e9;
      font-size: 11px;
      font-weight: 780;
      letter-spacing: .09em;
    }

    .hero-row { display: flex; align-items: center; gap: 14px; }
    .hero-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(255, 255, 255, .1);
      color: #d9eeff;
    }
    .hero-main { min-width: 0; flex: 1; }
    .hero-title { display: block; margin: 0; overflow-wrap: anywhere; font-size: clamp(16px, 5vw, 18px); font-weight: 790; letter-spacing: -.02em; }
    .hero-meta { display: block; margin-top: 7px; color: #c6d8e7; font-size: 13px; }
    .hero-sub { display: block; margin-top: 6px; color: #9eb8cf; font-size: 12px; }

    .timeline {
      display: grid;
      gap: 9px;
    }
    .timeline-row {
      display: grid;
      grid-template-columns: 48px 14px minmax(0, 1fr);
      gap: 8px;
      align-items: stretch;
    }
    .time {
      padding-top: 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .rail { position: relative; display: flex; justify-content: center; }
    .rail::before { content: ""; position: absolute; top: 21px; bottom: -15px; width: 2px; background: #b7d9d6; }
    .timeline-row:last-child .rail::before { display: none; }
    .rail::after { content: ""; position: relative; top: 19px; width: 9px; height: 9px; border: 3px solid var(--surface-2); border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 1px rgba(0,120,111,.18); }

    .timeline-card, .info-card, .list-card, .settings-card, .form-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--card-shadow);
    }

    .timeline-card {
      width: 100%;
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 13px;
      text-align: left;
      cursor: pointer;
    }
    .timeline-card > .icon,
    .info-card > .icon,
    .list-card > .icon,
    .schedule-course > .icon { flex: 0 0 auto; }
    .timeline-card:hover { border-color: #b7cbc9; }
    .timeline-main { flex: 1; min-width: 0; }
    .timeline-title {
      display: block;
      overflow-wrap: anywhere;
      font-size: 14px;
      font-weight: 780;
      line-height: 1.3;
    }
    .timeline-meta {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .context-grid { display: grid; gap: 10px; }
    .info-card {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 82px;
      padding: 13px;
      text-align: left;
      cursor: pointer;
    }
    .info-card > span:nth-child(2) { min-width: 0; }
    .info-card.menu { border-color: #c6e4e1; background: linear-gradient(120deg, #fff, #f2fbfa); }
    .info-card.deadline { border-color: #d4e3fb; background: linear-gradient(120deg, #fff, #f2f7ff); }
    .info-card.announcement { border-color: #f0dfc2; background: linear-gradient(120deg, #fff, #fff9ef); }

    .icon-tile {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--teal-2);
      color: var(--teal);
    }
    .deadline .icon-tile { background: var(--blue-2); color: var(--blue); }
    .announcement .icon-tile { background: var(--amber-2); color: var(--amber); }
    .card-title {
      display: block;
      overflow-wrap: anywhere;
      font-size: 14px;
      font-weight: 780;
      line-height: 1.3;
    }
    .card-copy {
      display: block;
      margin-top: 5px;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .alert-card {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      margin: 12px 0;
      padding: 13px;
      border: 1px solid var(--red);
      border-radius: 16px;
      background: var(--red-2);
      color: var(--red);
    }
    .alert-card strong { display: block; font-size: 13px; }
    .alert-card span { display: block; margin-top: 3px; font-size: 12px; color: var(--red); }

    .state-banner {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 8px 0 14px;
      padding: 11px 12px;
      border: 1px solid var(--amber);
      border-radius: 14px;
      background: var(--amber-2);
      color: var(--amber);
      font-size: 12px;
      line-height: 1.45;
    }

    .bottom-nav {
      position: absolute;
      z-index: 12;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      min-height: 82px;
      padding: 8px 6px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
      backdrop-filter: blur(18px);
    }
    .nav-button {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 2px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      /* Sabit renk koyu temada 3.85:1'e düşüyordu; jetonla iki temada da ölçülüyor. */
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 650;
      line-height: 1.2;
      text-align: center;
    }
    .nav-button.active { color: var(--teal); font-weight: 800; }
    .nav-button.active .nav-icon-wrap { background: var(--teal-2); }
    .nav-icon-wrap { width: 34px; height: 28px; display: grid; place-items: center; border-radius: 10px; }

    .segmented {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 5px;
      padding: 4px;
      border-radius: 14px;
      background: var(--surface-3);
    }
    .segment {
      min-height: 44px;
      padding: 7px 10px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .segment.active { background: var(--teal); color: var(--on-teal); box-shadow: 0 4px 12px rgba(0,120,111,.18); }

    .weekday-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      margin: 14px 0;
    }
    .weekday {
      min-height: 44px;
      padding: 6px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--surface-3);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 720;
    }
    .weekday.active { background: var(--teal); color: var(--on-teal); }

    .schedule-list { display: grid; gap: 10px; }
    .schedule-course {
      width: 100%;
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(145deg, var(--navy), var(--navy-2));
      color: #fff;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 9px 24px rgba(16,42,70,.14);
    }
    .schedule-time { color: #c8d8e6; font-size: 11px; line-height: 1.45; }
    .schedule-name { display: block; font-size: 14px; font-weight: 780; }
    .schedule-location { display: block; margin-top: 5px; color: #b0c6d9; font-size: 11px; }

    .button-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 16px; }
    .primary-button, .secondary-button, .danger-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
      padding: 11px 15px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 780;
      text-decoration: none;
    }
    .primary-button { border: 1px solid var(--teal); background: var(--teal); color: var(--on-teal); box-shadow: 0 8px 20px rgba(0,120,111,.18); }
    .secondary-button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    .danger-button { border: 1px solid var(--red); background: var(--red-2); color: var(--red); }
    .primary-button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    .plan-stack { display: grid; gap: 7px; }
    .plan-row {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 11px;
      align-items: start;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }
    .plan-row.flagged { border-color: var(--red); background: var(--red-2); }
    .plan-code {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      padding-top: 2px;
      overflow-wrap: anywhere;
    }
    .plan-body { min-width: 0; }
    @media (max-width: 360px) {
      .plan-row { grid-template-columns: minmax(0, 1fr); gap: 3px; }
    }
    .list-stack { display: grid; gap: 9px; }
    .list-card {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 84px;
      padding: 13px;
      text-align: left;
      cursor: pointer;
    }
    .list-card.unread::before {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      margin-left: -18px;
      border-radius: 50%;
      background: var(--teal);
    }
    .list-card { position: relative; }
    .list-card > span:nth-child(2),
    .course-option > span:nth-child(2),
    .profile-card > span:nth-child(2) { min-width: 0; }
    .list-title { display: block; overflow-wrap: anywhere; font-size: 14px; font-weight: 780; line-height: 1.3; }
    .list-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.45; }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 260px;
      padding: 30px 24px;
      border: 1px dashed var(--line);
      border-radius: 20px;
      background: var(--surface);
      text-align: center;
    }
    .empty-state .icon-tile { width: 54px; height: 54px; border-radius: 18px; }
    .empty-state h3 { margin: 15px 0 7px; font-size: 17px; }
    .empty-state p { max-width: 250px; margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .settings-card { overflow: hidden; }
    .setting-row {
      width: 100%;
      display: grid;
      grid-template-columns: 35px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 8px 13px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--surface);

    a.list-card, a.list-card:visited { text-decoration: none; color: inherit; }

    :root[data-text-scale="buyuk"] body { font-size: 15.5px; }

      transition-duration: 1ms !important;

    .attendance-card.over .absence-bar span { background: var(--red); }
    .absence-sessions { margin: 0 0 10px; color: var(--muted); font-size: 12px; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .absence-today { width: 100%; margin: 0 0 8px; }
    .absence-done { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; color: var(--teal); font-size: 13px; font-weight: 600; }
    .absence-done .icon { width: 15px; height: 15px; }
    .absence-more summary { min-height: 44px; display: flex; align-items: center; color: var(--teal); font-size: 13px; font-weight: 600; cursor: pointer; }
    .absence-form { display: grid; grid-template-columns: 1fr; gap: 8px; padding-bottom: 6px; }
    .absence-log { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line); }
    .absence-log li { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; border-bottom: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums; }
    .absence-log li span { min-width: 0; }
    .absence-log .text-button { white-space: nowrap; flex: 0 0 auto; }
    .absence-limit { margin: 12px 0 8px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .absence-limit strong { color: var(--ink); }
    .absence-part { display: grid; gap: 2px; margin: 4px 0 6px; }
    .absence-part-title { margin: 6px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); }
    .absence-part-copy { margin: 0; font-size: 13px; font-weight: 600; }
    .absence-part-copy.near { color: var(--amber); }
    .absence-part-copy.over { color: var(--red); }
    .absence-bar.near span { background: var(--amber); }
    .absence-bar.over span { background: var(--red); }
    .absence-snap { margin: 0 0 4px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .absence-snap .text-button { min-height: 32px; padding: 0 4px; }
    .absence-empty { margin: 4px 0 10px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    ul.absence-sessions { list-style: none; padding: 0; }
    ul.absence-sessions li { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
    ul.absence-sessions .chip { min-height: 32px; }
    .absence-log li.included span { color: var(--muted); }
    .absence-week { display: flex; align-items: flex-start; }
    .absence-week-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .absence-week-actions button { width: auto; }
    .absence-limit-row { display: grid; gap: 8px; }
    .absence-limit-input { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    .attendance-note {
      display: flex;
      gap: 8px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }
    .attendance-note .icon { flex: 0 0 auto; }

    .detail-box { padding: 13px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
    .detail-box span { display: block; color: var(--muted); font-size: 10px; }
    .detail-box strong { display: block; margin-top: 5px; overflow-wrap: anywhere; font-size: 13px; }

    .map-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--card-shadow);
    }
    .map-copy { padding: 15px; }
    .map-copy h2 { margin: 0; font-size: 17px; }
    .map-copy p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .map-placeholder {
      position: relative;
      height: 210px;
      overflow: hidden;
      background:
        linear-gradient(31deg, transparent 44%, rgba(255,255,255,.95) 45%, rgba(255,255,255,.95) 52%, transparent 53%),
        linear-gradient(-28deg, transparent 42%, rgba(255,255,255,.9) 43%, rgba(255,255,255,.9) 50%, transparent 51%),
        #dceadd;
    }
    .building { position: absolute; border: 1px solid #c3ced7; border-radius: 6px; background: #d6dde4; box-shadow: 0 5px 10px rgba(20,38,64,.08); }
    .building.one { width: 92px; height: 52px; top: 73px; left: 152px; transform: rotate(-7deg); }
    .building.two { width: 74px; height: 48px; top: 26px; left: 42px; transform: rotate(10deg); }
    .building.three { width: 66px; height: 42px; bottom: 24px; right: 40px; transform: rotate(8deg); }
    .map-pin {
      position: absolute;
      top: 61px;
      left: 186px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 8px;
      background: var(--teal);
      color: var(--on-teal);
      transform: rotate(-45deg);
      box-shadow: 0 7px 15px rgba(0,120,111,.3);
    }
    .map-pin .icon { width: 16px; transform: rotate(45deg); }
    .map-label { position: absolute; top: 126px; left: 143px; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,.9); color: #16222f; font-size: 10px; font-weight: 760; }
    .map-watermark { position: absolute; right: 8px; bottom: 8px; padding: 4px 7px; border-radius: 7px; background: rgba(255,255,255,.75); color: #4a5a6b; font-size: 9px; }

    .sheet-backdrop {
      position: absolute;
      z-index: 40;
      inset: 0;
      display: flex;
      align-items: flex-end;
      background: rgba(7, 21, 35, .38);
      opacity: 1;
      transition: opacity .2s var(--ease);
    }
    .sheet-backdrop.hidden { opacity: 0; pointer-events: none; }
    .sheet {
      width: 100%;
      max-height: 78%;
      overflow-y: auto;
      padding: 10px 18px max(22px, env(safe-area-inset-bottom));
      border-radius: 25px 25px 0 0;
      background: var(--surface);
      box-shadow: 0 -20px 60px rgba(7,21,35,.2);
      transform: translateY(0);
      transition: transform .25s var(--ease);
    }
    .sheet-backdrop.hidden .sheet { transform: translateY(105%); }
    .sheet-handle { width: 42px; height: 5px; margin: 0 auto 12px; border-radius: 99px; background: #d8dfe5; }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .sheet-header h2 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
    .sheet-copy { color: var(--muted); font-size: 13px; line-height: 1.55; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 700;
    }
    .toggle {
      width: 47px;
      height: 28px;
      padding: 3px;
      border: 0;
      border-radius: 99px;
      background: #c9d2da;
      cursor: pointer;
    }
    .toggle::after { content: ""; display: block; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.16); transition: transform .2s var(--ease); }
    .toggle.on { background: var(--teal); }
    .toggle.on::after { transform: translateX(19px); }

    .toast {
      position: absolute;
      z-index: 60;
      left: 50%;
      bottom: 95px;
      max-width: calc(100% - 36px);
      padding: 11px 14px;
      border-radius: 12px;
      background: #142640;
      color: #fff;
      box-shadow: 0 10px 30px rgba(16,42,70,.25);
      font-size: 12px;
      font-weight: 650;
      text-align: center;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s var(--ease), transform .2s var(--ease);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .mobile-test { display: none; }

    /*
     * Koyu tema. Jetonlar :root üzerinde yeniden tanımlanır — gövde (body)
     * kök dışında kaldığı için sınıf bir iç kutuya verilince kalıtım yoluyla
     * gelen metin rengi açık temada kalıyordu; başlıklar okunmuyordu.
     * Vurgu renkleri (teal, blue, amber, red) de burada açılır: açık tema
     * için seçilmiş koyu tonlar koyu zeminde okunmuyor.
     */
    :root[data-app-theme="dark"] {
      color-scheme: dark;
      --page: #07101a;
      --surface: #111a25;
      --surface-2: #0c141e;
      --surface-3: #192432;
      --ink: #edf4f8;
      --muted: #9cacbb;
      --line: #273545;
      --teal: #4ecdc0;
      --teal-2: #103834;
      --on-teal: #05221f;
      --blue: #7ab3ff;
      --blue-2: #152b48;
      --amber: #e8a84e;
      --amber-2: #342713;
      --red: #ff8f97;
      --red-2: #371b20;
      --green: #5fcba1;
      --green-2: #153329;
      --card-shadow: none;
      --shadow: 0 24px 70px rgba(0, 0, 0, .5);
    }
    [data-app-theme="dark"] .status-bar,
    [data-app-theme="dark"] .bottom-nav,
    [data-app-theme="dark"] .sticky-action { background: rgba(17,26,37,.96); }
    [data-app-theme="dark"] .map-placeholder { filter: brightness(.7) saturate(.75); }
    [data-app-theme="dark"] .course-option.selected,
    [data-app-theme="dark"] .profile-card,
    [data-app-theme="dark"] .info-card { background-image: none; }
    [data-app-theme="dark"] .eyebrow,
    [data-app-theme="dark"] .test-controls { background: rgba(17,26,37,.82); }
    [data-app-theme="dark"] .test-button { background: var(--surface-3); }
    [data-app-theme="dark"] .toast { background: #22344a; }
    [data-app-theme="dark"] .rail::before { background: #2f5f5a; }

    @media (max-width: 820px), (max-height: 600px) and (pointer: coarse) {
      .prototype-page { display: block; padding: 0; }
      .prototype-panel { display: none; }
      .device {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .device::before,
      .status-bar { display: none; }
      #screen { inset: 0; }
      .screen-scroll {
        padding-top: max(18px, env(safe-area-inset-top));
        padding-right: max(18px, env(safe-area-inset-right));
        padding-left: max(18px, env(safe-area-inset-left));
      }
      .bottom-nav {
        padding-right: max(6px, env(safe-area-inset-right));
        padding-left: max(6px, env(safe-area-inset-left));
      }
      .sticky-action {
        padding-right: max(18px, env(safe-area-inset-right));
        padding-left: max(18px, env(safe-area-inset-left));
      }
      .sheet {
        padding-right: max(18px, env(safe-area-inset-right));
        padding-left: max(18px, env(safe-area-inset-left));
      }
    }

    @media (max-width: 360px) {
      .screen-scroll {
        padding-right: max(14px, env(safe-area-inset-right));
        padding-left: max(14px, env(safe-area-inset-left));
      }
      .hero-course { padding: 16px; }
      .hero-row { gap: 10px; }
      .hero-icon { width: 42px; height: 42px; border-radius: 14px; }
      .timeline-row { grid-template-columns: 42px 12px minmax(0, 1fr); gap: 6px; }
      .timeline-card { gap: 6px; padding: 11px; }
      .info-card { grid-template-columns: 38px minmax(0, 1fr) 22px; gap: 10px; padding: 12px; }
      .info-card .icon-tile,
      .list-card .icon-tile { width: 38px; height: 38px; border-radius: 13px; }
      .schedule-course { grid-template-columns: 52px minmax(0, 1fr) 22px; gap: 9px; padding: 13px; }
      .list-card { grid-template-columns: 38px minmax(0, 1fr) 22px; gap: 10px; padding: 11px; }
      .course-option { grid-template-columns: 38px minmax(0, 1fr) 38px; gap: 9px; padding: 10px; }
      .profile-card { grid-template-columns: 42px minmax(0, 1fr) 22px; gap: 10px; padding: 12px; }
      .profile-card .icon-tile { width: 42px; height: 42px; }
      .button-row { grid-template-columns: 1fr; }
      .sticky-action { grid-template-columns: 1fr; gap: 8px; padding-top: 10px; }
      .selection-count { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .selection-count span { margin-top: 0; text-align: right; }
    }

    @media (max-width: 340px) {
      .detail-grid { grid-template-columns: 1fr; }
      .screen-header { gap: 6px; }
      .section-heading { gap: 8px; }
    }

    @media (orientation: landscape) and (max-height: 600px) and (pointer: coarse) {
      .screen-scroll { padding-top: max(12px, env(safe-area-inset-top)); }
      .bottom-nav { min-height: 66px; padding-top: 4px; }
      .nav-icon-wrap { height: 24px; }
    }

    @media (max-height: 740px) and (min-width: 821px) {
      .device { height: calc(100dvh - 18px); min-height: 620px; }
      .prototype-page { padding: 9px 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }

    /*
     * Tasarım katmanı (2026-10-24, kullanıcı şartnamesi "Tasarım A yerleşimi + A+ renkleri").
     * Bu blok yalnız görünümü yeniden tanımlar; işlev ve veri koduna dokunmaz. Eski jeton
     * adları (--teal ...) yeni ana renge bağlanır, böylece bütün ekranlar aynı paleti alır.
     * Yazı tipi yerel (fonts/KAYNAK.md): dışarıya istek yok, çevrimdışı çalışır.
     */
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url("fonts/inter-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url("fonts/inter-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      /* Renk */
      --page: #fafbfe;
      --surface: #ffffff;
      --surface-2: #fafbfe;
      --surface-3: #eff3f9;
      --ink: #101d3f;
      --muted: #5c6782;
      --line: #e5eaf3;
      --primary: #3168d5;
      --primary-2: #eaf3ff;
      --on-primary: #ffffff;
      --hero-a: #eaf3ff;
      --hero-b: #c9dfff;
      --tint-blue: #eaf3ff;
      --tint-blue-ink: #2c5fc6;
      --tint-violet: #f1efff;
      --tint-violet-ink: #5a46c4;
      --tint-cream: #fff7ec;
      --tint-cream-ink: #b25a08;
      --tint-green: #ecf9f1;
      --tint-green-ink: #1c7a4c;
      --chip-on-tint: rgba(255, 255, 255, .72);
      --rail-idle: #c7cedc;
      --muted-on-hero: #4a556f;
      --teal: var(--primary);
      --teal-2: var(--primary-2);
      --on-teal: var(--on-primary);
      --blue: var(--primary);
      --blue-2: var(--primary-2);
      --amber-2: var(--tint-cream);
      --green-2: var(--tint-green);
      --card-shadow: 0 6px 22px rgba(16, 29, 63, .05);
      /* Ölçü */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --radius: 20px;
      --radius-lg: 24px;
      --radius-sm: 14px;
      --radius-pill: 999px;
      /* Yazı */
      --fs-title: 30px;
      --fs-section: 21px;
      --fs-card: 17px;
      --fs-body: 15px;
      --fs-meta: 13px;
      --fs-small: 12px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    :root[data-app-theme="dark"] {
      --page: #0b1220;
      --surface: #131c2e;
      --surface-2: #0b1220;
      --surface-3: #1b2539;
      --ink: #eef2fa;
      --muted: #a6b1c7;
      --line: #263249;
      --primary: #8ab4ff;
      --primary-2: #1a2a4a;
      --on-primary: #0b1220;
      --hero-a: #172a4d;
      --hero-b: #1f3c6b;
      --tint-blue: #17243f;
      --tint-blue-ink: #9cc0ff;
      --tint-violet: #201d3c;
      --tint-violet-ink: #c0b4ff;
      --tint-cream: #2c2317;
      --tint-cream-ink: #f2b871;
      --tint-green: #132a20;
      --tint-green-ink: #82d6aa;
      --chip-on-tint: rgba(255, 255, 255, .07);
      --rail-idle: #3a4660;
      --muted-on-hero: #b4bfd4;
      --teal: var(--primary);
      --teal-2: var(--primary-2);
      --on-teal: var(--on-primary);
      --blue: var(--primary);
      --blue-2: var(--primary-2);
      --amber-2: var(--tint-cream);
      --green-2: var(--tint-green);
      --card-shadow: none;
    }

    body { background: var(--page); }
    .app { background: var(--surface-2); }
    .eyebrow { border-color: var(--line); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline-color: color-mix(in srgb, var(--primary) 45%, transparent); }
    .time, .schedule-time, .exam-time { font-variant-numeric: tabular-nums; }

    /* Başlık */
    .brand { display: inline-flex; align-items: center; gap: 9px; font-size: 26px; font-weight: 800; letter-spacing: -.035em; }
    .brand-mark { width: 30px; height: 30px; color: var(--primary); }
    .brand-mark .icon { width: 30px; height: 30px; stroke-width: 2; }
    .screen-subtitle { margin-top: 4px; font-size: var(--fs-body); }
    .page-title { margin: var(--space-4) 0 var(--space-1); font-size: var(--fs-title); line-height: 1.1; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .page-lead { margin: 0 0 var(--space-4); color: var(--muted); font-size: var(--fs-body); }
    .screen-title { font-size: clamp(24px, 7vw, var(--fs-title)); font-weight: 800; letter-spacing: -.04em; }
    .section { margin-top: var(--space-5); }
    .section-heading h2 { font-size: var(--fs-section); font-weight: 800; letter-spacing: -.03em; }
    .text-button { color: var(--primary); font-size: 14px; }
    .icon-button { border-radius: 50%; background: var(--primary-2); color: var(--ink); }
    .icon-button:hover { background: var(--primary-2); filter: brightness(.97); }
    .icon-button .unread-dot { background: var(--primary); border-color: var(--primary-2); }
    .source-dot { background: var(--primary); }

    /* Bölüm ve sınıf çipi */
    .dept-chip {
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      min-height: 44px;
      margin: var(--space-2) 0 var(--space-1);
      padding: 6px 12px 6px 14px;
      border: 0;
      border-radius: var(--radius-pill);
      background: var(--primary-2);
      color: var(--ink);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
    }
    .dept-chip > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dept-chip .icon { width: 20px; height: 20px; color: var(--primary); }
    .dept-chip .icon:last-child { color: var(--ink); width: 18px; height: 18px; }

    /* Öne çıkan kart: açık mavi geçiş */
    .hero-course, .feature-card, .details-hero {
      border: 0;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--hero-a) 0%, var(--hero-a) 45%, var(--hero-b) 100%);
      color: var(--ink);
      box-shadow: none;
    }
    .hero-course .kicker { color: var(--primary); }
    .hero-icon, .feature-card .feature-icon { background: var(--chip-on-tint); color: var(--primary); }
    .hero-meta, .details-hero p { color: var(--ink); opacity: .82; }
    /* Geçişin koyu ucunda --muted 4,16:1 kalıyordu (AA altı); öne çıkan kartlarda daha koyu ton. */
    .hero-sub, .feature-card .feature-copy { color: var(--muted-on-hero); }
    .hero-row > .icon:last-child, .feature-card > .icon:last-child, .info-card > .icon:last-child, .tile > .icon:last-child {
      width: 38px; height: 38px; padding: 9px; border-radius: 50%; background: var(--chip-on-tint); color: var(--ink);
    }
    .feature-card {
      width: 100%;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-4);
      min-height: 112px;
      padding: var(--space-4) 18px;
      cursor: pointer;
      text-align: left;
    }
    .feature-card .feature-icon { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; }
    .feature-card .feature-icon .icon { width: 28px; height: 28px; }
    .feature-title { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .feature-copy { display: block; margin-top: 5px; color: var(--muted); font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
    .feature-card > span:nth-child(2) { min-width: 0; }

    /* Zaman çizelgesi kartı */
    .panel { padding: var(--space-2) var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--card-shadow); }
    .panel .timeline { gap: 0; }
    .panel .timeline-row { grid-template-columns: 50px 14px minmax(0, 1fr); }
    .panel .timeline-card { min-height: 70px; margin: 4px 0; border: 0; border-radius: 16px; background: transparent; box-shadow: none; }
    .panel .timeline-row + .timeline-row .timeline-card { border-top: 1px solid var(--line); border-radius: 0; }
    .panel .timeline-row.is-next .timeline-card { border-top-color: transparent; border-radius: 16px; background: var(--primary-2); }
    .panel .timeline-row.is-next + .timeline-row .timeline-card { border-top-color: transparent; }
    .timeline-title { font-size: 16px; font-weight: 750; }
    .timeline-meta { font-size: var(--fs-meta); }
    .time { padding-top: 16px; font-size: 13px; color: var(--muted); }
    .rail::before { background: var(--line); }
    .rail::after { background: var(--rail-idle); border-color: var(--surface); box-shadow: none; }
    .timeline-row.is-next .rail::after { background: var(--primary); }
    .timeline:not(.has-next) .timeline-row:first-child .rail::after { background: var(--primary); }
    .timeline-card:hover { border-color: var(--line); }

    /* Pastel kart ızgarası */
    .tile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
    .tile {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto 1fr;
      gap: var(--space-2) var(--space-2);
      min-height: 0;
      padding: var(--space-4);
      border: 0;
      border-radius: var(--radius);
      background: var(--tint-blue);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }
    .tile .icon-tile { grid-column: 1; grid-row: 1; width: 46px; height: 46px; border-radius: 50%; background: var(--chip-on-tint); }
    .tile > span:nth-child(2) { grid-column: 1 / -1; grid-row: 2; min-width: 0; align-self: start; }
    .tile > .icon:last-child { grid-column: 2; grid-row: 1; align-self: start; width: 32px; height: 32px; padding: 7px; }
    .tile-title { display: block; font-size: 16px; font-weight: 800; letter-spacing: -.02em; overflow-wrap: anywhere; }
    .tile-copy { display: block; margin-top: 4px; color: var(--muted); font-size: var(--fs-meta); line-height: 1.4; overflow-wrap: anywhere; }
    .tint-blue { background: var(--tint-blue); }
    .tint-blue .icon-tile { color: var(--tint-blue-ink); }
    .tint-violet { background: var(--tint-violet); }
    .tint-violet .icon-tile { color: var(--tint-violet-ink); }
    .tint-cream { background: var(--tint-cream); }
    .tint-cream .icon-tile { color: var(--tint-cream-ink); }
    .tint-green { background: var(--tint-green); }
    .tint-green .icon-tile { color: var(--tint-green-ink); }
    @media (max-width: 340px) { .tile-grid { grid-template-columns: minmax(0, 1fr); } }

    /* Bilgi ve liste kartları */
    .timeline-card, .info-card, .list-card, .settings-card, .form-card { border-radius: var(--radius); }
    .info-card { min-height: 92px; padding: var(--space-4); gap: var(--space-3); grid-template-columns: 52px minmax(0, 1fr) auto; }
    .info-card .icon-tile, .list-card .icon-tile { width: 52px; height: 52px; border-radius: 50%; }
    .info-card.menu { border-color: transparent; background: var(--tint-green); }
    .info-card.menu .icon-tile { background: var(--chip-on-tint); color: var(--tint-green-ink); }
    .info-card.deadline { border-color: transparent; background: var(--tint-blue); }
    .info-card.deadline .icon-tile { background: var(--chip-on-tint); color: var(--tint-blue-ink); }
    .info-card.announcement { border-color: transparent; background: var(--tint-cream); }
    .info-card.announcement .icon-tile { background: var(--chip-on-tint); color: var(--tint-cream-ink); }
    .info-card.tint-blue, .info-card.tint-violet, .info-card.tint-cream, .info-card.tint-green { border-color: transparent; }
    .info-card[class*="tint-"] .icon-tile { background: var(--chip-on-tint); }
    .card-title { font-size: var(--fs-card); font-weight: 800; letter-spacing: -.02em; }
    .card-copy { font-size: 14px; }
    .icon-tile { background: var(--primary-2); color: var(--primary); }
    .list-title { font-size: 15px; }
    .list-meta { font-size: var(--fs-small); }
    .empty-state { border-radius: var(--radius-lg); }
    .profile-card { border-color: transparent; background: var(--primary-2); }
    .course-option { border-radius: 18px; }
    .course-option.selected { border-color: color-mix(in srgb, var(--primary) 40%, transparent); background: var(--primary-2); }
    [data-app-theme="dark"] .course-option.selected { background: var(--primary-2); }

    /* Seçiciler */
    .weekday-row { gap: var(--space-2); }
    .weekday { min-height: 48px; border-radius: var(--radius-sm); background: var(--surface-3); color: var(--ink); font-size: 15px; font-weight: 600; }
    .weekday.active { background: var(--primary); color: var(--on-primary); }
    .segmented { gap: var(--space-2); padding: 0; background: transparent; }
    .segment { min-height: 46px; border-radius: var(--radius-sm); background: var(--surface-3); color: var(--ink); font-size: 14px; font-weight: 600; }
    .segment.active { background: var(--primary); color: var(--on-primary); box-shadow: none; }
    .chip.active { border-color: var(--primary); background: var(--primary-2); color: var(--primary); }
    /* Gündem filtreleri: dar ekranda kesilmek yerine alt satıra geçer. */
    .filter-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .filter-row .segment { flex: 1 1 auto; padding: 8px 10px; white-space: nowrap; }
    @media (max-width: 360px) {
      .filter-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .filter-row .segment { padding: 8px 4px; font-size: 13px; }
      .info-card { grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; padding: 14px; }
      .info-card .icon-tile, .list-card .icon-tile { width: 42px; height: 42px; }
      .feature-card { grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; padding: 14px; }
      .feature-card .feature-icon { width: 52px; height: 52px; }
      .page-title { font-size: 26px; }
    }

    /* Düğmeler */
    .primary-button { border-color: var(--primary); background: var(--primary); color: var(--on-primary); box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 22%, transparent); }
    .secondary-button { border-radius: var(--radius-sm); }

    /* Ayarlar */
    .settings-card { border-radius: var(--radius); }
    .setting-row { min-height: 60px; padding: 8px var(--space-4); font-size: 15px; font-weight: 600; }
    .setting-row .icon:first-child { color: var(--muted); }
    .setting-row .setting-value { display: block; margin-top: 2px; color: var(--muted); font-size: var(--fs-small); font-weight: 500; }
    /* Belgesinde sorun bilinen kayıt için öğrenciye kalan tek işaret (2026-10-24). */
    .confirm-chip { display: inline-block; margin-left: 7px; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--tint-cream); color: var(--tint-cream-ink); font-size: 11px; font-weight: 700; letter-spacing: .01em; vertical-align: middle; }
    .local-note .confirm-chip, .sheet-copy .confirm-chip { margin: 0 6px 0 0; }
    .independence-note { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-4); color: var(--muted); font-size: var(--fs-meta); }

    /* Alt gezinme */
    .bottom-nav { min-height: 84px; background: color-mix(in srgb, var(--surface) 96%, transparent); }
    .nav-button { font-size: 12px; font-weight: 600; }
    .nav-button.active { color: var(--primary); font-weight: 750; }
    .nav-button.active .nav-icon-wrap { background: transparent; }
    .nav-button.active .icon { stroke-width: 2.2; }
    .map-pin { box-shadow: 0 7px 15px color-mix(in srgb, var(--primary) 30%, transparent); }
    [data-app-theme="dark"] .status-bar, [data-app-theme="dark"] .bottom-nav, [data-app-theme="dark"] .sticky-action { background: color-mix(in srgb, var(--surface) 96%, transparent); }
    [data-app-theme="dark"] .rail::before { background: var(--line); }
    [data-app-theme="dark"] .info-card { background-image: none; }
  </style>
</head>

  <script>
    (function () {
      "use strict";
      /*
       * Çerçeve koruması (2026-10-23). GitHub Pages X-Frame-Options göndermiyor, sayfa içi CSP de
       * frame-ancestors koyamıyor; kötü niyetli bir sayfa uygulamayı görünmez bir çerçevede açıp
       * öğrenciye "dersi kaldır" gibi düğmelere bastırabilirdi. Yalnız yayın adresinde uygulanır:
       * özel demo bağlantısı başka bir kökende, kendi çerçevesinde çalışmaya devam eder.
       */
      var PUBLIC_HOSTS = ["unikapsul.github.io"];
      var framed = true;
      try { framed = window.top !== window.self; } catch (error) {}
      if (framed && PUBLIC_HOSTS.indexOf(location.hostname) !== -1) {
        document.body.innerHTML = '<p style="max-width:32rem;margin:2rem auto;padding:0 16px;font:16px/1.5 system-ui,sans-serif">'
          + 'ÜniKapsül başka bir sayfanın içinde açılamaz. <a href="https://unikapsul.github.io/" target="_top" rel="noopener noreferrer">Doğrudan aç</a></p>';
        return;
      }


      var STORAGE_KEY = "unikapsul-prototype-v2";
      // Tek iletişim kanalı (legal-safety-contract.md §5 kapı 4): hata bildirimi, düzeltme ve
      // kaldırma talepleri. Uygulama hiçbir şeyi kendisi göndermez; e-posta uygulaması açılır.
      var CONTACT_EMAIL = "unikapsuliletisim@gmail.com";
      var REMOVED_NAME = "[kaldırıldı]";
      // legal-safety-contract.md §1'deki zorunlu uyarı, kelimesi kelimesine.
      var INDEPENDENCE_NOTE = "Bu uygulama bağımsız bir öğrenci projesidir. Niğde Ömer Halisdemir Üniversitesi’nin resmî uygulaması değildir ve üniversite tarafından işletilmemektedir.";
      var catalog = window.UNIKAPSUL_CATALOG;
      if (!catalog || !Array.isArray(catalog.units) || !catalog.units.length) {
        document.getElementById("screen").innerHTML = '<div class="empty-state"><h3>Program kataloğu yüklenemedi</h3><p>Sayfayı yenileyip yeniden dene.</p></div>';
        return;
      }
      var faculties = catalog.units.map(function (unit) {
        return {
          id: unit.id,
          name: unit.name,
          shortName: unit.shortName || "",
          kind: unit.kind,
          directoryUrl: unit.directoryUrl
        };
      });
      var departments = {};
      catalog.units.forEach(function (unit) {
        unit.programs.forEach(function (program) {
          departments[program.id] = {
            id: program.id,
            facultyId: unit.id,
            name: program.displayName || program.name,
            programName: program.name,
            campus: program.campus,
            icon: program.icon,
            defaultDay: program.defaultDay,
            conflictPair: program.conflictPair,
            years: program.years,
            gradeLabel: program.gradeLabel,
            stageLabels: program.stageLabels || [],
            studyLevel: program.studyLevel,
            degreeLabel: program.degreeLabel,
            status: program.status,
            noStudentsNote: program.noStudentsNote || "",
            sourceUrl: program.sourceUrl,
            directoryUrl: program.directoryUrl,
            observedAt: program.observedAt,
            term: program.term
          };
        });
      });
      var offeringData = window.UNIKAPSUL_OFFERINGS;
      if (!offeringData || !Array.isArray(offeringData.offerings)) {
        document.getElementById("screen").innerHTML = '<div class="empty-state"><h3>Ders kayıtları yüklenemedi</h3><p>Sayfayı yenileyip yeniden dene.</p></div>';
        return;
      }

      var SHORT_DAY = { "Pazartesi": "Pzt", "Salı": "Sal", "Çarşamba": "Çar", "Perşembe": "Per", "Cuma": "Cum" };
      var diningData = window.UNIKAPSUL_DINING_MENU || { rows: [], source: {} };

      function turkeyDateIso(date) {
        var parts = new Intl.DateTimeFormat("en", {
          timeZone: "Europe/Istanbul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(date || new Date());
        var values = {};
        parts.forEach(function (part) { values[part.type] = part.value; });
        return values.year + "-" + values.month + "-" + values.day;
      }

      function diningRowFor(date) {
        return (diningData.rows || []).find(function (row) { return row.date === date; }) || null;
      }

      function nextDiningRow(date) {
        return (diningData.rows || []).find(function (row) { return row.date > date; }) || null;
      }

      function diningItemLabel(value) {
        if (!value) return "";
        var lower = value.toLocaleLowerCase("tr-TR");
        return lower.charAt(0).toLocaleUpperCase("tr-TR") + lower.slice(1);
      }

      function diningDateLabel(value) {
        var parts = value.split("-").map(Number);
        return new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long" })
          .format(new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 12)));
      }

      function diningCardCopy() {
        var today = turkeyDateIso();
        var row = diningRowFor(today);
        if (row && row.service_status === "official_holiday") return "Resmî tatil";
        if (row && row.items_raw && row.items_raw.length) {
          return row.items_raw.map(diningItemLabel).join(", ");
        }
        if (diningData.source && diningData.source.source_month === today.slice(0, 7)) {
          var next = nextDiningRow(today);
          return next ? (team() ? "Bugün için resmî satır yok · Sıradaki " : "Bugün menü yok · Sıradaki ") + diningDateLabel(next.date) : (team() ? "Bugün için resmî menü satırı yok" : "Bugün menü yok");
        }
        return team() ? "Güncel aylık menü bekleniyor" : "Bu ayın menüsü henüz yayımlanmadı";
      }

      function diningObservedLabel() {
        var value = diningData.source && diningData.source.source_observed_at;
        if (!value) return "bilinmiyor";
        var date = new Date(value);
        if (Number.isNaN(date.valueOf())) return value;
        return new Intl.DateTimeFormat("tr-TR", {
          timeZone: "Europe/Istanbul",
          day: "numeric",
          month: "long",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function diningMenuSheetHtml() {
        var today = turkeyDateIso();
        var row = diningRowFor(today);
        var next = row ? null : nextDiningRow(today);

      var STATUS_LABEL = {

      var STATE_ROUTES = ["onboarding-1", "onboarding-2", "today", "program", "agenda", "more", "notifications", "course-add", "course-detail", "campus", "grades", "attendance", "exams", "curriculum"];

          var end = item.end || "";

      /*
       * Notlar ders başına tutulur (2026-10-23). Önceden anahtar oturum kimliğiydi:

      function gradeRecordUsed(record) {

      function migrateSessionGrades(target) {

        Object.keys(target.grades || {}).forEach(function (id) {

        custom.forEach(function (course) { knownIds[course.id] = true; });
        if (input.selected != null && (!Array.isArray(input.selected) || input.selected.length > 500)) return null;
        var seen = Object.create(null);

          seen[id] = true;

          if (own(input.gpa, "expanded") && typeof input.gpa.expanded !== "boolean") return null;
          clean.gpa = {
            prevAverage: prevAverage === null ? null : Number(prevAverage),
            prevEcts: prevEcts === null ? null : Number(prevEcts),
            expanded: !!input.gpa.expanded
          };
        }
        return clean;
      }

      function loadState() {
        try {
          var stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
          var clean = sanitizeStoredState(stored);
          if (clean) {
            // Tema varsayılanı "light" iken "system" oldu; eski kayıttaki
            // varsayılanı seçim sanıp cihaz ayarını ezmeyelim.
            if (!stored.themeChosen) clean.theme = "system";
            return clean;
          }
        } catch (error) {}
        return freshDefaultState();
      }

      var state = loadState();
      var screen = document.getElementById("screen");
      var app = document.getElementById("app");

      /*
       * Tema. Varsayılan "system": öğrencinin telefonu koyu moddaysa uygulama
       * da koyu açılır. Ayarlardan açık/koyu seçilirse o seçim sistemi ezer.
       * Jetonlar :root üzerinde tanımlı olduğundan nitelik belgeye yazılır;
       * iç kutuya yazılınca body'den kalıtılan metin rengi açık temada kalıyordu.
       */
      var darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

      function systemPrefersDark() {
        if (darkQuery && darkQuery.matches) return true;
        return document.documentElement.getAttribute("data-theme") === "dark";
      }

      function resolvedTheme() {
        if (state.theme === "dark" || state.theme === "light") return state.theme;
        return systemPrefersDark() ? "dark" : "light";
      }

      function applyAccessibility() {
        var root = document.documentElement;
        if (state.textScale && state.textScale !== "normal") root.setAttribute("data-text-scale", state.textScale);
        else root.removeAttribute("data-text-scale");
        if (state.reduceMotion) root.setAttribute("data-reduce-motion", "1");
        else root.removeAttribute("data-reduce-motion");
      }

      function applyTheme() {
        var theme = resolvedTheme();
        document.documentElement.setAttribute("data-app-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0c141e" : "#f6f8fa");
      }

      if (darkQuery && darkQuery.addEventListener) {
        darkQuery.addEventListener("change", function () {
          if (state.theme !== "dark" && state.theme !== "light") applyTheme();
        });
      }
      var sheetBackdrop = document.getElementById("sheet-backdrop");
      var sheetBody = document.getElementById("sheet-body");
      var sheetTitle = document.getElementById("sheet-title");
      var toastElement = document.getElementById("toast");
      var toastTimer;
      var layoutFrame;

      function syncFixedInsets() {
        cancelAnimationFrame(layoutFrame);
        layoutFrame = requestAnimationFrame(function () {
          var scroll = screen.querySelector(".screen-scroll");
          if (!scroll) return;
          var fixedBar = screen.querySelector(".sticky-action") || screen.querySelector(".bottom-nav");
          if (!fixedBar) {
            scroll.style.removeProperty("padding-bottom");
            return;
          }
          var measuredHeight = Math.ceil(fixedBar.getBoundingClientRect().height);
          scroll.style.paddingBottom = Math.max(measuredHeight + 24, 96) + "px";
        });
      }

      new MutationObserver(syncFixedInsets).observe(screen, { childList: true, subtree: true });
      window.addEventListener("resize", syncFixedInsets);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", syncFixedInsets);

      function persist() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) {}
      }

      // Not hesabı: bileşenler ve ağırlıklar öğrencinin kendi girdisidir.
      // Varsayılan vize %40 / final %60; öğrenci bileşen ekleyip oranları
      // değiştirebilir. Uygulama geçme sınırı, harf notu veya hedef
      // varsaymaz; yönetmelik alınmadan hiçbir eşik gösterilmez.
      var DEFAULT_COMPONENTS = [
        { id: "vize", name: "Vize", weight: 40 },
        { id: "final", name: "Final", weight: 60 }
      ];
      var EXTRA_COMPONENTS = ["Proje", "Ödev", "Quiz", "Laboratuvar", "Sunum", "İkinci vize"];

      // Notun anahtarı ders kimliği değil ders grubudur: bir dersin bütün oturumları
      // aynı kaydı paylaşır. Arayüz öznitelikleri oturum kimliğini taşımaya devam eder.
      function gradeKeyOf(courseId) {
        var course = myCoursePool().find(function (item) { return item.id === courseId; })
          || courses.find(function (item) { return item.id === courseId; });
        return course ? absenceKey(course) : courseId;
      }

      function gradeRecord(course) {
        return (state.grades && state.grades[absenceKey(course)]) || null;
      }

      // Her dersin tek temsilcisi (ilk oturumu): not listesi ve ortalama ders başına bir kez sayar.
      function courseRepresentatives() {
        var seen = Object.create(null);
        return selectedCourses().filter(function (course) {
          var key = absenceKey(course);
          if (seen[key]) return false;
          seen[key] = true;
          return true;
        });
      }

      function gradesOf(courseId) {
        if (!state.grades) state.grades = {};
        courseId = gradeKeyOf(courseId);
        if (!state.grades[courseId]) {
          state.grades[courseId] = {
            target: null,
            components: DEFAULT_COMPONENTS.map(function (item) {
              return { id: item.id, name: item.name, weight: item.weight, score: null };
            })
          };
        }
        return state.grades[courseId];
      }

      function gradeSummary(record) {
        var totalWeight = 0;
        var scoredWeight = 0;
        var earned = 0;
        record.components.forEach(function (component) {
          var weight = Number(component.weight) || 0;
          totalWeight += weight;
          if (component.score !== null && component.score !== "") {
            scoredWeight += weight;
            earned += (Number(component.score) * weight) / 100;
          }
        });
        var remaining = Math.max(0, totalWeight - scoredWeight);
        var needed = null;
        var reachable = true;
        if (record.target !== null && record.target !== "") {
          var gap = Number(record.target) - earned;
          if (gap <= 0) needed = 0;
          else if (remaining <= 0) { needed = null; reachable = false; }
          else {
            needed = Math.ceil((gap * 100) / remaining);
            reachable = needed <= 100;
          }
        }
        return {
          totalWeight: totalWeight,
          scoredWeight: scoredWeight,
          remaining: remaining,
          earned: Math.round(earned * 10) / 10,
          partialAverage: scoredWeight ? Math.round((earned / scoredWeight) * 1000) / 10 : null,
          needed: needed,
          reachable: reachable
        };
      }

      function gradeSummaryHtml(courseId) {
        var record = gradesOf(courseId);
        var sum = gradeSummary(record);
        var html = "";
        if (sum.totalWeight !== 100) {
          html += '<p class="grade-warning">' + icon("alert") + '<span>Ağırlık toplamı ' + sum.totalWeight
            + '. Hesap için 100 olmalı.</span></p>';
        }
        if (!sum.scoredWeight) {
          html += '<p class="grade-line">Henüz not girilmedi.</p>';
        } else {
          html += '<p class="grade-line"><strong>' + sum.earned + ' / 100</strong> toplandı · tamamlanan %'
            + sum.scoredWeight + "'lik kısımdaki ortalaman " + sum.partialAverage + '</p>';
        }
        if (record.target === null || record.target === "") {
          html += '<p class="grade-hint">Hedef girersen kalan bileşenlerden ne gerektiğini hesaplarım.</p>';
        } else if (sum.needed === 0) {
          html += '<p class="grade-line ok">Hedefine şu anki notlarınla ulaştın.</p>';
        } else if (sum.needed === null) {
          html += '<p class="grade-line over">Girilecek bileşen kalmadı; hedefe ulaşılamadı.</p>';
        } else if (!sum.reachable) {
          html += '<p class="grade-line over">Kalan %' + sum.remaining
            + "'lik kısımdan 100 alsan bile hedefe ulaşılmıyor.</p>";
        } else {
          html += '<p class="grade-line ok">Hedef ' + record.target + ' için kalan %' + sum.remaining
            + "'lik kısımdan ortalama <strong>" + sum.needed + '</strong> almalısın.</p>';
        }
        html += '<p class="attendance-note">' + icon("info")
          + '<span>Bu yalnızca ham puan hesabıdır. Harf notu, geçme sınırı ve bağıl değerlendirme '
          + 'yönetmelikten alınmadığı için gösterilmiyor.</span></p>';
        return html;
      }

      function gradeRow(courseId, component) {
        var base = escapeHtml(courseId + ':' + component.id);
        return '<div class="grade-row">'
          + '<span class="grade-name">' + escapeHtml(component.name) + '</span>'
          + '<label class="grade-field"><span>Ağırlık</span><input class="grade-input" type="number" inputmode="numeric" min="0" max="100" value="'
          + escapeHtml(String(component.weight)) + '" data-grade="' + base + ':weight" aria-label="'
          + escapeHtml(component.name) + ' ağırlığı"></label>'
          + '<label class="grade-field"><span>Not</span><input class="grade-input" type="number" inputmode="numeric" min="0" max="100" value="'
          + (component.score === null ? "" : escapeHtml(String(component.score))) + '" placeholder="—" data-grade="'
          + base + ':score" aria-label="' + escapeHtml(component.name) + ' notu"></label>'
          + '<button class="grade-remove" data-grade-remove="' + base + '" aria-label="'
          + escapeHtml(component.name) + ' bileşenini kaldır">' + icon("x") + '</button>'
          + '</div>';
      }

      function conflictOptionText(item) {
        var course = myCoursePool().find(function (c) { return c.id === item.courseId; });
        var where = course && course.day ? course.dayLong + " " + course.start + " oturumuna girilen" : "Önceden girilen";
        var sum = gradeSummary(item.record);
        var parts = [];
        if (sum.scoredWeight) parts.push(sum.earned + " / 100 toplandı (%" + sum.scoredWeight + ")");
        if (item.record.target !== null && item.record.target !== undefined && item.record.target !== "") parts.push("hedef " + item.record.target);
        if (item.record.letter) parts.push("harf " + item.record.letter);
        if (item.record.ects) parts.push(item.record.ects + " AKTS");
        if (item.record.repeat) parts.push("tekrar");
        return { title: where, copy: parts.join(" · ") || "Not yok" };
      }

      // Aynı dersin iki oturumuna farklı not girilmişse hangisinin geçerli olduğu sorulur.
      function gradeConflictHtml(course) {
        var key = absenceKey(course);
        var list = (state.gradeConflicts || {})[key];
        if (!list) return "";
        return '<div class="grade-conflict" role="group" aria-label="Not kaydı seçimi">'
          + '<p class="grade-warning">' + icon("alert") + '<span><strong>' + escapeHtml(course.name)
          + '</strong> dersine ' + list.length + ' farklı not kaydı girmişsin. Notlar artık ders başına tutuluyor; hangisi geçerli?</span></p>'
          + list.map(function (item, index) {
            var text = conflictOptionText(item);
            return '<button class="secondary-button conflict-choice" data-conflict-choice="' + escapeHtml(key) + '::' + index + '">'
              + '<span class="list-title">' + escapeHtml(text.title) + '</span><span class="list-meta">' + escapeHtml(text.copy) + '</span></button>';
          }).join("")
          + '<p class="grade-hint">Seçmediğin kayıt silinir. Seçim yapana kadar bu dersin notu ortalamaya katılmaz.</p>'
          + '</div>';
      }

      function gradeCard(course) {
        if ((state.gradeConflicts || {})[absenceKey(course)]) {
          return '<section class="section"><div class="section-heading"><h2>Not durumu</h2></div>' + gradeConflictHtml(course) + '</section>';
        }
        var record = gradesOf(course.id);
        return '<section class="section"><div class="section-heading"><h2>Not durumu</h2>'
          + '<button class="text-button" data-sheet="grade-add">Bileşen ekle</button></div>'
          + '<div class="grade-card">'
          + record.components.map(function (component) { return gradeRow(course.id, component); }).join("")
          + '<div class="grade-row target"><span class="grade-name">Hedefim</span>'
          + '<label class="grade-field wide"><span>Puan</span><input class="grade-input" type="number" inputmode="numeric" min="0" max="100" value="'
          + (record.target === null ? "" : escapeHtml(String(record.target)))
          + '" placeholder="—" data-grade="' + escapeHtml(course.id) + ':__target:target" aria-label="Hedef puan"></label></div>'
          + '<div class="grade-summary" id="grade-summary">' + gradeSummaryHtml(course.id) + '</div>'
          + '</div>'
          + '<button class="text-button grade-all" data-route="grades">Tüm derslerimin notları ' + icon("chevron") + '</button>'
          + '</section>';
      }

      /*
       * Devamsızlık (2026-10-16'da yeniden kuruldu).
       *
       * Eski model her oturum için iki sayaçtı ("girmediğim hafta" ve öğrencinin
       * elle girdiği "hak"): haftada iki kez yapılan ders iki ayrı sayaç
       * oluyordu, tarih tutulmuyordu, geri alınacak bir kayıt yoktu ve sınır
       * hiç hesaplanmıyordu.
       *
       * Şimdi:
       * - Birim DERS, oturum değil: aynı kod (yoksa aynı ad) tek kartta toplanır.
       * - Ölçü DERS SAATİ: oturum süresinden türetilir (45+15 dk düzeni:
       *   08:00–10:45 = 3 saat). Bir oturumu kaçırmak o oturumun saati kadardır.
       * - Her devamsızlık TARİHLİ bir kayıttır; tek tek geri alınabilir. Tarih
       *   o oturumun haftanın gününe ve dönem aralığına uymazsa kabul edilmez.
       * - Sınır, Önlisans ve Lisans Yönetmeliği Madde 17'den TAHMİN edilir:
       *   teorik derste toplam saatin %30'u, uygulamada %20'si. Toplam saat =
       *   oturum saati × akademik takvimdeki öğretim günleri (ara sınav dönemi
       *   düşülür). Yönetmelik hesap birimini ve yuvarlamayı yazmadığı için
       *   (AGENTS.md §6.1) sonuç her yerde "tahmini" diye yazılır ve aşağı
       *   yuvarlanır; öğrenci izlencedeki sınırı girerse o kullanılır.
       * - Lisansüstü yönetmeliği bir devam oranı yazmıyor: tahmin yapılmaz.
       */
      var REGULATION_ARTICLE = "Önlisans ve Lisans Eğitim-Öğretim ve Sınav Yönetmeliği, Madde 17";

      /*
       * Öğrenci görünümü / ekip görünümü (2026-10-20).
       *
       * Öğrencinin işine yarayan: dersi, saati, dersliği, belgenin adı ve
       * tarihi, kontrol bekleyip beklemediği, belgeyi açma bağlantısı.
       * Ekibin işine yarayan: kaynak kimlikleri (ND04), dosya sürümleri
       * (w151mnwe.pdf@…), sha256, ayrıştırıcı notları, kayıt sayıları,
       * yayın kapısı istatistikleri, durum simülasyonu paneli.
       *
       * Varsayılan öğrenci görünümüdür. Adresin sonuna #ekip yazılınca ekip
       * görünümü bu cihazda açılır, #ogrenci ile kapanır. Bu bir GÜVENLİK
       * sınırı değildir: veri dosyaları zaten herkese açık; ayrım yalnız
       * ekranı öğrenci için sadeleştirir.
       */
      // Yayın paketinde (tools/build-public-site.mjs) true yapılır: herkese açık sitede ekip görünümü
      // açılamaz; iç bilgiler yalnız yerel geliştirmede ve özel yönetim panelinde (2026-10-24).
      var PUBLIC_BUILD = true;

      function team() { return !PUBLIC_BUILD && !!state.teamView; }

      function applyViewFromHash() {
        var hash = (location.hash || "").replace("#", "");
        if (hash === "ekip" && !state.teamView && !PUBLIC_BUILD) { state.teamView = true; persist(); }
        if (hash === "ogrenci" && state.teamView) { state.teamView = false; persist(); }
        document.documentElement.classList.toggle("team-view", team());
      }

      // Belgenin kendi dipnotu öğrenciyi ilgilendirir ("Belgede **: …");
      // ayrıştırma notu ilgilendirmez. Kontrol bekleyen kayıt sade dille söylenir.
      function studentNotes(course) {
        var notes = String(course.recordNotes || "");
        var own = notes.match(/Belgede [^:]{1,6}: [^]*?(?=( Belgede [^:]{1,6}: )|$)/g) || [];
        var out = [];
        if (course.status === "needs_review") out.push("Saat ve dersliği bölümünün resmî ders programından teyit et.");
        return out.concat(own.map(function (s) { return s.trim(); })).join(" ");
      }

      /*
       * Öğrenci ekranında iç süreç dili yok (kullanıcı kararı 2026-10-24): kaynak şeridi, "kontrol
       * bekliyor", sayfa künyesi, son kontrol tarihi ve benzeri yalnız ekip görünümünde ve özel
       * yönetim panelinde. Öğrenciye kalan tek işaret, belgesinde sorun bilinen kayıttaki sade
       * "Teyit et" etiketi ve resmî belgeye bağlantı.
       */
      function confirmChip(item) {
        var status = item && (item.status || item.verification_status);
        return status === "needs_review" ? '<span class="confirm-chip">Teyit et</span>' : '';
      }

      function courseNotes(course) {
        return team() ? String(course.recordNotes || "") : studentNotes(course);
      }

      // Personelin yapacağı işler (ders tanımı girme, not girişi) öğrenci
      // takviminde gürültüdür; ekip görünümünde hepsi kalır.
      var STAFF_EVENT = /Bologna|Otomasyon Sistemine|uygulama şekillerinin/i;

      function sessionHours(course) {
        if (!course.start || !course.end) return 0;
        var minutes = toMinutes(course.end) - toMinutes(course.start);
        if (minutes <= 0) return 0;
        return Math.max(1, Math.round((minutes + 15) / 60));
      }

      function absenceKey(course) {
        return courseGroupKey(course.departmentId, course.code, course.name);
      }

      /*
       * Ders başına devamsızlık kaydı (2026-10-24 düzeni):
       *   entries   — öğrencinin işlediği kaçırılan oturumlar (tarihli)
       *   kinds     — oturum başına teorik/uygulama seçimi ({ oturumKimliği: "uygulama" })
       *   limits    — izlencedeki sınır, tür başına ({ teorik: 12 })
       *   snapshots — otomasyondan bakıp girdiği toplam, tür başına ({ teorik: { hours, asOf } })
       * Eski kayıttaki ders düzeyi `kind`/`limit` bir kez bu alanlara taşınır.
       */
      function normalizeAbsenceRecord(record) {
        if (!Array.isArray(record.entries)) record.entries = [];
        if (!plainRecord(record.kinds)) record.kinds = {};
        if (!plainRecord(record.limits)) record.limits = {};
        if (!plainRecord(record.snapshots)) record.snapshots = {};
        if (record.kind === "teorik" || record.kind === "uygulama") { record.legacyKind = record.kind; }
        record.kind = null;
        if (record.limit != null) {
          var k = record.legacyKind || "teorik";
          if (record.limits[k] == null) record.limits[k] = record.limit;
          record.limit = null;
        }
        return record;
      }

      function plainRecord(value) {
        return !!value && typeof value === "object" && !Array.isArray(value);
      }

      function absenceRecord(key, create) {
        if (!state.absences) state.absences = {};
        var record = state.absences[key];
        if (!record && create) record = state.absences[key] = { entries: [] };
        return normalizeAbsenceRecord(record || { entries: [] });
      }

      function isoWeekday(iso) {
        return ["", "Pzt", "Sal", "Çar", "Per", "Cum", ""][new Date(iso + "T12:00:00Z").getUTCDay()];
      }

      function addDaysIso(iso, days) {
        return new Date(Date.parse(iso + "T12:00:00Z") + days * 86400000).toISOString().slice(0, 10);
      }

      // Dönem aralığı ve öğretim yapılmayan aralıklar akademik takvimden okunur.
      function teachingTerm() {
        var events = calendarEvents();
        var begin = events.find(function (e) { return e.term === "guz" && /^ÖĞRETİME BAŞLAMA/.test(e.title); });
        var finish = events.find(function (e) { return e.term === "guz" && /^ÖĞRETİMİ BİTİRME \( ?Ön Lisans/.test(e.title); });
        if (!begin || !finish) return null;
        var gaps = events.filter(function (e) { return e.term === "guz" && /Ara Sınav Dönemi/.test(e.title); });
        return { start: begin.start, end: finish.end, gaps: gaps };
      }

      function inGap(term, iso) {
        return term.gaps.some(function (g) { return g.start <= iso && iso <= g.end; });
      }

      function teachingDays(day, term) {
        var count = 0;
        for (var iso = term.start; iso <= term.end; iso = addDaysIso(iso, 1)) {
          if (isoWeekday(iso) === day && !inGap(term, iso)) count += 1;
        }
        return count;
      }

      function sessionKind(record, session) {
        var chosen = record.kinds[session.id];
        if (chosen === "teorik" || chosen === "uygulama") return chosen;
        if (session.kind === "laboratuvar" || session.kind === "uygulama") return "uygulama";
        return record.legacyKind || "teorik";
      }

      /*
       * Teorik ve uygulama oturumları ayrı sınırla sayılır (Madde 17 iki oran veriyor; önceden bir
       * laboratuvar oturumu bütün dersi %20'ye çekiyordu). Kullanılan = otomasyon değeri (varsa) +
       * o tarihten SONRAKİ kayıtlar; önceki kayıtlar değere dahil sayılır, iki kez sayılmaz.
       * İşlenmemiş oturum katılmış sayılmaz: ekran "kayıtlarına göre" der.
       */
      function absenceParts(group, record, term) {
        var kinds = group.graduate ? ["teorik"] : ["teorik", "uygulama"];
        var parts = kinds.map(function (kind) {
          var sessions = group.sessions.filter(function (s) { return group.graduate || sessionKind(record, s) === kind; });
          return { kind: kind, sessions: sessions, ids: sessions.map(function (s) { return s.id; }) };
        }).filter(function (part) { return part.sessions.length; });
        if (!parts.length) parts = [{ kind: "teorik", sessions: group.sessions, ids: group.sessions.map(function (s) { return s.id; }) }];
        parts.forEach(function (part, index) {
          var snap = record.snapshots[part.kind];
          part.snapshot = snap && Number.isFinite(snap.hours) && /^\d{4}-\d{2}-\d{2}$/.test(snap.asOf || "") ? snap : null;
          part.entries = record.entries.filter(function (e) {
            // Artık seçili olmayan oturumun kaydı ilk bölümde sayılır; kayıt kaybolmaz.
