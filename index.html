            return part.ids.indexOf(e.sessionId) !== -1 || (index === 0 && !parts.some(function (p) { return p.ids.indexOf(e.sessionId) !== -1; }));
          });
          // Kayda alan yazılmaz (cihazda saklanır); dahil olanlar ayrı listede tutulur.
          part.included = {};
          part.entries.forEach(function (e) { if (part.snapshot && (!e.date || e.date <= part.snapshot.asOf)) part.included[e.id] = true; });
          part.used = (part.snapshot ? part.snapshot.hours : 0) + part.entries.reduce(function (sum, e) { return sum + (part.included[e.id] ? 0 : (e.hours || 0)); }, 0);
          part.termHours = term ? part.sessions.reduce(function (sum, s) { return sum + sessionHours(s) * teachingDays(s.day, term); }, 0) : 0;
          part.rate = part.kind === "uygulama" ? 20 : 30;
          part.estimate = !group.graduate && part.termHours ? Math.floor(part.termHours * part.rate / 100) : null;
          part.limit = record.limits[part.kind] != null ? record.limits[part.kind] : part.estimate;
          part.limitSource = record.limits[part.kind] != null ? "user" : (part.estimate != null ? "estimate" : "none");
          part.maxSession = part.sessions.reduce(function (m, s) { return Math.max(m, sessionHours(s)); }, 0) || 1;
          part.left = part.limit == null ? null : part.limit - part.used;
          // Kaç oturum daha: en uzun oturum üzerinden, aşağı — tam oturum kaçırılır, kesir değil.
          part.canMiss = part.left == null || part.left < 0 ? null : Math.floor(part.left / part.maxSession);
          part.level = absenceLevel(part);
        });
        return parts;
      }

      function absenceGroups() {
        var term = teachingTerm();
        var map = {};
        var order = [];
        selectedCourses().forEach(function (course) {
          var key = absenceKey(course);
          if (!map[key]) {
            map[key] = { key: key, name: course.name, code: course.code || "", graduate: !!course.stage, sessions: [] };
            order.push(key);
          }
          map[key].sessions.push(course);
        });
        var rank = { over: 0, near: 1, ok: 2, none: 3 };
        return order.map(function (key) {
          var group = map[key];
          group.sessions.sort(function (a, b) {
            return ["Pzt", "Sal", "Çar", "Per", "Cum"].indexOf(a.day) - ["Pzt", "Sal", "Çar", "Per", "Cum"].indexOf(b.day) || String(a.start).localeCompare(String(b.start));
          });
          var record = absenceRecord(key, false);
          group.record = record;
          group.parts = absenceParts(group, record, term);
          group.used = group.parts.reduce(function (sum, p) { return sum + p.used; }, 0);
          group.hasRecords = record.entries.length > 0 || group.parts.some(function (p) { return p.snapshot; });
          group.level = group.parts.reduce(function (worst, p) { return rank[p.level] < rank[worst] ? p.level : worst; }, "none");
          return group;
        });
      }

      function groupOf(course) {
        var key = absenceKey(course);
        return absenceGroups().find(function (g) { return g.key === key; }) || null;
      }

      /*
       * Yönetmelik "%30'undan fazlasına katılmayan devamsız sayılır" diyor:
       * sınıra EŞİT devamsızlık hâlâ izinlidir, AŞAN devamsızdır.
       * "near": bir sonraki kaçırılan oturum sınırı aşar.
       */
      function absenceLevel(part) {
        if (part.limit == null) return "none";
        if (part.used > part.limit) return "over";
        if (part.limit - part.used < part.maxSession) return "near";
        return "ok";
      }

      function kindLabel(kind) { return kind === "uygulama" ? "Uygulama" : "Teorik"; }

      function partCopy(part) {
        if (part.limit == null) return "Kayıtlarına göre " + part.used + " ders saati · sınırı izlencenden gir";
        if (part.left < 0) return "Kayıtlarına göre sınırı " + (-part.left) + " saat aşmış olabilirsin";
        if (part.canMiss === 0) return part.left === 0 ? "Sınırdasın · bir ders daha kaçırırsan sınırı aşarsın" : part.left + " saat kaldı · bir ders daha sınırı aşar";
        return part.canMiss + " ders daha kaçırabilirsin · " + part.left + " saat kaldı";
      }

      function absenceCopy(group) {
        if (group.parts.length === 1) return partCopy(group.parts[0]);
        var worst = group.parts.slice().sort(function (a, b) { return ({ over: 0, near: 1, ok: 2, none: 3 })[a.level] - ({ over: 0, near: 1, ok: 2, none: 3 })[b.level]; })[0];
        return kindLabel(worst.kind) + ": " + partCopy(worst);
      }

      function addAbsence(key, sessionId, iso) {
        var group = absenceGroups().find(function (g) { return g.key === key; });
        if (!group) return "Ders bulunamadı.";
        var session = group.sessions.find(function (s) { return s.id === sessionId; });
        if (!session) return "Oturum bulunamadı.";
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return "Tarih seç.";
        if (iso > turkeyDateIso()) return "Gelecek bir tarihe devamsızlık yazılamaz.";
        var term = teachingTerm();
        if (term && (iso < term.start || iso > term.end)) return "Bu tarih güz yarıyılı öğretim aralığının dışında.";
        if (isoWeekday(iso) !== session.day) return "Seçtiğin tarih " + dayLong(isoWeekday(iso) || "") + "; bu oturum " + dayLong(session.day) + " günü.";
        var record = absenceRecord(key, true);
        if (record.entries.some(function (e) { return e.sessionId === sessionId && e.date === iso; })) return "Bu oturum bu tarihte zaten işli.";
        record.entries.push({ id: "a" + Date.now().toString(36) + Math.floor(Math.random() * 1e4), date: iso, sessionId: sessionId, hours: sessionHours(session) || 1 });
        record.entries.sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });
        return "";
      }

      function setAbsenceSnapshot(key, kind, hoursRaw, iso) {
        if (kind !== "teorik" && kind !== "uygulama") return "Tür seç.";
        var hours = Number(String(hoursRaw).trim());
        if (String(hoursRaw).trim() === "" || !Number.isInteger(hours) || hours < 0 || hours > 200) return "Ders saatini tam sayı olarak yaz (0–200).";
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return "Tarih seç.";
        if (iso > turkeyDateIso()) return "Gelecek bir tarih seçilemez.";
        absenceRecord(key, true).snapshots[kind] = { hours: hours, asOf: iso };
        return "";
      }

      function weekMonday(iso) {
        var dow = new Date(iso + "T12:00:00Z").getUTCDay();
        return addDaysIso(iso, dow === 0 ? -6 : 1 - dow);
      }

      function removeAbsence(key, entryId) {
        var record = absenceRecord(key, false);
        record.entries = record.entries.filter(function (e) { return e.id !== entryId; });
      }

      // Bir oturumun bugüne kadarki en son gerçekleştiği tarih (form varsayılanı).
      function lastOccurrence(day) {
        var iso = turkeyDateIso();
        for (var i = 0; i < 7; i += 1) {
          if (isoWeekday(iso) === day) return iso;
          iso = addDaysIso(iso, -1);
        }
        return turkeyDateIso();
      }

      /*
       * Eski sürümün sayaçlarını (oturum başına "girmediğim hafta" ve "hak")
       * yeni kayda taşır: her hafta, o oturumun saati kadar TARİHSİZ bir kayıt
       * olur; hak, saat cinsinden öğrenci sınırı olur. Bir kez çalışır.
       */
      function migrateAttendance() {
        var old = state.attendance;
        if (!old || !Object.keys(old).length) return;
        var pool = courses.concat(customCourses());
        Object.keys(old).forEach(function (id) {
          var course = pool.find(function (c) { return c.id === id; });
          if (!course) return;
          var hours = sessionHours(course) || 1;
          var record = absenceRecord(absenceKey(course), true);
          for (var i = 0; i < (old[id].absent || 0); i += 1) {
            record.entries.push({ id: "m" + id + i, date: null, sessionId: id, hours: hours, legacy: true });
          }
          if (old[id].allowance && record.limit == null) record.limit = old[id].allowance * hours;
        });
        state.attendance = {};
        persist();
      }

      function absenceDateLabel(entry) {
        return entry.date ? diningDateLabel(entry.date) + " " + dayLong(isoWeekday(entry.date)) : "Tarihsiz (eski sürümden)";
      }

      function absenceProgress(part) {
        if (part.limit == null || !part.limit) return "";
        var pct = Math.min(100, Math.round(part.used / part.limit * 100));
        return '<div class="absence-bar ' + part.level + '" role="img" aria-label="' + part.used + ' / ' + part.limit + ' ders saati"><span style="width:' + pct + '%"></span></div>';
      }

      function absenceLimitCopy(group, part) {
        if (part.limitSource === "user") {
          return 'Sınır: <strong>' + part.limit + ' ders saati</strong> · senin girdiğin (izlence)'
            + (part.estimate != null && team() ? ' · yönetmelikten tahmin ' + part.estimate : '');
        }
        if (part.limitSource === "estimate" && !team()) {
          return 'Tahmini sınır: <strong>' + part.estimate + ' ders saati</strong>';
        }
        if (part.limitSource === "estimate") {
          return 'Sınır: <strong>' + part.estimate + ' ders saati · tahmini</strong> — dönemde ' + part.termHours
            + ' saat, %' + part.rate + ' (' + kindLabel(part.kind).toLocaleLowerCase("tr-TR") + ', ' + REGULATION_ARTICLE + ').';
        }
        return group.graduate
          ? (team() ? 'Lisansüstü yönetmeliği devam oranı yazmıyor; sınır tahmin edilmedi. İzlencedeki sınırı gir.' : 'Devamsızlık sınırını izlencenden girebilirsin.')
          : (team() ? 'Dönem aralığı ya da ders saati bilinmediği için sınır tahmin edilemedi. İzlencedeki sınırı gir.' : 'Devamsızlık sınırını izlencenden girebilirsin.');
      }

      function absencePartBlock(group, part, full) {
        var keyAttr = escapeHtml(group.key);
        var multi = group.parts.length > 1;
        var snap = part.snapshot;
        return '<div class="absence-part">'
          + (multi ? '<p class="absence-part-title">' + kindLabel(part.kind) + ' · %' + part.rate + '</p>' : '')
          + (multi || full ? '<p class="absence-part-copy ' + part.level + '">' + escapeHtml(partCopy(part)) + '</p>' : '')
          + absenceProgress(part)
          + (snap ? '<p class="absence-snap">Otomasyondan girdiğin: <strong>' + snap.hours + ' saat</strong> · ' + escapeHtml(diningDateLabel(snap.asOf)) + ' itibarıyla. Sonraki kayıtların üstüne eklenir.'
              + (full ? ' <button class="text-button" data-absence-snap-del="' + keyAttr + '::' + part.kind + '">Kaldır</button>' : '') + '</p>' : '')
          + (full ? '<p class="absence-limit">' + absenceLimitCopy(group, part) + '</p>'
              + '<label class="absence-limit-input"><span>' + (multi ? kindLabel(part.kind) + ' · i' : 'İ') + 'zlencedeki sınır (saat)</span><input class="search-input" type="number" inputmode="numeric" min="0" max="200" data-absence-limit="' + keyAttr + '::' + part.kind + '" value="' + (group.record.limits[part.kind] != null ? group.record.limits[part.kind] : "") + '" placeholder="' + (part.estimate != null ? "Boşsa tahmin: " + part.estimate : "Örn. 12") + '"></label>' : '')
          + '</div>';
      }

      function absenceCard(group, index, full) {
        var today = turkeyDateIso();
        var todayDay = isoWeekday(today);
        var keyAttr = escapeHtml(group.key);
        var todaySessions = group.sessions.filter(function (s) { return s.day === todayDay && sessionHours(s); });
        var included = {};
        group.parts.forEach(function (p) { Object.keys(p.included).forEach(function (id) { included[id] = true; }); });
        var html = '<div class="attendance-card ' + group.level + '" data-absence-card="' + index + '">'
          + '<p class="attendance-status" style="margin-bottom:2px">' + (full ? escapeHtml(group.name) : escapeHtml(absenceCopy(group))) + '</p>'
          + (full && group.code ? '<p class="stepper-label" style="margin:0 0 6px">' + escapeHtml(group.code) + '</p>' : '')
          + group.parts.map(function (part) { return absencePartBlock(group, part, full); }).join("")
          + (!group.hasRecords ? '<p class="absence-empty">Henüz kayıt yok. Kaçırdığın dersleri işledikçe ya da otomasyondaki değeri girdiğinde hesap güncellenir; işlenmeyen ders katılmış sayılmaz.</p>' : '')
          + '<ul class="absence-sessions">' + group.sessions.map(function (s) {
              var kind = sessionKind(group.record, s);
              return '<li><span>' + escapeHtml(s.day || "Gün yok") + ' ' + escapeHtml(s.start || "") + (s.end ? '–' + escapeHtml(s.end) : '') + ' · ' + (sessionHours(s) ? sessionHours(s) + ' ders saati' : 'saat yok') + '</span>'
                + (full && !group.graduate ? '<button class="chip' + (kind === "uygulama" ? ' active' : '') + '" data-absence-skind="' + keyAttr + '::' + escapeHtml(s.id) + '" aria-label="Oturum türü: ' + kindLabel(kind) + '. Değiştirmek için dokun.">' + kindLabel(kind) + '</button>' : '')
                + '</li>';
            }).join('') + '</ul>'
          + todaySessions.map(function (s) {
              var done = group.record.entries.some(function (e) { return e.sessionId === s.id && e.date === today; });
              return done
                ? '<p class="absence-done">' + icon("check") + 'Bugünkü ' + escapeHtml(s.start) + ' dersi işlendi (' + sessionHours(s) + ' ders saati)</p>'
                : '<button class="secondary-button absence-today" data-absence-add="' + keyAttr + '::' + s.id + '::' + today + '">Bugünkü ' + escapeHtml(s.start) + ' dersine girmedim · ' + sessionHours(s) + ' ders saati</button>';
            }).join("")
          + '<details class="absence-more"><summary>Kaçırdığın geçmiş bir dersi ekle</summary>'
          + '<div class="absence-form">'
          + (group.sessions.length > 1
              ? '<select class="select" data-absence-session aria-label="Oturum">' + group.sessions.map(function (s) {
                  return '<option value="' + s.id + '">' + escapeHtml(dayLong(s.day)) + ' ' + escapeHtml(s.start || "") + '</option>';
                }).join("") + '</select>'
              : '<input type="hidden" data-absence-session value="' + group.sessions[0].id + '">')
          + '<input class="search-input" type="date" data-absence-date aria-label="Tarih" max="' + today + '" value="' + lastOccurrence(group.sessions[0].day) + '">'
          + '<button class="primary-button" data-absence-past="' + keyAttr + '">Ekle</button>'
          + '</div></details>'
          + (full ? '<details class="absence-more"><summary>Otomasyondaki devamsızlığını gir</summary>'
              + '<div class="absence-form">'
              + '<p class="stepper-label" style="margin:0">Öğrenci bilgi sisteminde bu ders için görünen toplam devamsızlığı yaz. Bu tarihten önceki kayıtların bu değere dahil sayılır, iki kez sayılmaz.</p>'
              + (group.parts.length > 1 ? '<select class="select" data-absence-snap-kind aria-label="Tür">' + group.parts.map(function (p) { return '<option value="' + p.kind + '">' + kindLabel(p.kind) + '</option>'; }).join("") + '</select>' : '<input type="hidden" data-absence-snap-kind value="' + group.parts[0].kind + '">')
              + '<input class="search-input" type="number" inputmode="numeric" min="0" max="200" data-absence-snap-hours aria-label="Ders saati" placeholder="Ders saati, örn. 6">'
              + '<input class="search-input" type="date" data-absence-snap-date aria-label="Hangi tarih itibarıyla" max="' + today + '" value="' + today + '">'
              + '<button class="primary-button" data-absence-snap="' + keyAttr + '">Kaydet</button>'
              + '</div></details>' : '')
          + (group.record.entries.length
              ? '<ul class="absence-log">' + group.record.entries.map(function (e) {
                  var s = group.sessions.find(function (x) { return x.id === e.sessionId; });
                  return '<li' + (included[e.id] ? ' class="included"' : '') + '><span>' + absenceDateLabel(e) + (s ? ' · ' + escapeHtml(s.start || "") : '') + ' · ' + e.hours + ' saat' + (included[e.id] ? ' · otomasyon değerine dahil' : '') + '</span>'
                    + '<button class="text-button" data-absence-undo="' + keyAttr + '::' + e.id + '" aria-label="Bu kaydı sil">Geri al</button></li>';
                }).join("") + '</ul>'
              : '')
          + (!full && group.parts.length === 1 ? '<p class="absence-limit">' + absenceLimitCopy(group, group.parts[0]) + '</p>' : '')
          + '</div>';
        return html;
      }

      function attendanceCard(course) {
        var group = groupOf(course);
        if (!group) return "";
        return '<section class="section"><div class="section-heading"><h2>Devamsızlık</h2><button class="text-button" data-route="attendance">Tüm derslerim</button></div>'
          + absenceCard(group, 0, false)
          + absenceRuleNote()
          + '</section>';
      }

      function absenceRuleNote() {
        if (!team()) {
          return '<p class="attendance-note">' + icon("info") + '<span>Kayıtlar yalnız bu cihazda tutulur. Yönetmeliğe göre teorik derslerin %30’undan, uygulamaların %20’sinden fazlasına katılmayan genel sınava giremez; sınır tahminidir, izlencendeki sınır geçerlidir.</span></p>';
        }
        return '<p class="attendance-note">' + icon("info") + '<span>Kayıtlar yalnız bu cihazda, senin girdiğin kadardır; resmî yoklama değildir. '
          + 'Yönetmelik: teorik derslerin %30’undan, uygulamaların %20’sinden fazlasına katılmayan devamsız sayılır ve genel sınava giremez (NA). '
          + 'Sağlık raporları devam süresinin hesabında dikkate alınmaz. Hesap birimi ve yuvarlama belgede yazmadığı için sınır tahminidir; izlencendeki sınır geçerlidir.</span></p>';
      }

      function icon(name) {
        var safeName = /^[a-z0-9-]+$/.test(String(name || "")) ? String(name) : "info";
        return '<svg class="icon" aria-hidden="true"><use href="#i-' + safeName + '"></use></svg>';
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char];
        });
      }

      function toMinutes(time) {
        var parts = time.split(":").map(Number);
        return parts[0] * 60 + parts[1];
      }

      function currentDepartment() {
        return departments[state.department] || departments.kimya || departments[Object.keys(departments)[0]];
      }

      function currentFaculty() {
        var department = currentDepartment();
        return faculties.find(function (faculty) { return faculty.id === department.facultyId; }) || faculties[0];
      }

      // İkinci program (çift ana dal / yan dal). Ana programla aynı olamaz. Hangi dersin
      // ikinci programa sayılacağı ve ortalamaya katılımı ÇAP / yan dal yönergesine ve bölüm
      // kararına bağlıdır; uygulama bunu hesaplamaz, yalnız iki programın derslerini birlikte
      // gösterir ve aralarındaki çakışmayı bulur.
      function secondDepartment() {
        var s = state.second;
        if (!s || !s.department || s.department === state.department) return null;
        return departments[s.department] || null;
      }

      function secondKindLabel() {
        return state.second && state.second.kind === "yandal" ? "Yan dal" : "Çift ana dal";
      }

      function picking() {
        return state.pickProgram === "second" && secondDepartment() ? "second" : "main";
      }

      function pickDepartment() {
        return picking() === "second" ? secondDepartment() : currentDepartment();
      }

      function pickGrade() {
        return picking() === "second" ? state.second.grade : state.grade;
      }

      function isSecondCourse(course) {
        var second = secondDepartment();
        return !!second && course.departmentId === second.id;
      }

      function programTag(course) {
        return isSecondCourse(course) ? '<span class="own-chip">' + escapeHtml(secondKindLabel()) + '</span>' : "";
      }

      function facultyShortName() {
        return currentFaculty().shortName || currentFaculty().name;
      }

      function gradeOptions(department) {
        if (department.stageLabels && department.stageLabels.length) {
          return department.stageLabels.map(function (label, index) {
            return { id: String(index + 1), name: label };
          });
        }
        if (department.gradeLabel) return [{ id: "1", name: department.gradeLabel }];
        var options = [];
        for (var grade = 1; grade <= department.years; grade += 1) {
          options.push({ id: String(grade), name: department.id === medData.program ? "Dönem " + grade : grade + ". sınıf" });
        }
        return options;
      }

      function gradeLabelFor(department, grade) {
        if (department.stageLabels && department.stageLabels.length) return department.stageLabels[grade - 1] || department.stageLabels[0];
        if (department.id === medData.program) return "Dönem " + grade;
        return department.gradeLabel || grade + ". sınıf";
      }

      function selectedGradeLabel() {
        return gradeLabelFor(currentDepartment(), state.grade);
      }

      function pickGradeLabel() {
        return gradeLabelFor(pickDepartment(), pickGrade());
      }

      function gradeFieldLabel(department) {
        if (department.id === medData.program) return "Dönem";
        return department.stageLabels && department.stageLabels.length ? "Program aşaması" : "Sınıf";
      }

      function allGradesLabel() {
        return pickDepartment().stageLabels && pickDepartment().stageLabels.length ? "Tüm aşamalar" : "Tüm sınıflar";
      }

      function hasImportedRows() {
        return departmentCourses().length > 0;
      }

      function pickHasRows() {
        return coursesFor(pickDepartment()).length > 0;
      }

      function safeOfficialUrl(value) {
        var fallback = "https://www.ohu.edu.tr/";
        try {
          var fallbackCandidate = new URL(catalog.directoryUrl || fallback);
          if (fallbackCandidate.protocol === "https:" && !fallbackCandidate.username && !fallbackCandidate.password && !fallbackCandidate.port
              && ["www.ohu.edu.tr", "ohu.edu.tr", "static.ohu.edu.tr"].indexOf(fallbackCandidate.hostname) !== -1) {
            fallback = fallbackCandidate.href;
          }
        } catch (error) {}
        try {
          var url = new URL(value || fallback);
          if (url.protocol === "https:" && !url.username && !url.password && !url.port
              && ["www.ohu.edu.tr", "ohu.edu.tr", "static.ohu.edu.tr"].indexOf(url.hostname) !== -1) return url.href;
        } catch (error) {}
        return fallback;
      }

      function statusCopy(department) {
        var item = department || currentDepartment();
        if (item.status === "no_students") return "Resmî kaynağa göre bu programa henüz öğrenci alınmadı · ders programı yok";
        if (!team()) return item.status === "candidate_rows"
          ? "Ders saatleri bölümünün resmî ders programından"
          : "Bu bölümün ders programı henüz eklenmedi";
        if (item.status === "candidate_rows") return "Aday ders satırları · ikinci kontrol bekliyor";
        if (item.status === "catalog_verified") return "Resmî AKTS program kaydı doğrulandı · ders çizelgesi aktarılmadı";
        if (item.status === "source_indexed") return "Resmî program kaynağı bulundu · aktarım bekliyor";
        if (item.status === "source_indexed_partial") return "Resmî program dizini kısmen bulundu · aktarım bekliyor";
        return "Program kataloglandı · güncel ders programı kaynağı aranıyor";
      }

      // Öğrencinin kendi eklediği dersler. Seçmeliler bölümden bölüme değişiyor
      // ve katalogda olmayan ders olabiliyor; öğrenci kendi dersini ekleyebilir.
      // Bu kayıtlar resmî aday kayıtlarla karışmaz: verification "user_entered"
      // ve kaynak rozeti gösterilmez.
      var SHORT_DAY_LABEL = { Pzt: "Pazartesi", Sal: "Salı", Çar: "Çarşamba", Per: "Perşembe", Cum: "Cuma" };

      function customCourses() {
        var second = secondDepartment();
        return customCoursesFor(currentDepartment()).concat(second ? customCoursesFor(second) : []);
      }

      function customCoursesFor(department) {
        var faculty = faculties.find(function (item) { return item.id === department.facultyId; }) || currentFaculty();
        return (state.customCourses || [])
          .filter(function (item) { return item.departmentId === department.id; })
          .map(function (item) {
            return {
              id: item.id,
              departmentId: item.departmentId,
              code: "",
              name: item.name,
              day: item.day || "",
              dayLong: item.day ? SHORT_DAY_LABEL[item.day] : "",
              start: item.start || "",
              end: item.end || "",
              location: item.room || "Belirtilmedi",
              grade: item.grade || state.grade,
              elective: true,
              branch: "",
              departmentName: department.name,
              facultyName: faculty.name,
              sourceId: "",
              sourcePage: "",
              codeSourceId: "",
              status: "student_entry",
              verifiedAt: null,
              recordNotes: "",
              kind: "ders",
              delivery: "",
              userEntered: true,
              scheduled: Boolean(item.day && item.start && item.end)
            };
          });
      }

      function coursesFor(department) {
        return courses.filter(function (course) {
          return course.departmentId === department.id;
        }).concat(customCoursesFor(department));
      }

      function departmentCourses() {
        return coursesFor(currentDepartment());
      }

      // Öğrencinin programına girebilecek bütün dersler: ana program + ikinci program.
      function myCoursePool() {
        var second = secondDepartment();
        return departmentCourses().concat(second ? coursesFor(second) : []);
      }

      function dayLong(day) {
        return { Pzt: "Pazartesi", Sal: "Salı", Çar: "Çarşamba", Per: "Perşembe", Cum: "Cuma" }[day] || day;
      }

      /*
       * Lisans kaydı "2. sınıf", lisansüstü kaydı "Ders dönemi" der. İkisini
       * tek yerden üretmezsek lisansüstü kayıtta ekranda "null. sınıf" yazar —
       * ilk denemede tam olarak bu oldu.
       */
      /*
       * Enstitü kaynağında derslik sütunu yok. Boş dersliği ayraçla yazarsak
       * ekranda "08:00–08:45 · " diye sarkan bir nokta kalır; kaynağın
       * suskunluğu bir arayüz artığına dönüşmemeli.
       */
      /*
       * Öğretim elemanı (2026-10-20, kullanıcı kararı: görünsün). Değer resmî
       * belgede nasıl yazıyorsa öyle gösterilir; tamamlanmaz, düzeltilmez.
       * Yalnız kısaltma kodu ("YG") ad gibi sunulmaz. Kişi hakkında yorum,
       * puan ya da kişiye göre arama yoktur (legal-safety-contract.md §3).
       */
      function instructorCopy(value) {
        var v = String(value || "").trim();
        if (!v || v === "Kaynakta belirtilmemiş") return "Belgede yazmıyor";
        // Kaldırma talebi (legal-safety-contract.md §5): yayın paketi adı bu işaretle değiştirir.
        if (v === REMOVED_NAME) return "Öğretim elemanı gösterilmiyor";
        if (v.indexOf(REMOVED_NAME) !== -1) return v.split(REMOVED_NAME).join("(gösterilmiyor)");
        if (/^[A-ZÇĞİÖŞÜ]{2,4}([ \/,-]+[A-ZÇĞİÖŞÜ]{2,4})*$/.test(v) || /^[\d ,\/()-]+$/.test(v)) return "Belgede kodla yazılmış: " + v;
        return v;
      }

      function placeCopy(course) {
        return course.location ? " · " + escapeHtml(course.location) : (team() ? " · Derslik kaynakta yazmıyor" : "");
      }

      function gradeCopy(course) {
        if (course.stage) return escapeHtml(course.stage);
        return course.grade ? escapeHtml(String(course.grade)) + ". sınıf" : "Sınıfı belirtilmemiş";
      }

      function branchCopy(course) {
        return course.branch ? " · " + escapeHtml(course.branch) + " şubesi" : "";
      }

      function courseCodeCopy(course) {
        return course.code ? escapeHtml(course.code) + " · " : "";
      }

      function selectedCourses() {
        return myCoursePool().filter(function (course) { return state.selected.indexOf(course.id) !== -1; });
      }

      function sameText(x, y) {
        return String(x || "").toLocaleLowerCase("tr-TR").replace(/\s+/g, " ").trim()
          === String(y || "").toLocaleLowerCase("tr-TR").replace(/\s+/g, " ").trim();
      }

      function conflictTitle(conflict) {
        return conflict.shared ? "Ortak ders olabilir" : "1 ders çakışması bulundu";
      }

      function conflicts() {
        var selected = selectedCourses().filter(function (course) {
          return course.start && course.end && course.day;
        });
        var result = [];
        for (var i = 0; i < selected.length; i += 1) {
          for (var j = i + 1; j < selected.length; j += 1) {
            var a = selected[i];
            var b = selected[j];
            if (a.day === b.day && toMinutes(a.start) < toMinutes(b.end) && toMinutes(a.end) > toMinutes(b.start)) {
              result.push({
                a: a,
                b: b,
                start: toMinutes(a.start) > toMinutes(b.start) ? a.start : b.start,
                end: toMinutes(a.end) < toMinutes(b.end) ? a.end : b.end,
                // İki programın aynı adlı dersi aynı saat ve derslikteyse ortak ders olabilir
                // (ör. İİBF'de İşletme ve İktisat'ın İstatistik'i, AMFİ 4). Kesin değildir;
                // uygulama karar vermez, uyarıyı yumuşatır.
                shared: a.departmentId !== b.departmentId && sameText(a.name, b.name)
                  && sameText(a.location, b.location) && a.start === b.start && a.end === b.end
              });
            }
          }
        }
        // Gerçek çakışma, "ortak ders olabilir" uyarısından önce gelir; ekranlar ilk kaydı
        // gösterdiği için aksi hâlde aynı gündeki gerçek çakışma görünmez kalıyordu.
        return result.sort(function (x, y) { return (x.shared ? 1 : 0) - (y.shared ? 1 : 0); });
      }

      function route(next, previous) {
        state.previousRoute = previous || state.route;
        state.route = next;
        persist();
        render();
      }

      function nav(active) {
        var items = [
          ["today", "home", "Bugün"],
          ["program", "calendar", "Program"],
          ["agenda", "agenda", "Gündem"],
          ["more", "more", "Diğer"]
        ];
        return '<nav class="bottom-nav" aria-label="Ana gezinme">' + items.map(function (item) {
          return '<button class="nav-button ' + (active === item[0] ? "active" : "") + '" data-route="' + item[0] + '"' + (active === item[0] ? ' aria-current="page"' : "") + '><span class="nav-icon-wrap">' + icon(item[1]) + '</span><span>' + item[2] + '</span></button>';
        }).join("") + '</nav>';
      }

      function layout(content, active, noNav) {
        return '<div class="screen-layout"><div class="screen-scroll ' + (noNav ? "no-nav" : "") + '">' + content + '</div>' + (noNav ? "" : nav(active)) + '</div>';
      }

      function stateBanner() {
        if (typeof navigator !== "undefined" && navigator.onLine === false) {
          return '<div class="state-banner">' + icon("cloud") + '<span><strong>Çevrimdışısın.</strong> Bilgiler bu cihazda en son açıldığı andaki hâliyle gösteriliyor; o andan sonraki değişiklikler görünmez.</span></div>';
        }
        if (state.dataMode === "offline") {
          return '<div class="state-banner">' + icon("cloud") + '<span><strong>Çevrimdışısın.</strong> Son kaydedilen örnek program gösteriliyor; güncel olduğu iddia edilmiyor.</span></div>';
        }
        if (state.dataMode === "stale") {
          return '<div class="state-banner">' + icon("alert") + '<span><strong>Programın yeniden kontrol edilmeli.</strong> Son kontrol 7 gün önce yapıldı.</span></div>';
        }
        return "";
      }

      function sourceStatus() {
        if (state.dataMode === "offline") return "Çevrimdışı · son kayıt";
        if (state.dataMode === "stale") return "7 gün önce kontrol edildi";
        if (currentDepartment().status === "no_students") return "Henüz öğrenci alınmadı · resmî kaynak";
        if (!team()) return currentDepartment().status === "candidate_rows" ? "Bölümünün resmî ders programından" : "Ders programı henüz eklenmedi";
        if (currentDepartment().status === "candidate_rows") return "Aday ders verisi · kontrol bekliyor";
        if (currentDepartment().status === "catalog_verified") return "AKTS program kaydı doğrulandı · dersler bekliyor";
        if (currentDepartment().status === "source_indexed") return "Resmî kaynak bulundu · aktarım bekliyor";
        if (currentDepartment().status === "source_indexed_partial") return "Kısmi kaynak dizini · kontrol bekliyor";
        return "Program kataloglandı · kaynak aranıyor";
      }

      function renderOnboardingOne() {
        var departmentOptions = Object.keys(departments).map(function (key) { return departments[key]; }).filter(function (department) { return department.facultyId === state.faculty; });
        var department = currentDepartment();
        var html = ''
          + '<div class="screen-header"><span class="brand">ÜniKapsül</span></div>'
          + '<div class="progress"><div class="progress-track"><div class="progress-fill" style="width:50%"></div></div><span>1 / 2</span></div>'
          + '<div class="onboarding-copy"><h1>Programını kendine göre hazırla</h1><p>Kayıt olmadan akademik birimini, programını ve sınıf ya da program aşamanı seç. Seçimlerini daha sonra değiştirebilirsin.</p></div>'
          + '<div class="local-note">' + icon("shield") + '<span>' + escapeHtml(INDEPENDENCE_NOTE) + '</span></div>'
          + '<div class="form-card">'
          + fieldStatic("Üniversite", "Niğde Ömer Halisdemir Üniversitesi")
          + fieldSelect("Akademik birim", "faculty-select", faculties, setupDone("faculty") ? state.faculty : null, "Akademik birimini seç")
          + fieldSelect("Program / Bölüm", "department-select", setupDone("faculty") ? departmentOptions : [], setupDone("department") ? state.department : null, setupDone("faculty") ? "Bölümünü seç" : "Önce akademik birimi seç")
          + fieldSelect(gradeFieldLabel(department), "grade-select", setupDone("department") ? gradeOptions(department) : [], setupDone("grade") ? String(state.grade) : null, setupDone("department") ? "Seç" : "Önce bölümünü seç")
          + fieldStatic("Dönem", "2026–2027 Güz")
          + '</div>'
          + '<button class="primary-button" style="width:100%;margin-top:16px" data-action="onboarding-next"' + (setupDone("grade") ? '' : ' disabled aria-disabled="true"') + '>Derslerimi seç ' + icon("chevron") + '</button>'
          + (setupDone("grade") ? '' : '<p class="legal-note">Devam etmek için birimini, bölümünü ve sınıfını seç.</p>')
          + '<p class="legal-note">' + (team() ? catalog.summary.unitCount + ' akademik birim ve ' + catalog.summary.programCount + ' öğrenci programı seçeneği kataloglandı · Lisansüstü seçenekler program aşamasıyla çalışır.<br>' : '') + 'Resmî uygulama değildir; OBS bilgisi veya hesap gerekmez.</p>';
        screen.innerHTML = layout(html, "", true);
      }

      function fieldStatic(label, value) {
        return '<div class="field"><label>' + escapeHtml(label) + '</label><div class="field-static">' + escapeHtml(value) + '</div></div>';
      }

      // Kurulumda seçilmemiş alan; kurulum bittiyse (ya da öğrenci seçtiyse) gerçek değer gösterilir.
      function setupDone(key) {
        return state.onboarded || !!(state.setup && state.setup[key]);
      }

      function fieldSelect(label, id, options, value, placeholder) {
        var safeId = escapeHtml(id);
        var empty = value === null || value === undefined;
        return '<div class="field"><label for="' + safeId + '">' + escapeHtml(label) + '</label><div class="select-wrap"><select class="select" id="' + safeId + '"' + (placeholder && !options.length ? ' disabled' : '') + '>'
          + (placeholder && empty ? '<option value="" selected disabled>' + escapeHtml(placeholder) + '</option>' : '')
          + options.map(function (option) { return '<option value="' + escapeHtml(option.id) + '"' + (String(option.id) === String(value) ? " selected" : "") + '>' + escapeHtml(option.name) + '</option>'; }).join("")
          + '</select>' + icon("chevron") + '</div></div>';
      }

      /*
       * Ders seçimi oturum başınadır (aynı dersin farklı oturumu farklı şube olabilir:
       * 50 derste oturumların öğretim elemanı farklı). Ama haftada birden çok oturumu
       * olan ders tek başlık altında görünür; öğretim elemanı aynıysa diğer oturumları
       * tek dokunuşla eklemek önerilir, farklıysa yalnız uyarı yazılır.
       */
      /*
       * Danışmanım (2026-10-23). Lisansüstü belgelerde Özel Konular ve Danışmanlık her
       * danışmanın kendi saatidir (Afet Yönetimi: 13 danışman, 29 blok); öğrenci yalnız
       * kendi danışmanınınkini alır. Öğrenci danışmanını belgedeki adlardan bir kez seçer,
       * yalnız onun saatleri gösterilir; diğerleri silinmez, kapalı bir bölümde durur.
       * Danışman tahmin edilmez; ad yalnız öğrencinin kendi programının belgesinden ve
       * belgede yazdığı biçimde gelir. Kişiye göre arama ya da listeleme değildir
       * (legal-safety-contract.md §3): seçim yalnız bu cihazda, yalnız ders listesini süzer.
       */
      // Coğrafya YL (2026-10-23): "Ders Danışmanlığı" ve "Tez Çalışması" da danışman başına blok.
      // Uzmanlık Alan Dersi: doktorada Özel Konular'ın karşılığı, danışman başına açılır (EBE doktora belgeleri).
      var ADVISOR_COURSES = ["ÖZEL KONULAR", "DANIŞMANLIK", "DERS DANIŞMANLIĞI", "TEZ ÇALIŞMASI", "TEZ DANIŞMANLIĞI", "ÖĞRENCİ DANIŞMANLIĞI", "UZMANLIK ALAN DERSİ", "UZMANLIK ALANI"];

      function isAdvisorCourse(course) {
        // "YL Ders Danışmanlığı", "Özel Konular I" (Müzikoloji YL): önek ve sondaki Roma rakamı yok sayılır.
        var name = String(course.name || "").toLocaleUpperCase("tr-TR").replace(/\s+/g, " ").trim()
          .replace(/^YL\s+/, "").replace(/(?:\s+|-)(?:[IVX]+|\d)$/, "");
        return ADVISOR_COURSES.indexOf(name) !== -1;
      }

      function advisorNames(course) {
        return String(course.instructor || "").split(/\s*\/\s*/).map(function (n) { return n.trim(); })
          .filter(function (n) { return n && n !== REMOVED_NAME && n !== "Kaynakta belirtilmemiş"; });
      }

      function advisorOf(departmentId) {
        return (state.advisors || {})[departmentId] || "";
      }

      function advisorChoices(departmentId) {
        var seen = Object.create(null);
        var out = [];
        coursesFor(departments[departmentId]).filter(isAdvisorCourse).forEach(function (course) {
          advisorNames(course).forEach(function (name) { if (!seen[name]) { seen[name] = true; out.push(name); } });
        });
        return out.sort(function (a, b) { return a.localeCompare(b, "tr"); });
      }

      function isMyAdvisorSession(course) {
        var mine = advisorOf(course.departmentId);
        return !!mine && advisorNames(course).indexOf(mine) !== -1;
      }

      function advisorPicker(departmentId) {
        var names = advisorChoices(departmentId);
        if (!names.length) return "";
        var mine = advisorOf(departmentId);
        return '<div class="advisor-card"><label for="advisor-select">Danışmanım</label>'
          + '<div class="select-wrap"><select class="select" id="advisor-select" data-advisor-dept="' + escapeHtml(departmentId) + '">'
          + '<option value=""' + (mine ? '' : ' selected') + '>' + (mine ? 'Danışmanımı kaldır' : 'Danışmanını seç') + '</option>'
          + names.map(function (n) { return '<option value="' + escapeHtml(n) + '"' + (n === mine ? ' selected' : '') + '>' + escapeHtml(n) + '</option>'; }).join("")
          + '</select>' + icon("chevron") + '</div>'
          + '<p class="group-note">' + icon("info") + '<span>' + (mine
              ? 'Özel Konular, danışmanlık ve tez çalışmasında yalnız danışmanının saatleri gösteriliyor. Adlar ders programı belgesinde yazdığı gibidir; seçimin yalnız bu cihazda kalır.'
              : 'Özel Konular, danışmanlık ve tez çalışması saatleri her danışmanın kendi saatidir. Danışmanını seçersen yalnız onun saatleri görünür.') + '</span></p></div>';
      }

      function sessionsOf(key) {
        return myCoursePool().filter(function (course) {
          if (absenceKey(course) !== key) return false;
          return !isAdvisorCourse(course) || !advisorOf(course.departmentId) || isMyAdvisorSession(course);
        });
      }

      function groupSuggestion(key) {
        var sessions = sessionsOf(key);
        if (sessions.length && isAdvisorCourse(sessions[0])) {
          var mineAll = sessions.filter(function (c) { return state.selected.indexOf(c.id) === -1; }).length;
          var anyPicked = sessions.some(function (c) { return state.selected.indexOf(c.id) !== -1; });
          if (!advisorOf(sessions[0].departmentId) || !anyPicked || !mineAll) return "";
          return '<button class="text-button group-add" data-group-add="' + escapeHtml(key) + '">' + icon("plus")
            + ' Danışmanının diğer ' + mineAll + ' saatini de ekle</button>';
        }
        var picked = sessions.filter(function (c) { return state.selected.indexOf(c.id) !== -1; });
        var missing = sessions.length - picked.length;
        if (!picked.length || !missing) return "";
        var sameTeacher = sessions.every(function (c) { return sameText(c.instructor, sessions[0].instructor); });
        if (sameTeacher) {
          return '<button class="text-button group-add" data-group-add="' + escapeHtml(key) + '">' + icon("plus")
            + ' Bu dersin diğer ' + missing + ' oturumunu da ekle</button>';
        }
        return '<p class="group-note">' + icon("info") + '<span>Oturumların öğretim elemanı farklı; ayrı şubeler olabilir. Yalnız kendi şubenin oturumlarını ekle.</span></p>';
      }

      function advisorGroup(key, items) {
        var first = items[0];
        var mine = advisorOf(first.departmentId);
        var head = '<p class="course-group-head">' + escapeHtml(first.name) + ' <span>· ' + (mine ? 'danışmanının saatleri' : items.length + ' saat · danışmanına göre') + '</span></p>';
        if (!mine) {
          return '<div class="course-group" role="group" aria-label="' + escapeHtml(first.name) + '">' + head
            + '<details class="advisor-others"' + (items.some(function (c) { return state.selected.indexOf(c.id) !== -1; }) ? ' open' : '') + '><summary>Bütün danışmanların saatlerini göster (' + items.length + ')</summary>'
            + '<div class="list-stack" style="margin-top:8px">' + items.map(courseOption).join("") + '</div></details></div>';
        }
        var own = items.filter(isMyAdvisorSession);
        var others = items.filter(function (c) { return !isMyAdvisorSession(c); });
        return '<div class="course-group" role="group" aria-label="' + escapeHtml(first.name) + '">' + head
          + (own.length ? own.map(courseOption).join("") : '<p class="group-note">' + icon("info") + '<span>Belgede bu derste danışmanının adına saat yazmıyor.</span></p>')
          + groupSuggestion(key)
          + (others.length ? '<details class="advisor-others"' + (others.some(function (c) { return state.selected.indexOf(c.id) !== -1; }) ? ' open' : '') + '><summary>Diğer danışmanların saatleri (' + others.length + ')</summary>'
              + '<div class="list-stack" style="margin-top:8px">' + others.map(courseOption).join("") + '</div></details>' : '')
          + '</div>';
      }

      function courseGroupList(list) {
        var picker = list.some(isAdvisorCourse) ? advisorPicker(list.filter(isAdvisorCourse)[0].departmentId) : "";
        return picker + courseGroupItems(list);
      }

      function courseGroupItems(list) {
        var order = [];
        var map = Object.create(null);
        list.forEach(function (course) {
          var key = absenceKey(course);
          if (!map[key]) { map[key] = []; order.push(key); }
          map[key].push(course);
        });
        return order.map(function (key) {
          var items = map[key].sort(function (a, b) {
            return STATE_DAYS.indexOf(a.day) - STATE_DAYS.indexOf(b.day) || String(a.start).localeCompare(String(b.start));
          });
          if (isAdvisorCourse(items[0])) return advisorGroup(key, items);
          if (items.length === 1) return courseOption(items[0]);
          return '<div class="course-group" role="group" aria-label="' + escapeHtml(items[0].name) + ', ' + items.length + ' oturum">'
            + '<p class="course-group-head">' + (items[0].code ? escapeHtml(items[0].code) + ' · ' : '') + escapeHtml(items[0].name)
            + ' <span>· haftada ' + items.length + ' oturum</span></p>'
            + items.map(courseOption).join("")
            + groupSuggestion(key)
            + '</div>';
        }).join("");
      }

      function courseOption(course) {
        var selected = state.selected.indexOf(course.id) !== -1;
        return '<button class="course-option ' + (selected ? "selected" : "") + '" data-course-toggle="' + escapeHtml(course.id) + '" aria-pressed="' + selected + '">'
          + '<span class="icon-tile">' + icon((departments[course.departmentId] || currentDepartment()).icon) + '</span>'
          + '<span><span class="list-title">' + escapeHtml(course.name) + (course.userEntered ? '<span class="own-chip">kendi eklediğin</span>' : "") + programTag(course) + '</span><span class="list-meta">'
          + (course.scheduled === false ? 'Saat girilmedi · programda görünmez' : escapeHtml(course.dayLong) + ' · ' + escapeHtml(course.start) + '–' + escapeHtml(course.end) + placeCopy(course))
          + '<br>' + escapeHtml(course.departmentName) + ' · ' + gradeCopy(course) + branchCopy(course) + '</span></span>'
          + '<span class="select-mark">' + icon(selected ? "check" : "plus") + '</span></button>';
      }

      function renderOnboardingTwo() {
        var visible = filteredCourses();
        var imported = hasImportedRows();
        // Bölümün bazı sınıfları yüklü, bu sınıf değil (ör. Diş Hekimliği'nde yalnız 3. sınıf):
        // öğrenci takılmasın, programı derssiz kaydedebilsin.
        var gradeMissing = imported && state.courseFilter === "grade" && !state.query.trim() && !visible.length;
        if (medMode()) {
          var medHas = medList().length > 0;
          screen.innerHTML = '<div class="screen-layout"><div class="screen-scroll" style="padding-bottom:105px">'
            + '<div class="screen-header"><button class="icon-button" data-route="onboarding-1" aria-label="Geri">' + icon("back") + '</button><h1 class="screen-title">Ders programın</h1><span style="width:44px"></span></div>'
            + '<div class="progress"><div class="progress-track"><div class="progress-fill" style="width:100%"></div></div><span>2 / 2</span></div>'
            + '<div class="empty-state"><span class="icon-tile">' + icon("calendar") + '</span><h3>' + (medHas ? 'Ders seçmen gerekmiyor' : 'Dönem ' + escapeHtml(String(state.grade)) + ' ders programı henüz eklenmedi') + '</h3>'
            + '<p>' + (medHas ? 'Tıp ders kurulu programı tarihlidir: her günün dersi, saati ve öğretim üyesi kurul programından gelir.' : 'Eklendiğinde günlük programın burada olacak.') + '</p></div>'
            + '</div><div class="sticky-action"><div class="selection-count"><strong>Dönem ' + escapeHtml(String(state.grade)) + '</strong><span>Tıp Fakültesi ders kurulu programı</span></div><button class="primary-button" data-action="finish-onboarding">Programı kaydet</button></div></div>';
          return;
        }
        var coursePicker = imported
          ? '<div class="search-wrap">' + icon("search") + '<input id="course-search" class="search-input" type="search" value="' + escapeHtml(state.query) + '" placeholder="Ders kodu veya adı ara" aria-label="Ders ara"></div>'
            + courseFilterChips()
            + '<div class="local-note">' + icon("info") + '<span>Alttan veya üstten aldığın dersleri de ekleyebilirsin.</span></div>'
            + '<div class="list-stack" style="margin-top:12px">' + (visible.length ? courseGroupList(visible)
              : gradeMissing ? '<div class="empty-state"><h3>' + escapeHtml(pickGradeLabel()) + ' ders programı henüz eklenmedi</h3><p>Eklendiğinde derslerini buradan seçebileceksin. Programını şimdi kaydedebilir, alttan veya üstten aldığın dersleri ' + allGradesLabel() + ' seçeneğinden ekleyebilirsin.</p></div>'
              : '<div class="empty-state"><h3>Bu filtrede ders yok</h3><p>' + allGradesLabel() + ' seçeneğini açabilir veya aramayı temizleyebilirsin.</p></div>') + '</div>'
          : (team()
            ? '<div class="empty-state"><span class="icon-tile">' + icon("database") + '</span><h3>Program seçime hazır</h3><p>Ders satırları henüz içe aktarılmadı. Kaynaksız veya tahminî ders gösterilmeyecek.</p><button class="secondary-button" data-sheet="source">Veri durumunu incele</button></div>'
            : '<div class="empty-state"><span class="icon-tile">' + icon("calendar") + '</span><h3>Ders programın henüz eklenmedi</h3><p>Bölümünü kaydedebilirsin; ders programı eklendiğinde derslerini buradan seçeceksin.</p><button class="secondary-button" data-sheet="source">Bölüm sayfasını aç</button></div>');
        var html = ''
          + '<div class="screen-header"><button class="icon-button" data-route="onboarding-1" aria-label="Geri">' + icon("back") + '</button><h1 class="screen-title">Derslerini seç</h1><span style="width:44px"></span></div>'
          + '<div class="progress"><div class="progress-track"><div class="progress-fill" style="width:100%"></div></div><span>2 / 2</span></div>'
          + coursePicker;
        screen.innerHTML = '<div class="screen-layout"><div class="screen-scroll" style="padding-bottom:105px">' + html + '</div><div class="sticky-action"><div class="selection-count"><strong>' + (imported && !gradeMissing ? state.selected.length + ' ders seçildi' : 'Program seçildi') + '</strong><span>' + (imported ? (team() ? 'Aday veri · canlı değildir' : 'Bölümünün resmî ders programından') : (team() ? 'Ders verisi aktarım bekliyor' : 'Ders programı henüz eklenmedi')) + '</span></div><button class="primary-button" data-action="finish-onboarding"' + (imported && !state.selected.length && !gradeMissing ? " disabled" : "") + '>' + (imported && !gradeMissing ? 'Programımı oluştur' : 'Programı kaydet') + '</button></div></div>';
      }

      function courseFilterChips() {
        return '<div class="chips"><button class="chip ' + (state.courseFilter === "grade" ? "active" : "") + '" data-course-filter="grade">' + escapeHtml(pickGradeLabel()) + '</button><button class="chip ' + (state.courseFilter === "all" ? "active" : "") + '" data-course-filter="all">' + allGradesLabel() + '</button></div>';
      }

      function filteredCourses() {
        var query = state.query.trim().toLocaleLowerCase("tr-TR");
        return coursesFor(pickDepartment()).filter(function (course) {
          if (state.courseFilter === "grade") {
            // Lisansüstünde seçim sınıf numarası değil aşama adıdır.
            if (course.stage) {
              if (course.stage !== pickGradeLabel()) return false;
            } else if (course.grade !== pickGrade()) {
              return false;
            }
          }
          return !query || (course.name + " " + (course.code || "")).toLocaleLowerCase("tr-TR").indexOf(query) !== -1;
        }).sort(function (a, b) {
          if (Boolean(a.start) !== Boolean(b.start)) return a.start ? -1 : 1;
          return a.grade - b.grade || (a.day || "").localeCompare(b.day || "", "tr") || (a.start || "").localeCompare(b.start || "");
        });
      }

      /*
       * Bugün ekranındaki özet kartı. Bugün dersi olan öğrenciye doğrudan
       * "girmedim" demenin yolunu da gösterir; sınırına yaklaşan dersi öne alır.
       */
      function attendanceTodayCard() {
        var groups = absenceGroups();
        if (!groups.length) return "";
        var over = groups.filter(function (g) { return g.level === "over"; });
        var near = groups.filter(function (g) { return g.level === "near"; });
        var todayDay = todayShortDay();
        var todayCount = groups.filter(function (g) { return g.sessions.some(function (s) { return s.day === todayDay; }); }).length;
        var copy = over.length ? over.length + " derste sınırı aşmış olabilirsin · " + escapeHtml(over[0].name)
          : near.length ? near.length + " derste bir ders daha sınırı aşar · " + escapeHtml(near[0].name)
          : todayCount ? "Bugün " + todayCount + " dersin var · girmediğini tek dokunuşla işle"
          : "Devamsızlığını ders saati olarak tarihli tut";
        return '<button class="tile tint-cream" data-route="attendance">'
          + '<span class="icon-tile">' + icon(over.length || near.length ? "alert" : "clock") + '</span>'
          + '<span><span class="tile-title">Devamsızlık</span><span class="tile-copy">' + copy + '</span></span>'
          + icon("chevron") + '</button>';
      }

      /*
       * Haftalık kontrol (2026-10-24): Cuma–Pazar, öğretim aralığında, o hafta cevaplanmadıysa
       * Bugün'de tek soru. Bildirim değil: izin istemez, cevap yalnız bu cihazda tutulur.
       */
      function weeklyAbsenceCheck() {
        var today = turkeyDateIso();
        var dow = new Date(today + "T12:00:00Z").getUTCDay();
        if ([5, 6, 0].indexOf(dow) === -1) return "";
        var term = teachingTerm();
        if (!term || today < term.start || addDaysIso(today, -4) > term.end) return "";
        var monday = weekMonday(today);
        if (inGap(term, monday) && inGap(term, addDaysIso(monday, 4))) return "";
        if (state.absenceWeekly === monday || state.absenceSnooze === today) return "";
        if (!absenceGroups().length) return "";
        return '<section class="section"><div class="info-card tint-cream absence-week">'
          + '<span class="icon-tile">' + icon("clock") + '</span>'
          + '<span><span class="card-title">Bu hafta kaçırdığın ders var mı?</span>'
          + '<span class="card-copy">Kaçırdıklarını işlersen kalan hakkını doğru hesaplarım.</span>'
          + '<span class="absence-week-actions">'
          + '<button class="secondary-button" data-absence-week="none">Yok, kontrol ettim</button>'
          + '<button class="primary-button" data-absence-week="yes">Evet, ders seç</button>'
          + '<button class="text-button" data-absence-week="later">Sonra</button>'
          + '</span></span></div></section>';
      }

      function renderAttendance() {
        var groups = absenceGroups();
        var html = ''
          + '<div class="screen-header"><button class="icon-button" data-route="' + (state.previousRoute === "attendance" ? "today" : state.previousRoute) + '" aria-label="Geri">' + icon("back") + '</button><h1 class="screen-title">Devamsızlığım</h1><span style="width:44px"></span></div>';
        if (!groups.length) {
          html += '<div class="empty-state"><span class="icon-tile">' + icon("clock") + '</span><h3>Önce ders seç</h3><p>Programına ders ekledikten sonra her dersin devamsızlığını buradan tutabilirsin.</p><button class="primary-button" data-route="course-add">' + icon("plus") + ' Ders ekle</button></div>';
          screen.innerHTML = layout(html, "", true);
          return;
        }
        var term = teachingTerm();
        var used = groups.reduce(function (sum, g) { return sum + g.used; }, 0);
        var risky = groups.filter(function (g) { return g.level === "over" || g.level === "near"; }).length;
        groups.sort(function (a, b) {
          var rank = { over: 0, near: 1, ok: 2, none: 3 };
          return rank[a.level] - rank[b.level];
        });
        html += '<div class="detail-grid" style="margin-bottom:12px">'
          + '<div class="detail-box"><span>Toplam devamsızlık</span><strong>' + used + ' ders saati</strong></div>'
          + '<div class="detail-box"><span>Riskli ders</span><strong>' + risky + ' / ' + groups.length + '</strong></div>'
          + '</div>'
          + (term ? '<p class="stepper-label" style="margin:0 0 12px">Güz yarıyılı öğretim aralığı ' + diningDateLabel(term.start) + ' – ' + diningDateLabel(term.end)
              + (term.gaps.length ? ' · ara sınav dönemi (' + term.gaps.map(eventDateLabel).join(", ") + ') sayıma katılmadı' : '')
              + (team() ? ' · akademik takvim, insan kontrolünden geçmedi.' : '') + '</p>' : '')
          + groups.map(function (g, i) { return '<div style="margin-bottom:10px">' + absenceCard(g, i, true) + '</div>'; }).join("")
          + absenceRuleNote();
        screen.innerHTML = layout(html, "", true);
      }

      /*
       * Sınav programı (2026-10-20). Kaynak: birimlerin resmî duyuru
       * sayfalarındaki ara sınav programı belgeleri (data/exams.js, üretici
       * tools/build-exams.py). Belgeler bitiş saati vermiyor; uygulama da
       * yazmıyor. Öğretim elemanı belgede yazdığı gibi gösterilir (kullanıcı
       * kararı 2026-10-20).
       */
      var examData = window.UNIKAPSUL_EXAMS || { exams: [], sources: {}, notices: [], unparsed: [] };

      function foldName(value) {
        return String(value || "").toLocaleUpperCase("tr-TR").replace(/[^A-ZÇĞİÖŞÜ0-9]/g, "");
      }

      function examOrder(a, b) {
        return (a.date + (a.start_time || "99")).localeCompare(b.date + (b.start_time || "99"));
      }

      function departmentExams(departmentId) {
        return (examData.exams || []).filter(function (e) { return e.department_id === departmentId; }).sort(examOrder);
      }

      // Ders kodu ikisinde de varsa kod belirleyicidir; yoksa ders adı (büyük
      // harf, noktalama yok) birebir aynı olmalı. Benzerlik tahmini yapılmaz.
      function examMatches(exam, course) {
        if (exam.department_id !== course.departmentId) return false;
        if (exam.course_code && course.code) return exam.course_code === course.code;
        return foldName(exam.course_name) === foldName(course.name);
      }

      function examsForCourse(course) {
        return departmentExams(course.departmentId).filter(function (e) { return examMatches(e, course); });
      }

      function myExams() {
        var seen = {};
        var out = [];
        selectedCourses().forEach(function (course) {
          examsForCourse(course).forEach(function (e) {
            if (!seen[e.exam_id]) { seen[e.exam_id] = true; out.push(e); }
          });
        });
        return out.sort(examOrder);
      }

      function examDay(exam) {
        if (!exam.date) return "Tarih okunamadı";
        return new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", weekday: "long", timeZone: "UTC" })
          .format(new Date(exam.date + "T12:00:00Z"));
      }

      function examCountdown(exam) {
        if (!exam.date) return "";
        var d = daysUntil(exam.date);
        if (d < 0) return "geçti";
        if (d === 0) return "bugün";
        if (d === 1) return "yarın";
        return d + " gün kaldı";
      }

      function examTime(exam) {
        return exam.start_time ? exam.start_time : "Saat belgeden okunamadı";
      }

      function examPeriod() {
        return calendarEvents().find(function (e) { return e.term === "guz" && /Ara Sınav Dönemi/.test(e.title); }) || null;
      }

      // Sınav ekranı ajanda düzenindedir (2026-10-23, kullanıcı: "tasarımını
      // beğenmedim"): önce sıradaki sınav, sonra günlere göre gruplu satırlar.
      // Satırda solda saat, ortada ders, altında salon etiketi; kontrol
      // bekleyen sınav gizlenmez, kısa bir etiketle işaretlenir.
      function examDateParts(iso) {
        if (!iso) return { weekday: "Tarih okunamadı", date: "" };
        var d = new Date(iso + "T12:00:00Z");
        return {
          weekday: new Intl.DateTimeFormat("tr-TR", { weekday: "long", timeZone: "UTC" }).format(d),
          date: new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", timeZone: "UTC" }).format(d)
        };
      }

      function examGradeLabel(raw) {
        return /^\d/.test(raw) ? raw + ". sınıf" : raw;
      }

      function examLine(exam, opts) {
        opts = opts || {};
        var meta = [];
        if (exam.room_raw) meta.push('<span class="exam-chip">Salon ' + escapeHtml(exam.room_raw) + '</span>');
        if (opts.grade && exam.grade_raw) meta.push('<span class="exam-chip">' + escapeHtml(examGradeLabel(exam.grade_raw)) + '</span>');
        if (opts.clash) meta.push('<span class="exam-chip warn">' + (team() ? 'Belgede bu saatte ' + opts.clash + ' sınav var' : 'Aynı saatte ' + opts.clash + ' sınav') + '</span>');
        if (exam.verification_status === "needs_review") meta.push(team() ? '<span class="exam-chip warn">Kontrol bekliyor</span>' : '<span class="exam-chip warn">Teyit et</span>');
        return '<button class="exam-line" data-exam="' + escapeHtml(exam.exam_id) + '">'
          + '<span class="exam-time">' + escapeHtml(exam.start_time || "—") + '</span>'
          + '<span class="exam-body"><span class="exam-name">' + escapeHtml(exam.course_name) + '</span>'
          + (meta.length ? '<span class="exam-meta">' + meta.join("") + '</span>' : '')
          + '</span>' + icon("chevron") + '</button>';
      }

      // Liste günlere bölünür; belgedeki merkezi/ortak sınav notları kendi
      // gününün altında, sınavlardan ayrı biçimde durur.
      function examAgenda(list, opts) {
        opts = opts || {};
        var days = {};
        var slots = {};
        var flagged = {};
        list.forEach(function (e) {
          (days[e.date || ""] = days[e.date || ""] || { exams: [], notes: [] }).exams.push(e);
          var k = e.date + "|" + e.start_time;
          if (e.date && e.start_time) slots[k] = (slots[k] || 0) + 1;
        });
        // Aynı saatteki sınav sayısı yalnız o saatin ilk satırında yazılır.
        function clashOf(e) {
          var k = e.date + "|" + e.start_time;
          if (!(slots[k] > 1) || flagged[k]) return 0;
          flagged[k] = true;
          return slots[k];
        }
        (opts.notes || []).forEach(function (n) {
          (days[n.date || ""] = days[n.date || ""] || { exams: [], notes: [] }).notes.push(n);
        });
        return Object.keys(days).sort(function (a, b) { return (a || "9").localeCompare(b || "9"); }).map(function (iso) {
          var day = days[iso];
          var parts = examDateParts(iso);
          var left = iso ? daysUntil(iso) : null;
          var rows = day.exams.map(function (e) { return { t: e.start_time || "99", html: examLine(e, { grade: opts.grade, clash: clashOf(e) }) }; })
            .concat(day.notes.map(function (n) {
              return { t: n.time || "99", html: '<div class="exam-line note"><span class="exam-time">' + escapeHtml(n.time || "—") + '</span><span class="exam-body"><span class="exam-note-label">Belgedeki not</span><span class="exam-note">' + escapeHtml(n.text) + '</span></span></div>' };
            }))
            .sort(function (a, b) { return a.t.localeCompare(b.t); });
          return '<div class="exam-day' + (left !== null && left < 0 ? ' past' : '') + '">'
            + '<div class="exam-day-head"><strong>' + escapeHtml(parts.weekday) + '</strong><span>' + escapeHtml(parts.date) + '</span>'
            + (left !== null ? '<span class="exam-day-left">' + escapeHtml(left < 0 ? "geçti" : left === 0 ? "bugün" : left === 1 ? "yarın" : left + " gün") + '</span>' : '')
            + '</div>' + rows.map(function (r) { return r.html; }).join("") + '</div>';
        }).join("");
      }

      // Kontrol bekleyen sınavların nedeni üretici notundan okunur ve bir kez,
      // ekranın üstünde söylenir (her satırda yalnız kısa etiket kalır).
      function examReviewSummary(list) {
        var reasons = [
          [/yılında/, "belgede tarihin yılı yanlış yazılmış (gün adına göre düzeltildi)"],
          [/saatler yeniden başlıyor/, "belgede bu sınavların günü yazılmamış"],
          [/Saat belgede okunamadı|Saat OCR ile okunamadı/, "saat belgeden okunamadı"],
          [/Taranmış belgeden/, "belge taranmış, değerler görüntüden okundu (yazım hatası olabilir)"]
        ];
        var counts = {};
        var other = 0;
        list.forEach(function (e) {
          if (e.verification_status !== "needs_review") return;
          var hit = reasons.filter(function (r) { return r[0].test(e.notes || ""); });
          if (!hit.length) other += 1;
          hit.forEach(function (r) { counts[r[1]] = (counts[r[1]] || 0) + 1; });
        });
        var parts = reasons.filter(function (r) { return counts[r[1]]; }).map(function (r) { return counts[r[1]] + " sınavda " + r[1]; });
        if (other) parts.push(other + " sınavda belgeyle karşılaştırılması gereken bir bilgi var");
        return "Kontrol bekliyor: " + parts.join("; ") + ".";
      }

      function examNext(list) {
        var next = list.filter(function (e) { return e.date && daysUntil(e.date) >= 0; })[0];
        if (!next) return "";
        var left = daysUntil(next.date);
        var parts = examDateParts(next.date);
        return '<button class="exam-next" data-exam="' + escapeHtml(next.exam_id) + '">'
          + '<span class="exam-next-count">' + (left === 0 ? 'Bugün' : left === 1 ? 'Yarın' : left + '<small>gün kaldı</small>') + '</span>'
          + '<span class="exam-body"><span class="exam-next-label">Sıradaki sınavın</span>'
          + '<span class="exam-next-title">' + escapeHtml(next.course_name) + '</span>'
          + '<span class="exam-next-meta">' + escapeHtml(parts.date + ' ' + parts.weekday) + (next.start_time ? ' · ' + escapeHtml(next.start_time) : '')
          + (next.room_raw ? ' · Salon ' + escapeHtml(next.room_raw) : '') + '</span></span></button>';
      }

      function examTodayCard() {
        var department = currentDepartment();
        var mine = myExams().filter(function (e) { return !e.date || daysUntil(e.date) >= 0; });
        var all = departmentExams(department.id);
        var period = examPeriod();
        var copy;
        if (mine.length) {
          var first = mine[0];
          copy = (first.date ? escapeHtml(examCountdown(first)) + ' · ' : '') + escapeHtml(first.course_name) + ' · '
            + escapeHtml(examDay(first)) + (first.start_time ? ' ' + escapeHtml(first.start_time) : '');
        } else if (all.length) {
          copy = 'Bölümünün ara sınav programı yayımlandı · ' + all.length + ' sınav';
        } else if (period && daysUntil(period.start) >= 0 && daysUntil(period.start) <= 30) {
          copy = ((examData.scanned_departments || []).indexOf(department.id) !== -1 ? 'Programın henüz yayımlanmadı' : (team() ? 'Bölüm duyuruları izlenmiyor' : 'Ara sınav dönemi'))
            + (team() || (examData.scanned_departments || []).indexOf(department.id) !== -1 ? ' · dönem ' : ' · ') + escapeHtml(eventDateLabel(period));
        } else {
          return "";
        }
        return '<button class="tile tint-violet" data-route="exams">'
          + '<span class="icon-tile">' + icon("calendar") + '</span>'
          + '<span><span class="tile-title">Ara sınav</span><span class="tile-copy">' + copy + '</span></span>'
          + icon("chevron") + '</button>';
      }

      function examCourseCard(course) {
        var list = examsForCourse(course);
        var all = departmentExams(course.departmentId);
        if (!all.length) return "";
        return '<section class="section"><div class="section-heading"><h2>Ara sınav</h2><button class="text-button" data-route="exams">Tüm sınavlarım</button></div>'
          + (list.length
              ? examAgenda(list)
              : '<p class="sheet-copy">Bölümün ara sınav programında bu dersle birebir eşleşen sınav bulunamadı. Ders adı belgede farklı yazılmış olabilir; tüm listeye bak.</p>')
          + '</section>';
      }

      function renderExams() {
        var department = currentDepartment();
        var mine = myExams();
        var all = departmentExams(department.id);
        var period = examPeriod();
        var html = '<div class="screen-header"><button class="icon-button" data-route="' + (state.previousRoute === "exams" ? "today" : state.previousRoute) + '" aria-label="Geri">' + icon("back") + '</button><h1 class="screen-title">Ara sınavlarım</h1><span style="width:44px"></span></div>';
        var source = all.length ? examData.sources[all[0].source_id] : null;
        var scanned = (examData.scanned_departments || []).indexOf(department.id) !== -1;
        if (!all.length) {
          html += '<div class="empty-state"><span class="icon-tile">' + icon("calendar") + '</span>'
            + (scanned
                ? '<h3>Ara sınav programın henüz yayımlanmadı</h3><p>' + (team() ? escapeHtml(department.name) + ' bölümünün resmî duyuru sayfasında 2026-2027 Güz ara sınav programı yok'
                  + (examData.checked_at ? ' (son kontrol: ' + escapeHtml(isoDateLabel(examData.checked_at.slice(0, 10)) || examData.checked_at.slice(0, 10)) + ')' : '') + '.' : 'Yayımlandığında burada görünecek.')
                : '<h3>Ara sınav programın henüz eklenmedi</h3><p>' + (team() ? escapeHtml(department.name) + ' için duyuru sayfası adresi elimizde yok; sınav programı yayımlanmış olabilir. Bölümünün kendi duyuru sayfasına bak.' : 'Bölümünün duyuru sayfasını takip et.'))
            + (period ? ' Akademik takvime göre ara sınav dönemi ' + escapeHtml(eventDateLabel(period)) + '.' : '') + '</p></div>';
        } else {
          var notices = {};
          (examData.notices || []).forEach(function (n) {
            if (n.department_id === department.id) notices[n.date + "|" + n.text] = n;
          });
          var noticeList = Object.keys(notices).sort().map(function (k) { return notices[k]; });
          // Seçilen derslerle eşleşme yoksa (bölümün ders programı yüklü değil ya da adlar
          // farklı) liste belgenin KENDİ sınıf sütununa göre öğrencinin sınıfına süzülür.
          var gradeMatch = all.filter(function (e) { return String(e.grade_raw) === String(state.grade); });
          var byGrade = !mine.length && gradeMatch.length > 0 && gradeMatch.length < all.length;
          var shown = mine.length ? mine : byGrade ? gradeMatch : all;
          // Bir bölümün birden çok belgesi olabilir (Diş Hekimliği: sınıf başına bir PDF);
          // kaynak satırı, bağlantı ve belge notları yalnız gösterilen sınavların belgesinden.
          var shownSources = {};
          shown.forEach(function (e) { shownSources[e.source_id] = true; });
          var sourceIds = Object.keys(shownSources);
          source = examData.sources[sourceIds[0]] || source;
          noticeList = noticeList.filter(function (n) { return shownSources[n.source_id] || (!mine.length && !byGrade); });
          var review = shown.filter(function (e) { return e.verification_status === "needs_review"; }).length;
          html += examNext(mine.length ? mine : byGrade ? shown : [])
            + '<p class="exam-source">Bölümün ' + escapeHtml(isoDateLabel(source.published_at) || "") + ' tarihli duyurusu' + (team() ? ' · insan kontrolünden geçmedi, belge güncellenebilir.' : '.')
            + (source.document_url && sourceIds.length === 1 ? ' <a href="' + escapeHtml(safeOfficialUrl(source.document_url)) + '" target="_blank" rel="noopener noreferrer">Belgeyi aç</a>' : '') + '</p>'
            + (review && team() ? '<p class="exam-banner">' + icon("alert") + '<span>' + examReviewSummary(shown) + ' Ayrıntı için sınava dokun.</span></p>' : '')
            + '<section class="section"><div class="section-heading"><h2>' + (mine.length ? 'Sınav takvimim' : byGrade ? state.grade + '. sınıf ara sınavları' : 'Bölümün ara sınavları') + '</h2>'
            + '<span class="gpa-sub">' + shown.length + ' sınav</span></div>'
            + (mine.length ? '' : byGrade
                ? '<p class="sheet-copy" style="margin-top:0">' + (team() ? 'Seçtiğin derslerle eşleşme yok; liste belgedeki sınıf sütununa göre süzüldü. Diğer sınıflar aşağıda.' : 'Sınıfının ara sınavları. Diğer sınıflar aşağıda.') + '</p>'
                : '<p class="sheet-copy" style="margin-top:0">' + (team() ? 'Seçtiğin derslerle birebir eşleşen sınav yok; ders adı belgede farklı yazılmış olabilir. Bölümün tüm sınavları aşağıda.' : 'Bölümünün tüm ara sınavları.') + '</p>')
            + examAgenda(shown, { grade: !mine.length && !byGrade, notes: noticeList })
            + (noticeList.length ? '<p class="exam-source" style="margin-top:10px">' + (team() ? '"Belgedeki not" satırları merkezi ve fakülte ortak sınavlar için ayrılmış saattir; onların programı ayrı yayımlanır.' : 'Not satırları merkezi ve fakülte ortak sınavlara ayrılmış saatlerdir; onların programı ayrıca yayımlanır.') + '</p>' : '')
            + '</section>';
          if (mine.length || byGrade) {
            html += '<section class="section"><details class="gpa-details"><summary><span>Bölümün tüm ara sınavları</span><span class="gpa-sub">' + all.length + ' sınav · bütün sınıflar</span></summary>'
              + '<div class="gpa-details-body">' + examAgenda(all, { grade: true }) + '</div></details></section>';
          }
        }
        var others = (examData.unparsed || []).filter(function (u) { return u.department_ids.indexOf(department.id) !== -1; });
        // Formasyon programı birden çok birimin duyurusunda aynı başlıkla
        // yayımlanıyor; öğrenciye en yeni duyuru tek satır olarak gösterilir.
        var formasyon = (examData.unparsed || []).filter(function (u) { return !u.department_ids.length && /formasyon/i.test(u.title); })
          .sort(function (a, b) { return String(b.published_at).localeCompare(String(a.published_at)); });
        // Formasyon belgesi bölüme özel değil (department_ids boş); kullanıcı 2026-10-24: bölümle
        // ilgisi olmayan belge öğrenciye eklenmez. Ekip görünümünde ve yönetim panelinde kalır.
        if (formasyon.length && team()) others = others.concat(formasyon);
        if (others.length) {
          html += '<section class="section"><details class="gpa-details"><summary><span>' + (team() ? 'Uygulamaya henüz eklenmeyen belgeler' : 'Diğer sınav duyuruları') + '</span><span class="gpa-sub">' + others.length + (team() ? ' belge · resmî sayfada açılır' : ' duyuru') + '</span></summary><div class="gpa-details-body"><div class="list-stack">'
            + others.map(function (u) {
                return '<a class="list-card" href="' + escapeHtml(safeOfficialUrl(u.document_urls[0])) + '" target="_blank" rel="noopener noreferrer">'
                  + '<span class="icon-tile">' + icon("database") + '</span><span><span class="list-title">' + escapeHtml(u.title) + '</span>'
                  + '<span class="list-meta">' + escapeHtml(isoDateLabel(u.published_at) || "") + (team() ? ' · ' + escapeHtml(u.reason) : ' · belgeyi aç') + '</span></span>' + icon("chevron") + '</a>';
              }).join("") + '</div></div></details></section>';
        }
        screen.innerHTML = layout(html, "", true);
      }

      function examSheetHtml(exam) {
        if (!exam) return '<p class="sheet-copy">Sınav kaydı bulunamadı.</p>';
        var src = examData.sources[exam.source_id] || {};
        // Bitiş saatini veren belgede (Diş Hekimliği) süre üretici notunda: "Belgede süre: 09.00–09.50".
        var endWritten = /Belgede süre: [\d.]+–([\d.]+)/.exec(exam.notes || "");
        return '<div class="sheet-copy">'
          + '<p><strong>' + escapeHtml(exam.course_name) + '</strong>' + (exam.course_code ? ' · ' + escapeHtml(exam.course_code) : '') + '</p>'
          + '<p><strong>Tarih:</strong> ' + escapeHtml(examDay(exam)) + (exam.date ? ' · ' + escapeHtml(examCountdown(exam)) : '') + '</p>'
          + '<p><strong>' + (endWritten || team() ? 'Başlangıç' : 'Saat') + ':</strong> ' + escapeHtml(examTime(exam)) + (endWritten ? ' · bitiş ' + escapeHtml(endWritten[1]) : (team() ? ' · bitiş saati belgede yazmıyor' : '')) + '</p>'
          + (exam.room_raw || team() ? '<p><strong>Salon:</strong> ' + escapeHtml(exam.room_raw || "belgede boş") + '</p>' : '')
          + (exam.grade_raw ? '<p><strong>Sınıf:</strong> ' + escapeHtml(exam.grade_raw) + '</p>' : '')
          + (exam.student_count != null && exam.student_count !== "" ? '<p><strong>Öğrenci sayısı:</strong> ' + escapeHtml(String(exam.student_count)) + '</p>' : '')
          + (team() ? '<p><strong>Durum:</strong> ' + escapeHtml(statusLabel(exam.verification_status)) + '</p>'
              + (exam.notes ? '<p><strong>Not:</strong> ' + escapeHtml(exam.notes) + '</p>' : '')
              + '<p><strong>Kaynak:</strong> ' + escapeHtml(src.title || "") + ' · yayım ' + escapeHtml(isoDateLabel(src.published_at) || "bilinmiyor") + ' · ' + escapeHtml(exam.source_page) + '</p>'
            : (exam.verification_status === "needs_review" ? '<p>' + confirmChip(exam) + ' Tarih, saat ve salonu sınav programı belgesinden teyit et.</p>' : ''))
          + (team() || instructorCopy(exam.instructor_raw) !== "Belgede yazmıyor" ? '<p><strong>Öğretim elemanı:</strong> ' + escapeHtml(instructorCopy(exam.instructor_raw)) + '</p>' : '')
          + (team() ? '<p><strong>Ekip:</strong> ' + escapeHtml(exam.exam_id) + ' · ' + escapeHtml(src.file || "") + ' · sha256 ' + escapeHtml((src.sha256 || "").slice(0, 16)) + '…</p>' : '')
          + (team() ? '<p>Sınav yeri ve saati değişebilir; kesin bilgi için belgeyi ve bölüm duyurusunu kontrol et.</p>' : '') + '</div>'
          + (src.document_url ? '<a class="primary-button" style="width:100%" href="' + escapeHtml(safeOfficialUrl(src.document_url)) + '" target="_blank" rel="noopener noreferrer">Sınav programı belgesini aç</a>' : '')
          + (src.announcement_url ? '<a class="secondary-button" style="width:100%;margin-top:8px" href="' + escapeHtml(safeOfficialUrl(src.announcement_url)) + '" target="_blank" rel="noopener noreferrer">Duyuru sayfasını aç</a>' : '');
      }

      // Bugün ekranındaki not kartı yalnız en az bir not girilmişse görünür.
      // Not girmemiş öğrenciye hiç gösterilmez; yoğun dönemde kendiliğinden
      // öne çıkar, boş dönemde kaybolur.
      function gradeTodayCard() {
        var entries = gradedCourses().filter(function (entry) {
          return entry.summary && entry.summary.scoredWeight;
        });
        if (!entries.length) return "";
        var risky = entries.filter(function (entry) { return gradeStatusLevel(entry) === "over"; });
        var copy = risky.length
          ? risky.length + " derste hedefe ulaşılamıyor"
          : entries.length + " derste not girdin";
        return '<section class="section"><button class="info-card ' + (risky.length ? "announcement" : "menu") + '" data-route="grades">'
          + '<span class="icon-tile">' + icon(risky.length ? "alert" : "agenda") + '</span>'
          + '<span><span class="card-title">Not durumun</span><span class="card-copy">' + copy + '</span></span>'
          + icon("chevron") + '</button></section>';
      }

      // Türkiye saatine göre "şu an" — kart saate göre seçilir.
      function turkeyClock() {
        var parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Europe/Istanbul", hour: "2-digit", minute: "2-digit", hour12: false
        }).formatToParts(new Date());
        var values = {};
        parts.forEach(function (part) { values[part.type] = part.value; });
        return values.hour + ":" + values.minute;
      }

      function todayShortDay() {
        var name = new Intl.DateTimeFormat("en-US", {
          timeZone: "Europe/Istanbul", weekday: "short"
        }).format(new Date());
