      function recordSourceSheetHtml(course) {
        if (!course) return '<p class="sheet-copy">Gösterilecek ders kaydı yok.</p>';
        if (course.userEntered) {
          return '<div class="sheet-copy"><p><strong>' + escapeHtml(course.name) + '</strong></p>'
            + '<p>Bu kaydı sen ekledin. Resmî kaynağı yoktur ve kurumun kaydı gibi sunulmaz.</p>'
            + '<p>Programına girmesi için gün, başlangıç ve bitiş saatinin dolu olması gerekir.</p></div>';
        }
        var meta = sourceMeta(course.sourceId);
        if (!team()) {
          var stuHtml = '<div class="sheet-copy"><p><strong>' + escapeHtml(course.name) + '</strong>' + (course.code ? ' · ' + escapeHtml(course.code) : "") + '</p>'
            + '<p>Bu ders, bölümünün yayımladığı ' + escapeHtml((meta && isoDateLabel(meta.source_published_at)) ? isoDateLabel(meta.source_published_at) + ' tarihli ' : '') + 'haftalık ders programından alınmıştır.</p>'
            + (course.status === "needs_review" ? '<p>' + confirmChip(course) + ' Saat ve dersliği bu belgeden teyit et.</p>' : '') + '</div>';
          var stuDoc = meta ? safeOfficialUrl(meta.source_document_url) : "";
          var stuAnn = meta && meta.announcement_url ? safeOfficialUrl(meta.announcement_url) : "";
          return stuHtml
            + (stuDoc ? '<a class="primary-button" style="width:100%" href="' + escapeHtml(stuDoc) + '" target="_blank" rel="noopener noreferrer">Ders programı belgesini aç</a>' : '')
            + (stuAnn ? '<a class="secondary-button" style="width:100%;margin-top:8px" href="' + escapeHtml(stuAnn) + '" target="_blank" rel="noopener noreferrer">Duyuru sayfasını aç</a>' : '');
        }
        var html = '<div class="sheet-copy"><p><strong>' + escapeHtml(course.name) + '</strong>'
          + (course.code ? ' · ' + escapeHtml(course.code) : "") + '</p>'
          + '<p><strong>Kayıt durumu:</strong> ' + escapeHtml(statusLabel(course.status)) + '</p>'
          + (courseNotes(course) ? '<p><strong>' + (team() ? 'Gerekçe' : 'Not') + ':</strong> ' + escapeHtml(courseNotes(course)) + '</p>' : "")
          + (team() ? '<p><strong>Bağımsız ikinci kontrol:</strong> ' + (course.verifiedAt ? escapeHtml(isoDateLabel(course.verifiedAt)) : "yapılmadı") + '</p>' : '');
        if (!meta) {
          html += '<p>Kaynak künyesi bulunamadı: <code>' + escapeHtml(course.sourceId || "—") + '</code></p></div>';
          return html;
        }
        html += (team() ? '<p><strong>Kaynak kimliği:</strong> ' + escapeHtml(meta.source_id) + ' · ' + escapeHtml(meta.source_type) + '</p>'
          + '<p><strong>Belge sürümü:</strong> ' + escapeHtml(meta.source_version_id) + '</p>' : '')
          + '<p><strong>Belgedeki yeri:</strong> ' + escapeHtml(course.sourcePage || "belirtilmemiş") + '</p>'
          + '<p><strong>Belge yayım tarihi:</strong> ' + escapeHtml(isoDateLabel(meta.source_published_at) || "bilinmiyor") + '</p>'
          + '<p><strong>' + (team() ? 'Arşive alınma' : 'Son kontrol') + ':</strong> ' + escapeHtml(isoDateLabel(meta.fetched_at) || "bilinmiyor") + '</p>'
          + (course.code
              ? (team() ? '<p><strong>Ders kodu kaynağı:</strong> ' + escapeHtml(course.codeSourceId || "belirtilmemiş") + '</p>' : '')
              : '<p><strong>Ders kodu:</strong> kaynakta yok — tahmin edilmedi</p>')
          + (team() && meta.notes ? '<p><strong>Kaynak notu:</strong> ' + escapeHtml(meta.notes) + '</p>' : "")
          + '<p>Gün, saat ve derslik yalnız bu belgeden okunur. Değişiklik olabilir; kesin bilgi için resmî duyuruyu kontrol et.</p></div>';
        var docUrl = safeOfficialUrl(meta.source_document_url);
        var annUrl = meta.announcement_url ? safeOfficialUrl(meta.announcement_url) : "";
        html += '<a class="primary-button" style="width:100%" href="' + escapeHtml(docUrl) + '" target="_blank" rel="noopener noreferrer">Kaynak belgeyi aç</a>';
        if (annUrl && annUrl !== docUrl) {
          html += '<a class="secondary-button" style="width:100%;margin-top:8px" href="' + escapeHtml(annUrl) + '" target="_blank" rel="noopener noreferrer">Duyuru sayfasını aç</a>';
        }
        return html;
      }

      /*
       * Depo kapsamı. "Veri kaynakları" ekranı önce yalnız seçili bölümün
       * durumunu gösteriyordu; kaç kaydın hangi durumda olduğu hiç görünmüyordu.
       * Bu sayılar metinden değil `courses` dizisinden sayılır.
       */
      function coverageSheetHtml() {
        if (!team()) {
          var d = currentDepartment();
          var ownIds = {};
          courses.forEach(function (c) { if (c.departmentId === d.id && c.sourceId) ownIds[c.sourceId] = true; });
          return '<div class="sheet-copy">'
            + '<p><strong>Ders saatleri ve derslikler</strong> üniversitenin yayımladığı haftalık ders programı belgesinden okunur'
            + (Object.keys(ownIds).length ? ' (' + escapeHtml(d.name) + ': ' + Object.keys(ownIds).map(function (id) { return escapeHtml(isoDateLabel((offeringSources[id] || {}).source_published_at) || "tarihi yazmayan") + " tarihli belge"; }).join(", ") + ')' : ' — ' + escapeHtml(d.name) + ' için belge henüz okunmadı') + '.</p>'
            + '<p><strong>Ders planı</strong> NÖHÜ Bilgi Paketi\'nden, <strong>akademik takvim</strong> senato kararından, <strong>yemek menüsü</strong> yemekhanenin aylık listesinden gelir.</p>'
            + '<p>Bir bilgi resmî belgeyle uyuşmuyorsa “Hatalı bilgi bildir” ile haber ver; kısa sürede düzeltilir.</p>'
            + '<p>Not, devamsızlık ve kendi eklediğin dersler yalnız senin girdindir ve bu cihazda kalır.</p></div>';
        }
        var stats = recordStats();
        var usedIds = Object.keys(offeringSources).filter(function (id) {
          return courses.some(function (course) { return course.sourceId === id; });
        });
        var html = '<div class="sheet-copy"><p><strong>Ders oturumu kayıtları</strong></p>'
          + '<p>' + stats.total + ' kayıt · ' + stats.departments + ' program · ' + stats.sources + ' kaynak</p>'
          + '<p><strong>Yayımlanabilir kayıt:</strong> ' + stats.published + ' — hiçbir kayıt öğrenciye kesin veri olarak sunulmuyor.</p></div>'
          + '<div class="settings-card" style="margin-top:12px">'
          + Object.keys(stats.byStatus).map(function (key) {
              return '<div class="toggle-row"><span>' + escapeHtml(statusLabel(key)) + '</span><strong>' + stats.byStatus[key] + '</strong></div>';
            }).join("")
          + '</div>'
          + '<p class="sheet-copy" style="margin-top:14px"><strong>Kaynak belgeler</strong></p>'
          + '<div class="list-stack">'
          + usedIds.map(function (id) {
              var meta = offeringSources[id];
              var count = courses.filter(function (course) { return course.sourceId === id; }).length;
              return '<a class="list-card" href="' + escapeHtml(safeOfficialUrl(meta.source_document_url)) + '" target="_blank" rel="noopener noreferrer">'
                + '<span class="icon-tile">' + icon("database") + '</span>'
                + '<span><span class="list-title">' + escapeHtml(meta.source_id) + ' · ' + count + ' kayıt</span>'
                + '<span class="list-meta">' + escapeHtml(meta.source_version_id) + '<br>Arşive alınma: ' + escapeHtml(isoDateLabel(meta.fetched_at) || "bilinmiyor") + '</span></span>'
                + icon("chevron") + '</a>';
            }).join("")
          + '</div>'
          + '<p class="sheet-copy" style="margin-top:12px">Katalogda ' + catalog.units.length + ' akademik birim ve '
          + catalog.units.reduce(function (sum, unit) { return sum + unit.programs.length; }, 0)
          + ' program var. Ders satırı yalnız yukarıdaki kaynaklardan okunan programlarda bulunur; kalanlar için kaynak belgesi henüz çözülmedi.</p>';
        return html;
      }

      // Yerleşke adları katalogdan sayılır; sabit liste tutulmaz.
      function campusList() {
        var counts = {};
        catalog.units.forEach(function (unit) {
          unit.programs.forEach(function (program) {
            if (program.campus) counts[program.campus] = (counts[program.campus] || 0) + 1;
          });
        });
        return Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })
          .map(function (name) { return { name: name, count: counts[name] }; });
      }

      function foldTr(value) {
        return String(value || "").toLocaleLowerCase("tr-TR")
          .replace(/ı/g, "i").replace(/ş/g, "s").replace(/ğ/g, "g")
          .replace(/ü/g, "u").replace(/ö/g, "o").replace(/ç/g, "c");
      }

      function campusMatches() {
        var query = foldTr(state.campusQuery.trim());
        var filter = state.campusFilter;
        var rowsByProgram = {};
        courses.forEach(function (course) {
          rowsByProgram[course.departmentId] = (rowsByProgram[course.departmentId] || 0) + 1;
        });
        var out = [];
        catalog.units.forEach(function (unit) {
          var unitHit = !query || foldTr(unit.name).indexOf(query) >= 0 || foldTr(unit.shortName).indexOf(query) >= 0;
          unit.programs.forEach(function (program) {
            if (filter && program.campus !== filter) return;
            var hit = unitHit
              || foldTr(program.displayName || program.name).indexOf(query) >= 0
              || foldTr(program.campus).indexOf(query) >= 0;
            if (!hit) return;
            out.push({
              unit: unit,
              program: program,
              rows: rowsByProgram[program.id] || 0
            });
          });
        });
        return out;
      }

      function campusResultCard(entry) {
        var program = entry.program;
        var rowCopy = entry.rows
          ? (team() ? entry.rows + " ders kaydı · kaynak çözüldü" : "Ders programı var")
          : (program.status === "no_students" ? "Henüz öğrenci alınmadı" : (team() ? "Ders kaydı yok · kaynak belgesi çözülmedi" : "Ders programı henüz yok"));
        return '<button class="list-card" data-campus-program="' + escapeHtml(program.id) + '">'
          + '<span class="icon-tile">' + icon(program.icon || "building") + '</span>'
          + '<span><span class="list-title">' + escapeHtml(program.displayName || program.name) + '</span>'
          + '<span class="list-meta">' + escapeHtml(entry.unit.name) + ' · ' + escapeHtml(program.campus) + '<br>' + rowCopy + '</span></span>'
          + icon("chevron") + '</button>';
      }

      /*
       * Ders planı ekranı. Üç şeyi aynı ekranda söylemek zorundadır:
       * (1) hangi dersler, (2) hangi kaynaktan, (3) kaynağın SÖYLEMEDİĞİ ne.
       * Üçüncüsü atlanırsa ekran resmî bir müfredat belgesi gibi görünür ki
       * değildir: yürürlük yılı 67 programın 66'sında belgede yazmıyor ve
       * kaynak tabloda AKTS sütunu hiç yok.
       */
      /*
       * Lisansüstü ders planında sınıf yoktur; kaynak sayfa tek bölme kullanır.
       * O bölmeyi "1. sınıf" diye etiketlemek ADR-0005'in yasakladığı şeydir.
       */
      function planGradeLabel(plan, grade) {
        if (plan && plan.level === "lisansustu") return "Ders dönemi";
        return grade + ". sınıf";
      }

      function curriculumSemesterLabel(semester) {
        return semester === "bahar" ? "Bahar yarıyılı" : "Güz yarıyılı";
      }

      function curriculumActiveGrade(plan) {
        var grades = curriculumGrades(plan);
        if (!grades.length) return "";
        if (state.curriculumGrade && grades.indexOf(state.curriculumGrade) !== -1) return state.curriculumGrade;
        var fromProfile = String(state.grade);
        if (grades.indexOf(fromProfile) !== -1) return fromProfile;
        return grades[0];
      }

      function curriculumCourseRow(course) {
        var flagged = course.status === "needs_review";
        if (!team()) {
          return '<div class="plan-row"><span class="plan-code">' + escapeHtml(course.code || "—") + '</span>'
            + '<span class="plan-body"><span class="card-title">' + escapeHtml(course.name) + confirmChip(course) + '</span>'
            + (course.type ? '<span class="list-meta">' + escapeHtml(course.type) + '</span>' : '') + '</span></div>';
        }
        return '<div class="plan-row' + (flagged ? " flagged" : "") + '">'
          + '<span class="plan-code">' + escapeHtml(course.code || "—") + '</span>'
          + '<span class="plan-body"><span class="card-title">' + escapeHtml(course.name) + '</span>'
          + '<span class="list-meta">' + escapeHtml(course.type || "Tip yazılmamış")
          + (flagged ? ' · <strong>' + escapeHtml(STATUS_LABEL.needs_review) + '</strong>' : "")
          + '</span>'
          + (flagged ? '<span class="list-meta">' + escapeHtml(course.notes) + '</span>' : "")
          + '</span></div>';
      }

      function curriculumSourceCard(plan) {
        var meta = curriculumSource(plan);
        if (!team()) {
          return meta && meta.source_document_url
            ? '<a class="info-card announcement" href="' + escapeHtml(safeOfficialUrl(meta.source_document_url)) + '" target="_blank" rel="noopener noreferrer"><span class="icon-tile">' + icon("database") + '</span><span><span class="card-title">Bilgi Paketi ders planı</span><span class="card-copy">Resmî sayfayı aç</span></span>' + icon("chevron") + '</a>'
            : '';
        }
        if (!meta) {
          return '<div class="info-card"><span class="icon-tile">' + icon("alert") + '</span><span><span class="card-title">Kaynak künyesi çözülemedi</span><span class="card-copy">Bu plan gösterilmemeliydi; hata bildir.</span></span></div>';
        }
        var year = meta.effective_from
          ? "Yürürlük: " + escapeHtml(meta.effective_from) + " eğitim öğretim yılından itibaren"
          : "<strong>Yürürlük yılı belgede yazmıyor.</strong> Bu planın hangi girişli öğrenciler için geçerli olduğunu kaynak sayfa belirtmiyor.";
        return '<div class="info-card announcement"><span class="icon-tile">' + icon("database") + '</span>'
          + '<span><span class="card-title">Kaynak: NÖHÜ Bilgi Paketi ders planı sayfası</span>'
          + '<span class="card-copy">' + (team()
              ? escapeHtml(meta.source_version_id) + '<br>Arşive alınma: ' + escapeHtml(isoDateLabel(meta.fetched_at) || "bilinmiyor") + '<br>sha256: ' + escapeHtml(meta.sha256.slice(0, 16)) + '…'
              : 'Son kontrol: ' + escapeHtml(isoDateLabel(meta.fetched_at) || "bilinmiyor"))
          + '<br>' + year + '</span></span></div>';
      }

      function renderCurriculum() {
        var department = currentDepartment();
        var plan = curriculumPlan(department.id);
        var html = '<div class="screen-header"><button class="icon-button" data-route="more" aria-label="Geri">' + icon("back") + '</button><h1 class="screen-title">Ders planı</h1><span style="width:44px"></span></div>';

        if (!plan && !team()) {
          html += '<div class="empty-state"><span class="icon-tile">' + icon("agenda") + '</span><h3>Ders planı henüz eklenmedi</h3>'
            + '<p>' + escapeHtml(department.name) + ' programının ders planı eklendiğinde burada görünecek.</p></div>';
          screen.innerHTML = layout(html, "", true);
          return;
        }
        if (!plan) {
          html += '<div class="empty-state"><h3>' + escapeHtml(department.name) + ' için ders planı arşivlenmedi</h3>'
            + '<p>Bilgi Paketi\'nde bu programın ders planı sayfası bulunamadı. Arşivlenmiş program sayısı: '
            + (curriculumData.programs || []).length + '. Eksik olanlar <strong>uydurulmaz</strong>; sayfa bulunduğunda eklenir.</p></div>'
            + '<div class="local-note">' + icon("info") + '<span>Ders planı ile haftalık ders programı ayrı kaynaklardır; bu bölümün haftalık programı olabilir.</span></div>';
          screen.innerHTML = layout(html, "", true);
          return;
        }

        var grades = curriculumGrades(plan);
        var grade = curriculumActiveGrade(plan);
        var semester = state.curriculumSemester === "bahar" ? "bahar" : "guz";
        var courses = curriculumCourses(plan, grade, semester);
        var other = curriculumCourses(plan, grade, semester === "guz" ? "bahar" : "guz");
        var total = 0;
        var flaggedTotal = 0;
        grades.forEach(function (g) {
          ["guz", "bahar"].forEach(function (sem) {
            curriculumCourses(plan, g, sem).forEach(function (course) {
              total += 1;
              if (course.status === "needs_review") flaggedTotal += 1;
            });
          });
        });

        html += '<div class="profile-card"><span class="icon-tile">' + icon(department.icon) + '</span><span><span class="profile-title">' + escapeHtml(plan.program_name) + '</span><span class="profile-meta">' + escapeHtml(currentFaculty().name) + ' · ' + total + (team() ? ' ders satırı' : ' ders') + '</span></span></div>'
          + '<div class="chips">' + grades.map(function (g) {
              return '<button class="chip ' + (g === grade ? "active" : "") + '" data-plan-grade="' + escapeHtml(g) + '">' + escapeHtml(planGradeLabel(plan, g)) + '</button>';
            }).join("") + '</div>'
          + '<div class="chips">'
          + '<button class="chip ' + (semester === "guz" ? "active" : "") + '" data-plan-semester="guz">Güz</button>'
          + '<button class="chip ' + (semester === "bahar" ? "active" : "") + '" data-plan-semester="bahar">Bahar</button>'
          + '</div>'
          + '<section class="section"><div class="section-heading"><h2>' + escapeHtml(planGradeLabel(plan, grade)) + ' · ' + curriculumSemesterLabel(semester) + '</h2><span class="list-meta">' + courses.length + ' ders</span></div>'
          + (courses.length
              ? '<div class="plan-stack">' + courses.map(curriculumCourseRow).join("") + '</div>'
              : '<div class="empty-state"><h3>Bu yarıyıl için satır yok</h3><p>Kaynak sayfada bu sınıf ve yarıyıl için ders listelenmemiş' + (other.length ? '; diğer yarıyılda ' + other.length + ' ders var' : "") + '.</p></div>')
          + '</section>'
          + '<section class="section">' + curriculumSourceCard(plan) + '</section>'
          + (flaggedTotal && team()
              ? '<div class="local-note">' + icon("alert") + '<span><strong>' + flaggedTotal + ' satır insan kontrolü bekliyor.</strong> Kaynak sayfa aynı dersi birden çok tipte listelediği için hangisinin geçerli olduğu belgeden okunamadı.</span></div>'
              : "")
          + (team() ? '<div class="local-note">' + icon("info") + '<span><strong>AKTS ve kredi gösterilmiyor:</strong> kaynak ders planı tablosunda kredi sütunu yok. Mezuniyet kredisi bu ekrandan hesaplanamaz.</span></div>' : '')
          + '<div class="local-note">' + icon("info") + '<span>Ders planı, haftalık ders programından farklıdır: burada hangi dersi alacağın yazar, hangi saatte göreceğin yazmaz. Seçmeli ders havuzunun tamamı listelenir; hepsini almayacaksın.</span></div>';

        screen.innerHTML = layout(html, "", true);
      }

      function renderCampus() {
        var department = currentDepartment();
        var faculty = currentFaculty();
        var matches = campusMatches();
        var shown = matches.slice(0, 40);
        var next = selectedCourses().filter(function (course) { return course.day === state.day; })[0] || selectedCourses()[0];
        var html = ''
          + '<div class="screen-header"><button class="icon-button" data-route="more" aria-label="Geri">' + icon("back") + '</button><h1 class="screen-title">Kampüs rehberi</h1><span style="width:44px"></span></div>'
          + '<div class="search-wrap">' + icon("search") + '<input id="campus-search" class="search-input" type="search" value="' + escapeHtml(state.campusQuery) + '" placeholder="Akademik birim, program veya yerleşke ara" aria-label="Kampüs rehberinde ara"></div>'
          + '<div class="chips">'
          + '<button class="chip ' + (state.campusFilter ? "" : "active") + '" data-campus="">Tümü</button>'
          + campusList().map(function (item) {
              return '<button class="chip ' + (state.campusFilter === item.name ? "active" : "") + '" data-campus="' + escapeHtml(item.name) + '">'
                + escapeHtml(item.name.replace(/ Yerleşkesi| Yerleşke/, "")) + ' · ' + item.count + '</button>';
            }).join("")
          + '</div>'
          + '<div class="map-card" style="margin-top:11px"><div class="map-copy"><div style="display:flex;gap:12px;align-items:center"><span class="icon-tile">' + icon("building") + '</span><span><h2>' + escapeHtml(faculty.name) + '</h2><p>' + escapeHtml(department.name) + ' · ' + escapeHtml(department.campus) + '</p></span></div><div class="local-note" style="margin-top:12px">' + icon("info") + '<span>Yerleşke adı katalog kaydından gelir · Kesin rota değildir</span></div></div>'
          + '<div class="map-placeholder" aria-label="Şematik kampüs görünümü"><span class="building one"></span><span class="building two"></span><span class="building three"></span><span class="map-pin">' + icon("building") + '</span><span class="map-label">' + facultyShortName() + '</span><span class="map-watermark">Şematik görünüm</span></div></div>'
          + '<div class="button-row"><button class="secondary-button" data-sheet="building">Bina bilgileri</button></div>'
          + (next ? '<section class="section"><button class="info-card deadline" data-course="' + next.id + '"><span class="icon-tile">' + icon("calendar") + '</span><span><span class="card-title">Seçili dersliğin: ' + escapeHtml(next.location) + '</span><span class="card-copy">' + escapeHtml(next.name) + '</span></span>' + icon("chevron") + '</button></section>' : '')
          + '<section class="section"><div class="section-heading"><h2>Birim ve program</h2><span class="list-meta">' + matches.length + ' sonuç</span></div>'
          + (shown.length
              ? '<div class="list-stack">' + shown.map(campusResultCard).join("") + '</div>'
                + (matches.length > shown.length ? '<p class="sheet-copy">İlk ' + shown.length + ' sonuç gösteriliyor; aramayı daralt.</p>' : "")
              : '<div class="empty-state"><h3>Eşleşme yok</h3><p>Arama ya da yerleşke süzgecini değiştir.</p></div>')
          + '</section>';
        screen.innerHTML = layout(html, "", true);
        var search = document.getElementById("campus-search");
        if (search) {
          search.addEventListener("input", function () {
            state.campusQuery = search.value;
            var caret = search.selectionStart;
            renderCampus();
            var again = document.getElementById("campus-search");
            if (again) { again.focus(); try { again.setSelectionRange(caret, caret); } catch (error) {} }
          });
        }
      }

      /*
       * Her etkileşim ekranı innerHTML ile yeniden çizer; bu, kaydırılan
       * `.screen-scroll` kabını da yeniden yaratır ve konum 0'a döner. Ders
       * seçerken, devamsızlık +/− ya da not girerken sayfa en üste atlıyordu.
       * Aynı ekranda kalındıkça önceki konum geri yüklenir; başka ekrana (ya da
       * başka bir dersin ayrıntısına) geçişte sayfa her zamanki gibi üstten açılır.
       */
      var lastScreenKey = null;

      function screenKey() {
        return state.route + "|" + (state.route === "course-detail" ? state.detailCourse : "");
      }

      function render() {
        var key = screenKey();
        var oldScroll = screen.querySelector(".screen-scroll");
        var keepTop = oldScroll && key === lastScreenKey ? oldScroll.scrollTop : null;
        renderRoute();
        lastScreenKey = screenKey();
        if (keepTop !== null && lastScreenKey === key) {
          var newScroll = screen.querySelector(".screen-scroll");
          if (newScroll) newScroll.scrollTop = keepTop;
        }
      }

      function renderRoute() {
        applyTheme();
        applyAccessibility();
        updateTestControls();
        if (state.route === "onboarding-1") return renderOnboardingOne();
        if (state.route === "onboarding-2") return renderOnboardingTwo();
        if (state.route === "today") return renderToday();
        if (state.route === "program") return renderProgram();
        if (state.route === "agenda") return renderAgenda();
        if (state.route === "more") return renderMore();
        if (state.route === "notifications") return renderNotifications();
        if (state.route === "course-add") return renderCourseAdd();
        if (state.route === "course-detail") return renderCourseDetail();
        if (state.route === "campus") return renderCampus();
        if (state.route === "grades") return renderGrades();
        if (state.route === "attendance") return renderAttendance();
        if (state.route === "exams") return renderExams();
        if (state.route === "curriculum") return renderCurriculum();
        state.route = state.onboarded ? "today" : "onboarding-1";
        renderRoute();
      }

      // İkinci program penceresinde seçim kaydedilene kadar burada tutulur.
      var secondDraft = {};

      function secondProgramIds(departmentId) {
        var ids = {};
        courses.forEach(function (course) { if (course.departmentId === departmentId) ids[course.id] = true; });
        (state.customCourses || []).forEach(function (item) { if (item.departmentId === departmentId) ids[item.id] = true; });
        return ids;
      }

      // Ana program değişince yalnız ana programın seçimleri silinir; ikinci programın dersleri
      // kalır. Yeni ana program ikinci programla aynıysa ikinci program kaldırılır.
      function keepSecondSelections() {
        var secondId = state.second && state.second.department;
        if (secondId && secondId === state.department) {
          state.second = { department: "", grade: 1, kind: "cap" };
          state.pickProgram = "main";
          secondId = "";
        }
        var keep = secondId ? secondProgramIds(secondId) : {};
        state.selected = state.selected.filter(function (id) { return keep[id]; });
      }

      function showSheet(type) {
        var title = "Ayrıntı";
        var body = "";
        if (type === "source") {
          var department = currentDepartment();
          var sourceUrl = safeOfficialUrl(department.sourceUrl || department.directoryUrl);

          body = '<div class="settings-card">' + settingRow("cloud", "Programı yedekle", "", "backup") + settingRow("calendar", "Takvime aktar", "", "export") + settingRow("database", "Veri ayrıntısı", "", "source") + '</div>';
        } else if (type === "course-actions") {
          title = "Ders işlemleri";
          body = '<div class="settings-card"><button class="setting-row" data-route="course-add">' + icon("plus") + '<span>Dersleri düzenle</span>' + icon("chevron") + '</button><button class="setting-row" data-sheet="report">' + icon("alert") + '<span>Hatalı bilgi bildir</span>' + icon("chevron") + '</button></div>';
        } else if (type === "building") {
          title = "Bina bilgileri";
          body = '<div class="sheet-copy"><p><strong>' + escapeHtml(currentFaculty().name) + '</strong><br>' + escapeHtml(currentDepartment().campus) + '</p><p>Bu kayıt şematiktir. Adres, iletişim ve konum yalnız resmî kaynakla doğrulandıktan sonra yayımlanacaktır.</p></div>';
        } else if (type === "test") {

        }
        sheetTitle.textContent = title;
        sheetBody.innerHTML = body;
        sheetBackdrop.classList.remove("hidden");
        var closeButton = sheetBackdrop.querySelector('[data-action="close-sheet"]');

      function toggleRow(label, key, on) {
        return '<div class="toggle-row"><span>' + label + '</span><button class="toggle ' + (on ? "on" : "") + '" data-toggle="' + key + '" role="switch" aria-checked="' + on + '" aria-label="' + label + '"></button></div>';
      }

      function closeSheet() {
        sheetBackdrop.classList.add("hidden");
      }

      function toast(message) {
        clearTimeout(toastTimer);
        toastElement.textContent = message;
        toastElement.classList.add("show");
        toastTimer = setTimeout(function () { toastElement.classList.remove("show"); }, 2600);
      }

      function updateTestControls() {
        document.querySelectorAll("[data-test-mode]").forEach(function (button) {
          button.classList.toggle("active", button.getAttribute("data-test-mode") === state.dataMode);
        });
      }

      document.addEventListener("click", function (event) {
        var target = event.target.closest("button");
        if (!target) return;

        if (target.hasAttribute("data-route")) {
          closeSheet();
          route(target.getAttribute("data-route"));
          return;
        }
        if (target.hasAttribute("data-course")) {
          state.detailCourse = target.getAttribute("data-course");
          state.previousRoute = state.route;
          route("course-detail", state.route);
          return;
        }
        if (target.hasAttribute("data-course-toggle")) {
          var id = target.getAttribute("data-course-toggle");
          var index = state.selected.indexOf(id);
          if (index === -1) {
            state.selected.push(id);
            var newConflict = conflicts().find(function (item) { return item.a.id === id || item.b.id === id; });
            if (newConflict && newConflict.shared) toast("Ders eklendi; aynı saat ve derslikte aynı adlı bir dersin var — ortak ders olabilir.");
            else if (newConflict) toast("Ders eklendi; " + newConflict.start + "–" + newConflict.end + " çakışması oluştu.");
            else {
              var rest = sessionsOf(absenceKey(myCoursePool().find(function (c) { return c.id === id; }) || {})).filter(function (c) { return state.selected.indexOf(c.id) === -1; }).length;
              toast(rest ? "Ders eklendi. Bu dersin " + rest + " oturumu daha var." : "Ders programa eklendi.");
            }
          } else {
            state.selected.splice(index, 1);
            toast("Ders programdan çıkarıldı.");
          }
          persist();
          render();
          return;
        }
        if (target.hasAttribute("data-group-add")) {
          var groupKey = target.getAttribute("data-group-add");
          var added = 0;
          sessionsOf(groupKey).forEach(function (c) {
            if (state.selected.indexOf(c.id) === -1) { state.selected.push(c.id); added += 1; }
          });
          var groupConflict = conflicts().find(function (item) { return !item.shared; });
          persist();
          render();
          toast(added + " oturum eklendi" + (groupConflict ? "; " + groupConflict.start + "–" + groupConflict.end + " çakışması var." : "."));
          return;
        }
        if (target.hasAttribute("data-conflict-choice")) {
          var choiceRef = target.getAttribute("data-conflict-choice").split("::");
          var choiceList = (state.gradeConflicts || {})[choiceRef[0]];
          var chosen = choiceList && choiceList[Number(choiceRef[1])];
          if (chosen) {
            state.grades[choiceRef[0]] = chosen.record;
            delete state.gradeConflicts[choiceRef[0]];
            persist();
            render();
            toast("Seçtiğin not kaydı geçerli; diğeri silindi.");
          }
          return;
        }
        if (target.hasAttribute("data-grade-remove")) {
          var removeRef = target.getAttribute("data-grade-remove").split(":");
          var removeRecord = gradesOf(removeRef[0]);
          removeRecord.components = removeRecord.components.filter(function (item) { return item.id !== removeRef[1]; });
          persist();
          render();
          return;
        }
        if (target.hasAttribute("data-grade-new")) {
          var newName = target.getAttribute("data-grade-new");
          var newRecord = gradesOf(state.detailCourse);
          var newId = "c" + Date.now().toString(36);
          newRecord.components.push({ id: newId, name: newName, weight: 0, score: null });
          persist();
          closeSheet();
          render();
          toast(newName + " eklendi. Ağırlığını gir.");
          return;
        }
        if (target.hasAttribute("data-absence-add")) {
          var addRef = target.getAttribute("data-absence-add").split("::");
          var addError = addAbsence(addRef[0], addRef[1], addRef[2]);
          if (addError) { toast(addError); return; }
          persist();
          render();
          var addGroup = absenceGroups().find(function (g) { return g.key === addRef[0]; });
          toast(addGroup && addGroup.level === "over" ? "Tahmini sınırı aştın. Resmî durumu bölümüne doğrulat." : "Devamsızlık işlendi. Yanlışsa \u201cGeri al\u201d.");

        if (target.hasAttribute("data-absence-past")) {

          var pastDate = card && card.querySelector("[data-absence-date]");
          var pastError = addAbsence(pastKey, pastSession ? pastSession.value : "", pastDate ? pastDate.value : "");

          render();

        if (target.hasAttribute("data-absence-undo")) {

        if (target.hasAttribute("data-absence-snap")) {

          var snapDate = snapCard && snapCard.querySelector("[data-absence-snap-date]");

        if (target.hasAttribute("data-absence-week")) {

        if (target.hasAttribute("data-day")) {

          render();
          return;
        }
        if (target.hasAttribute("data-agenda")) {
          state.agenda = target.getAttribute("data-agenda");
          persist();
          render();
          return;
        }
        if (target.hasAttribute("data-course-filter")) {
          state.courseFilter = target.getAttribute("data-course-filter");
          persist();
          render();
          return;
        }
        if (target.hasAttribute("data-gpa-repeat")) {
          var repeatId = target.getAttribute("data-gpa-repeat");
          var repeatRecord = gradesOf(repeatId);
          repeatRecord.repeat = !repeatRecord.repeat;
          if (!repeatRecord.repeat) repeatRecord.previousLetter = "";
          persist();
          render();
          return;
        }
        if (target.hasAttribute("data-exam")) {
          state.examId = target.getAttribute("data-exam");
          showSheet("exam");
          return;
        }
        if (target.hasAttribute("data-calendar-event")) {
          state.calendarEvent = target.getAttribute("data-calendar-event");
          showSheet("calendar");
          return;
        }
        if (target.hasAttribute("data-announcement")) {
          state.announcementSource = target.getAttribute("data-announcement");
          showSheet("announcement");
          return;
        }
        if (target.hasAttribute("data-copy")) {
          copyFromArea(target.getAttribute("data-copy"));
          return;
        }
        if (target.hasAttribute("data-download")) {
          downloadFromArea(target.getAttribute("data-download"));
          return;
        }
        if (target.hasAttribute("data-text-scale")) {
          state.textScale = target.getAttribute("data-text-scale");
          persist();
          applyAccessibility();
          showSheet("appearance");
          return;
        }
        if (target.hasAttribute("data-plan-grade")) {
          state.curriculumGrade = target.getAttribute("data-plan-grade");
          persist();
          renderCurriculum();
          return;
        }
        if (target.hasAttribute("data-plan-semester")) {
          state.curriculumSemester = target.getAttribute("data-plan-semester");
          persist();
          renderCurriculum();
          return;
        }
        if (target.hasAttribute("data-campus")) {
          state.campusFilter = target.getAttribute("data-campus");
          persist();
          renderCampus();
          return;
        }
        if (target.hasAttribute("data-campus-program")) {
          state.campusProgram = target.getAttribute("data-campus-program");
          showSheet("campus-program");
          return;
        }
        if (target.hasAttribute("data-sheet")) {
          if (target.getAttribute("data-sheet") === "second-program") secondDraft = {};
          showSheet(target.getAttribute("data-sheet"));
          return;
        }
        if (target.hasAttribute("data-pick")) {
          state.pickProgram = target.getAttribute("data-pick") === "second" ? "second" : "main";
          state.query = "";
          state.courseFilter = "grade";
          persist();
          render();
          return;
        }
        if (target.getAttribute("data-action") === "second-save") {
          var saveId = secondDraft.department || (state.second && state.second.department) || "";
          var saveDept = departments[saveId];
          if (!saveDept || saveId === state.department) { toast("Ana programından farklı bir program seç."); return; }
          var saveGrade = Number(secondDraft.grade || (state.second && state.second.grade) || 1);
          if (!Number.isInteger(saveGrade) || saveGrade < 1 || saveGrade > gradeOptions(saveDept).length) saveGrade = 1;
          var oldSecond = state.second && state.second.department;
          if (oldSecond && oldSecond !== saveId) {
            var dropOld = secondProgramIds(oldSecond);
            state.selected = state.selected.filter(function (id) { return !dropOld[id]; });
          }
          state.second = { department: saveId, grade: saveGrade, kind: secondDraft.kind || (state.second && state.second.kind) || "cap" };
          state.pickProgram = "second";
          state.query = "";
          state.courseFilter = "grade";
          secondDraft = {};
          persist();
          closeSheet();
          route("course-add");
          toast(secondKindLabel() + " eklendi; şimdi bu programdan derslerini seç.");
          return;
        }
        if (target.getAttribute("data-action") === "second-remove") {
          var removeSecond = state.second && state.second.department;
          if (removeSecond) {
            var dropIds = secondProgramIds(removeSecond);
            state.selected = state.selected.filter(function (id) { return !dropIds[id]; });
          }
          state.second = { department: "", grade: 1, kind: "cap" };
          state.pickProgram = "main";
          secondDraft = {};
          persist();
          closeSheet();
          render();
          toast("İkinci program ve dersleri programından kaldırıldı.");
          return;
        }
        if (target.hasAttribute("data-test-mode")) {
          state.dataMode = target.getAttribute("data-test-mode");
          persist();
          closeSheet();
          render();
          toast("Veri durumu değiştirildi.");
          return;
        }
        if (target.hasAttribute("data-toggle")) {
          var key = target.getAttribute("data-toggle");
          if (key === "theme") { state.theme = resolvedTheme() === "dark" ? "light" : "dark"; state.themeChosen = true; }
          else state[key] = !state[key];
          persist();
          showSheet(key === "theme" || key === "reduceMotion" ? "appearance" : "notifications");
          render();
          return;
        }

        var action = target.getAttribute("data-action");
        if (action === "custom-course-save") {
          var ccName = cleanText((document.getElementById("cc-name") || {}).value || "", 60, false);
          if (!ccName) { toast("Ders adı gerekli; kontrol karakteri kullanma."); return; }
          var ccDay = (document.getElementById("cc-day") || {}).value || "";
          var ccStart = (document.getElementById("cc-start") || {}).value || "";
          var ccEnd = (document.getElementById("cc-end") || {}).value || "";
          var ccRoom = cleanText((document.getElementById("cc-room") || {}).value || "", 30, true);
          if (ccRoom === null) { toast("Derslik en fazla 30 karakter olabilir."); return; }
          if ((STATE_DAYS.indexOf(ccDay) === -1 && ccDay !== "") || !validClock(ccStart) || !validClock(ccEnd)) { toast("Gün veya saat geçersiz."); return; }
          if (ccStart && ccEnd && ccStart >= ccEnd) { toast("Bitiş saati başlangıçtan sonra olmalı."); return; }
          if (!state.customCourses) state.customCourses = [];
          var ccId = "ozel-" + Date.now().toString(36);
          state.customCourses.push({
            id: ccId,
            departmentId: pickDepartment().id,
            name: ccName,
            grade: pickGrade(),
            day: ccDay,
            start: ccStart,
            end: ccEnd,
            room: ccRoom
          });
          state.selected.push(ccId);
          persist();
          closeSheet();
          render();
          toast(ccDay && ccStart && ccEnd ? "Ders programına eklendi." : "Ders eklendi. Saat girmediğin için programda görünmez.");
          return;
        }
        if (target.hasAttribute("data-custom-remove")) {
          var removeId = target.getAttribute("data-custom-remove");
          var removeKey = gradeKeyOf(removeId);
          state.customCourses = (state.customCourses || []).filter(function (item) { return item.id !== removeId; });
          state.selected = state.selected.filter(function (id) { return id !== removeId; });
          // Not ders başına tutulur; aynı dersin başka seçili oturumu kalıyorsa not silinmez.
          if (state.grades && !selectedCourses().some(function (c) { return absenceKey(c) === removeKey; })) delete state.grades[removeKey];
          persist();
          render();
          toast("Ders kaldırıldı.");
          return;
        }
        if (action === "onboarding-next") {
          if (!setupDone("grade")) return;
          state.query = "";
          state.courseFilter = "grade";
          route("onboarding-2");
        }
        if (action === "finish-onboarding") {
          state.onboarded = true;
          state.route = "today";
          persist();
          render();
          toast(state.selected.length ? "Programın oluşturuldu." : "Bölümün kaydedildi.");
        }
        if (action === "mark-read") {
          state.notificationsRead = true;
          persist();
          render();
          toast("Bildirimler okundu olarak işaretlendi.");
        }
        if (action === "close-sheet") closeSheet();
        if (action === "toggle-conflict") {
          var pair = currentDepartment().conflictPair;
          if (!pair || pair.length !== 2) {
            closeSheet();
            toast("Bu program için örnek çakışma verisi yok.");
            return;
          }
          var pairActive = pair.every(function (id) { return state.selected.indexOf(id) !== -1; });
          if (pairActive) state.selected = state.selected.filter(function (id) { return id !== pair[1]; });
          else pair.forEach(function (id) { if (state.selected.indexOf(id) === -1) state.selected.push(id); });
          state.onboarded = true;
          state.route = "program";
          state.day = currentDepartment().defaultDay;
          persist();
          closeSheet();
          render();
          toast(pairActive ? "Örnek çakışma kaldırıldı." : "Örnek çakışma eklendi.");
        }
        if (action === "team-off") {
          state.teamView = false;
          persist();
          if (location.hash === "#ekip") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
          applyViewFromHash();
          render();
          toast("Öğrenci görünümü.");
          return;
        }
        if (action === "reset-prototype") {
          localStorage.removeItem(STORAGE_KEY);
          state = freshDefaultState();
          closeSheet();
          render();
          toast("Prototip sıfırlandı.");
        }
        if (action === "backup-restore") {
          var pasted = ((document.getElementById("backup-in") || {}).value || "").trim();
          if (!pasted) { toast("Önce yedek metnini yapıştır."); return; }
          var problem = restoreBackup(pasted);
          if (problem) { toast(problem); return; }
          closeSheet();
          render();
          toast("Yedek geri yüklendi.");
          return;
        }
        if (action === "copy-contact") {
          var copied = function () { toast("Adres kopyalandı."); };
          try {
            navigator.clipboard.writeText(CONTACT_EMAIL).then(copied, function () { selectContact(); });
          } catch (error) { selectContact(); }
          return;
        }
        if (action === "report-build") {
          var out = document.getElementById("report-out");
          if (out) {
            out.value = reportText();
            toast("Bildirim metni güncellendi.");
          }
          return;
        }
        if (action === "prototype-link") toast("Gerçek bağlantı prototipte kapalı.");
      });

      document.addEventListener("change", function (event) {
        if (event.target.hasAttribute && event.target.hasAttribute("data-absence-limit")) {
          var limitRaw = event.target.value.trim();
          var limitValue = limitRaw === "" ? null : Math.floor(Number(limitRaw));
          if (limitValue !== null && (isNaN(limitValue) || limitValue < 0)) limitValue = null;
          var limitRef = event.target.getAttribute("data-absence-limit").split("::");
          var limitKind = limitRef[1] === "uygulama" ? "uygulama" : "teorik";
          var limitRecord = absenceRecord(limitRef[0], true);
          if (limitValue === null) delete limitRecord.limits[limitKind]; else limitRecord.limits[limitKind] = limitValue;
          persist();
          // change, kutu odağı kaybederken de gelir; o an başka bir düğmenin
          // tıklaması ekranı zaten yeniden çiziyor olabilir. İç içe innerHTML
          // yazımı tarayıcı hatası verdiği için çizim bir sonraki tura bırakılır.
          setTimeout(render, 0);
          toast(limitValue === null ? "Tahmini sınıra dönüldü." : "Sınır " + limitValue + " ders saati olarak kaydedildi.");
          return;
        }
        // Yalnız harf seçimi tam yeniden çizim ister; satırın ipucu metni değişir.
        // Sayı alanları `input` olayında yerinde güncellenir, ekran bozulmaz.
        if (event.target.tagName === "SELECT" && event.target.hasAttribute("data-gpa")) {
          var sref = event.target.getAttribute("data-gpa").split(":");
          if (sref[0] !== "__prev") {
            gradesOf(sref[0])[sref[1]] = event.target.value;
            persist();
            render();
          }
          return;
        }
        if (event.target.id === "second-dept" || event.target.id === "second-kind" || event.target.id === "second-grade") {
          if (event.target.id === "second-dept") { secondDraft.department = event.target.value; secondDraft.grade = 1; }
          if (event.target.id === "second-kind") secondDraft.kind = event.target.value === "yandal" ? "yandal" : "cap";
          if (event.target.id === "second-grade") secondDraft.grade = Number(event.target.value);
          if (event.target.id !== "second-grade") showSheet("second-program");
          return;
        }
        if (event.target.id === "faculty-select") {
          state.faculty = event.target.value;
          var department = Object.keys(departments).map(function (key) { return departments[key]; }).find(function (item) { return item.facultyId === state.faculty; });
          state.department = department.id;
          state.grade = 1;
          if (!state.setup) state.setup = {};
          state.setup.faculty = true;
          state.setup.department = false;
          state.setup.grade = false;
          keepSecondSelections();
          state.day = department.defaultDay;
          state.detailCourse = department.conflictPair[0] || "";
          state.query = "";
          state.courseFilter = "grade";
          persist();
          renderOnboardingOne();
          return;
        }
        if (event.target.id === "department-select") {
          var nextDepartment = departments[event.target.value];
          state.department = nextDepartment.id;
          state.faculty = nextDepartment.facultyId;
          state.grade = Math.min(state.grade, nextDepartment.years);
          if (!state.setup) state.setup = {};
          state.setup.faculty = true;
          state.setup.department = true;
          if (!state.onboarded) { state.setup.grade = false; state.grade = 1; }
          keepSecondSelections();
          state.day = nextDepartment.defaultDay;
          state.detailCourse = nextDepartment.conflictPair[0] || "";
          state.query = "";
          state.courseFilter = "grade";
          persist();
          renderOnboardingOne();
          return;
        }
        if (event.target.id === "advisor-select") {
          var advisorDept = event.target.getAttribute("data-advisor-dept");
          if (!state.advisors) state.advisors = {};
          if (event.target.value) state.advisors[advisorDept] = event.target.value;
          else delete state.advisors[advisorDept];
          persist();
          render();
          toast(event.target.value ? "Danışmanının saatleri gösteriliyor." : "Danışman seçimi kaldırıldı.");
          return;
        }
        if (event.target.id === "grade-select") {
          state.grade = Number(event.target.value);
          if (!state.setup) state.setup = {};
          state.setup.grade = true;
          state.query = "";
          state.courseFilter = "grade";
          persist();
          renderOnboardingOne();
        }
      });

      document.addEventListener("input", function (event) {
        if (event.target.hasAttribute && event.target.hasAttribute("data-gpa")) {
          // <select> hem input hem change tetikler; seçimi yalnız change işler.
          if (event.target.tagName === "SELECT") return;
          var gref = event.target.getAttribute("data-gpa").split(":");
          var graw = event.target.value.trim();
          if (gref[0] === "__prev") {
            if (!state.gpa) state.gpa = { prevAverage: null, prevEcts: null, expanded: false };
            // Türkçe klavyede ondalık ayırıcı virgüldür; ikisini de kabul et.
            var parsed = graw === "" ? null : Number(graw.replace(",", "."));
            if (parsed !== null && (isNaN(parsed) || parsed < 0)) parsed = null;
            state.gpa[gref[1] === "average" ? "prevAverage" : "prevEcts"] = parsed;
          } else {
            var grecord = gradesOf(gref[0]);
            grecord[gref[1]] = graw === "" ? (gref[1] === "letter" ? "" : null) : (gref[1] === "ects" ? Number(graw) : graw);
          }
          persist();
          var gsummary = document.getElementById("gpa-summary");
          if (gsummary) gsummary.innerHTML = gpaSummaryHtml();
          if (gref[0] !== "__prev") {
            var hintNode = document.getElementById("gpa-hint-" + gref[0]);
            if (hintNode) {
              var hintRecord = gradesOf(gref[0]);
              var hintInfo = letterInfo(hintRecord.letter);
              hintNode.textContent = hintRecord.letter && hintInfo && !hintInfo.ortalamaya_girer
                ? hintInfo.anlam
                : (hintRecord.letter && !hintRecord.ects ? "AKTS gir" : "");
            }
          }
          var ectsLabel = document.getElementById("gpa-prev-ects-label");
          if (ectsLabel) {
            var prevTerms = state.gpa && state.gpa.prevEcts ? Math.round(Number(state.gpa.prevEcts) / 30) : null;
            ectsLabel.textContent = prevTerms ? "≈ " + prevTerms + " dönem" : "Toplam";
          }
          return;
        }
        if (event.target.hasAttribute && event.target.hasAttribute("data-grade")) {
          var ref = event.target.getAttribute("data-grade").split(":");
          var record = gradesOf(ref[0]);
          var raw = event.target.value.trim();
          var value = raw === "" ? null : Math.max(0, Math.min(100, Number(raw)));
          if (ref[1] === "__target") {
            record.target = value;
          } else {
            var component = record.components.find(function (item) { return item.id === ref[1]; });
            if (component) component[ref[2]] = ref[2] === "weight" ? (value === null ? 0 : value) : value;
          }
          persist();
          var summary = document.getElementById("grade-summary");
          if (summary) summary.innerHTML = gradeSummaryHtml(ref[0]);
          return;
        }
        if (event.target.id === "course-search") {
          state.query = event.target.value;
          persist();
          var cursor = event.target.selectionStart;
          if (state.route === "onboarding-2") renderOnboardingTwo();
          else renderCourseAdd();
          var input = document.getElementById("course-search");
          if (input) {
            input.focus();
            input.setSelectionRange(cursor, cursor);
          }
        }
      });

      document.addEventListener("toggle", function (event) {
        if (event.target.classList && event.target.classList.contains("gpa-details")) {
          if (!state.gpa) state.gpa = { prevAverage: null, prevEcts: null, expanded: false };
          state.gpa.expanded = event.target.open;
          persist();
        }
      }, true);

      sheetBackdrop.addEventListener("click", function (event) {
        if (event.target === sheetBackdrop) closeSheet();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeSheet();
      });

      // Bildirim metni en son yazılanı taşısın: bağlantı açılmadan hemen önce yeniden üretilir.
      document.addEventListener("click", function (event) {
        var link = event.target.closest && event.target.closest('a[data-mail="report"]');
        if (!link) return;
        link.href = mailtoHref(reportSubject(), reportText());
        var out = document.getElementById("report-out");
        if (out) out.value = reportText();
      }, true);

      window.addEventListener("online", function () { render(); });
      window.addEventListener("offline", function () { render(); });

      // Çevrimdışı önbellek yalnız yayında (https) etkin; yerel geliştirmede ?sw=1 ile denenir.
      if ("serviceWorker" in navigator && (location.protocol === "https:" || /[?&]sw=1/.test(location.search))) {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
      // Tarayıcıdan, yer darlığında bu sitenin verisini silmemesini iste (izin vermeyebilir).
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (error) {}

      migrateAttendance();
      applyViewFromHash();
      window.addEventListener("hashchange", function () { applyViewFromHash(); render(); });
      render();
    }());
  </script>
</body>
</html>
